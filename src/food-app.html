      });
      var servings = 1;
      try { servings = app.getRecipeBaseServings(recipe); } catch (e) { servings = parseInt(recipe.servings, 10) || 2; }
      if (!(servings > 0)) servings = 1;
      var per = { kcal: tot.kcal / servings, p: tot.p / servings, c: tot.c / servings, f: tot.f / servings };
      // Abgleich mit der im Rezept angegebenen kcal-Zahl (Flamme-Badge = Quelle der Wahrheit)
      var listed = parseInt(String(recipe.calories || '').replace(/[^\d]/g, ''), 10);
      if ((!isFinite(per.kcal) || per.kcal < 80) && listed > 0) {
        per = { kcal: listed, p: listed * 0.22 / 4, c: listed * 0.48 / 4, f: listed * 0.30 / 9 };
      } else if (listed > 0 && per.kcal > 0) {
        // Makros proportional auf die angegebene kcal-Zahl skalieren, damit Badge und Detail identisch sind
        var factor = listed / per.kcal;
        if (!isFinite(factor) || factor <= 0) factor = 1;
        per = { kcal: listed, p: per.p * factor, c: per.c * factor, f: per.f * factor };
      }
      tot = { kcal: per.kcal * servings, p: per.p * servings, c: per.c * servings, f: per.f * servings };

      var out = {
        kcal: Math.round(tot.kcal), p: Math.round(tot.p), c: Math.round(tot.c), f: Math.round(tot.f),
        perServing: { kcal: Math.round(per.kcal), p: Math.round(per.p), c: Math.round(per.c), f: Math.round(per.f) },
        servings: servings
      };
      _nutriCache[recipe.id] = out;
      return out;
    }
    app.getRecipeNutrition = recipeNutrition;

    /* ================= 2. PERSÖNLICHE DATEN & ZIELE ================= */
    var ACTIVITY = {
      low: { f: 1.2, label: 'Kaum aktiv (Bürojob)' },
      light: { f: 1.375, label: 'Leicht aktiv (1–2× Sport)' },
      moderate: { f: 1.55, label: 'Moderat aktiv (3–4× Sport)' },
      high: { f: 1.725, label: 'Sehr aktiv (5–6× Sport)' },
      athlete: { f: 1.9, label: 'Extrem aktiv (Beruf + Sport)' }
    };
    var GOALS = { lose: 'Abnehmen', keep: 'Gewicht halten', gain: 'Zunehmen / Muskelaufbau' };

    function defaultProfile() {
      return { age: 30, sex: 'male', height: 178, weight: 78, activity: 'moderate', goal: 'keep', proteinOverride: null, setup: false };
    }
    function getProfile() {
      var p = readJson(K_PROFILE, null);
      return Object.assign(defaultProfile(), p || {});
    }
    function saveProfile(p) { writeJson(K_PROFILE, p); }
    app.getNutriProfile = getProfile;

    function computeGoals(p) {
      var w = Math.max(30, Math.min(300, +p.weight || 78));
      var h = Math.max(120, Math.min(230, +p.height || 175));
      var a = Math.max(14, Math.min(100, +p.age || 30));
      var bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'female' ? -161 : 5);
      var tdee = bmr * ((ACTIVITY[p.activity] || ACTIVITY.moderate).f);
      var kcal = tdee;
      if (p.goal === 'lose') kcal = tdee - Math.min(500, tdee * 0.18);
      else if (p.goal === 'gain') kcal = tdee + Math.min(400, tdee * 0.12);
      // Keine extremen Ziele erzeugen
      var floor = p.sex === 'female' ? 1200 : 1500;
      var lowWarning = kcal < floor;
      kcal = Math.max(floor, Math.round(kcal / 10) * 10);

      // Eiweiß: 1,6 g/kg (Richtwert), manuell überschreibbar
      var protein = p.proteinOverride != null && +p.proteinOverride > 0
        ? Math.round(+p.proteinOverride)
        : Math.round(w * 1.6);
      // Fett: 0,8 g/kg, mind. 20 % der Kalorien nicht unterschreiten
      var fat = Math.round(Math.max(w * 0.8, kcal * 0.22 / 9));
      // Kohlenhydrate: Rest der Kalorien -> mathematisch konsistent
      var carbKcal = kcal - protein * 4 - fat * 9;
      if (carbKcal < kcal * 0.15) { // Fett leicht senken statt unrealistische Carbs
        fat = Math.max(Math.round(w * 0.6), Math.round((kcal - protein * 4 - kcal * 0.15) / 9));
        carbKcal = kcal - protein * 4 - fat * 9;
      }
      var carbs = Math.max(0, Math.round(carbKcal / 4));
      return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal: kcal, p: protein, c: carbs, f: fat, lowWarning: lowWarning };
    }
    app.getNutriGoals = function () { return computeGoals(getProfile()); };

    /* ================= 3. TAGES-LOG ================= */
    function todayKey(d) {
      var dt = d || new Date();
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }
    function getLog() { var l = readJson(K_LOG, {}); return (l && typeof l === 'object') ? l : {}; }
    function getDay(dateKey) { var l = getLog(); return Array.isArray(l[dateKey]) ? l[dateKey] : []; }
    function setDay(dateKey, entries) { var l = getLog(); l[dateKey] = entries; writeJson(K_LOG, l); }

    function sumDay(entries) {
      return entries.reduce(function (s, e) {
        s.kcal += +e.kcal || 0; s.p += +e.p || 0; s.c += +e.c || 0; s.f += +e.f || 0; return s;
      }, { kcal: 0, p: 0, c: 0, f: 0 });
    }

    app.trackAddEntry = function (recipeId, factorOfRecipe, meal) {
      var r = app.getRecipeById ? app.getRecipeById(recipeId) : null;
      if (!r) return;
      var n = recipeNutrition(r);
      var f = +factorOfRecipe || 0;
      if (f <= 0) return;
      var key = todayKey();
      var entries = getDay(key);
      entries.push({
        uid: 'e' + Date.now() + Math.random().toString(36).slice(2, 6),
        recipeId: r.id, title: r.title, image: r.image || '',
        meal: meal || 'snack',
        recipeServings: n.servings,
        portions: Math.round(f * n.servings * 100) / 100,
        factor: f,
        kcal: Math.round(n.kcal * f), p: Math.round(n.p * f), c: Math.round(n.c * f), f_: 0,
        fat: Math.round(n.f * f),
        ts: Date.now()
      });
      setDay(key, entries);
      app.state.trackAddFor = null;
      app.render();
      try { app._flashToast('✅ Zum Tracking hinzugefügt'); } catch (e) {}
    };

    app.trackRemoveEntry = function (uid) {
      var key = todayKey();
      setDay(key, getDay(key).filter(function (e) { return e.uid !== uid; }));
      app.render();
    };

    function entryMacros(e) { return { kcal: +e.kcal || 0, p: +e.p || 0, c: +e.c || 0, f: (+e.fat || 0) }; }

    function daySummary() {
      var entries = getDay(todayKey());
      var s = entries.reduce(function (acc, e) {
        var m = entryMacros(e);
        acc.kcal += m.kcal; acc.p += m.p; acc.c += m.c; acc.f += m.f; return acc;
      }, { kcal: 0, p: 0, c: 0, f: 0 });
      return { entries: entries, sum: s, goals: computeGoals(getProfile()) };
    }
    app.getTodaySummary = daySummary;

    /* ================= 4. REZEPTVORSCHLÄGE ================= */
    function suggestRecipes(limit) {
      var d = daySummary();
      var rem = {
        kcal: Math.max(0, d.goals.kcal - d.sum.kcal),
        p: Math.max(0, d.goals.p - d.sum.p),
        c: Math.max(0, d.goals.c - d.sum.c),
        f: Math.max(0, d.goals.f - d.sum.f)
      };
      var pool = [];
      try { pool = (window.allRecipes || app.getAllRecipes && app.getAllRecipes() || []); } catch (e) {}
      if (!pool.length && app.state && app.state.favorites) pool = app.state.favorites;
      if (!pool.length) return { list: [], rem: rem };
      var scored = pool.map(function (r) {
        var n = recipeNutrition(r).perServing;
        var score = 0;
        // Kalorien: Überschreitung stark bestrafen
        if (rem.kcal <= 0) score += 400;
        else if (n.kcal > rem.kcal) score += (n.kcal - rem.kcal) * 1.6;
        else score += (rem.kcal - n.kcal) * 0.35;
        // Fehlende Makros gewichten (Eiweiß am stärksten)
        score += Math.abs(Math.min(n.p, rem.p) - Math.min(rem.p, n.p)) * 0;
        score += Math.max(0, rem.p - n.p) * 1.5;
        score += Math.max(0, rem.c - n.c) * 0.25;
        score += Math.max(0, rem.f - n.f) * 0.4;
        score += Math.max(0, n.c - rem.c) * 0.5;
        score += Math.max(0, n.f - rem.f) * 0.8;
        return { r: r, n: n, score: score };
      }).filter(function (x) { return x.n.kcal > 0; });
      scored.sort(function (a, b) { return a.score - b.score; });
      return { list: scored.slice(0, limit || 8), rem: rem };
    }

    /* ================= 5. UI: TRACKING-SEITE ================= */
    function bar(v, max) { var pct = max > 0 ? Math.min(100, Math.round(v / max * 100)) : 0; return pct; }
    function fmt(n) { return Math.round(n).toLocaleString('de-DE'); }
    var MEALS = { breakfast: 'Frühstück', lunch: 'Mittagessen', dinner: 'Abendessen', snack: 'Snack' };

    function renderTrackingBody() {
      var d = daySummary();
      var g = d.goals, s = d.sum;
      var left = { kcal: g.kcal - s.kcal, p: g.p - s.p, c: g.c - s.c, f: g.f - s.f };
      var prof = getProfile();
      var sug = suggestRecipes(8);
      var dateLabel = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });

      var mealsHtml = d.entries.length ? d.entries.map(function (e) {
        var m = entryMacros(e);
        return '<div class="trk-meal">' +
          (e.image ? '<img loading="lazy" decoding="async" src="' + esc(e.image) + '" alt="">' : '') +
          '<div class="trk-meal-body" onclick="app.openRecipe(\'' + esc(e.recipeId) + '\')">' +
            '<div class="trk-meal-kind">' + esc(MEALS[e.meal] || 'Mahlzeit') + '</div>' +
            '<div class="trk-meal-title">' + esc(e.title) + '</div>' +
            '<div class="trk-meal-meta">' + fmt(m.kcal) + ' kcal · ' + fmt(m.p) + ' g Eiweiß · ' + (e.portions ? (String(e.portions).replace('.', ',') + ' Portion' + (e.portions === 1 ? '' : 'en')) : '') + '</div>' +
          '</div>' +
          '<button class="trk-meal-del" onclick="app.trackRemoveEntry(\'' + esc(e.uid) + '\')" aria-label="Entfernen">✕</button>' +
        '</div>';
      }).join('') : '<div class="trk-empty">Heute noch nichts getrackt.<br>Öffne ein Rezept und tippe auf „Zum heutigen Tracking hinzufügen“.</div>';

      var sugHtml = sug.list.length ? sug.list.map(function (x) {
        return '<div class="trk-suggest" onclick="app.openRecipe(\'' + esc(x.r.id) + '\')">' +
          '<img loading="lazy" decoding="async" src="' + esc(x.r.image) + '" alt="" onerror="this.onerror=null;this.src=\'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800\'">' +
          '<div class="trk-suggest-body">' +
            '<div class="trk-suggest-title">' + esc(x.r.title) + '</div>' +
            '<div class="trk-suggest-meta">' + fmt(x.n.kcal) + ' kcal · <b>' + fmt(x.n.p) + ' g Eiweiß</b></div>' +
          '</div>' +
        '</div>';
      }).join('') : '';

      return '<div class="trk">' +
        '<div class="trk-hero">' +
          '<div class="trk-date">Heute · ' + esc(dateLabel) + '</div>' +
          '<div class="trk-kcal-row"><div class="trk-kcal-big">' + fmt(s.kcal) + '</div><div class="trk-kcal-goal">/ ' + fmt(g.kcal) + ' kcal</div></div>' +
          '<div class="trk-left">' + (left.kcal >= 0 ? 'Noch ungefähr übrig: <b>' + fmt(left.kcal) + ' kcal</b>' : 'Geschätztes Tagesziel um <b>' + fmt(-left.kcal) + ' kcal</b> überschritten') + '</div>' +
          '<div class="trk-bar"><i style="width:' + bar(s.kcal, g.kcal) + '%"></i></div>' +
          '<div class="trk-macros">' +
            ['p', 'c', 'f'].map(function (k) {
              var lbl = k === 'p' ? 'Eiweiß' : k === 'c' ? 'Kohlenh.' : 'Fett';
              return '<div class="trk-macro ' + k + '">' +
                '<div class="trk-macro-l">' + lbl + '</div>' +
                '<div class="trk-macro-v">' + fmt(s[k]) + ' <span>/ ' + fmt(g[k]) + ' g</span></div>' +
                '<div class="trk-mini-bar"><i style="width:' + bar(s[k], g[k]) + '%"></i></div>' +
              '</div>';
            }).join('') +
          '</div>' +
          '<div class="trk-goal-pill">Geschätztes Tagesziel · ' + esc(GOALS[prof.goal] || '') + '</div>' +
        '</div>' +

        '<div class="trk-section-title">Noch ungefähr übrig</div>' +
        '<div class="trk-card"><div class="nutri-macros" style="margin-top:0; grid-template-columns:repeat(4,1fr);">' +
          '<div class="nutri-macro"><div class="nutri-macro-v">' + fmt(Math.max(0, left.kcal)) + '</div><div class="nutri-macro-l">kcal</div></div>' +
          '<div class="nutri-macro p"><div class="nutri-macro-v">' + fmt(Math.max(0, left.p)) + ' g</div><div class="nutri-macro-l">Eiweiß</div></div>' +
          '<div class="nutri-macro c"><div class="nutri-macro-v">' + fmt(Math.max(0, left.c)) + ' g</div><div class="nutri-macro-l">Kohlenh.</div></div>' +
          '<div class="nutri-macro f"><div class="nutri-macro-v">' + fmt(Math.max(0, left.f)) + ' g</div><div class="nutri-macro-l">Fett</div></div>' +
        '</div></div>' +

        '<div class="trk-section-title">Heutige Mahlzeiten</div>' +
        '<div class="trk-card">' + mealsHtml + '</div>' +

        (sugHtml ? '<div class="trk-section-title">Das könnte heute noch gut passen</div><div class="trk-suggest-scroll">' + sugHtml + '</div>' : '') +

        '<div class="trk-section-title">Deine Daten</div>' +
        '<div class="trk-card">' +
          '<div class="trk-form-grid">' +
            '<div class="trk-field"><label>Alter</label><input id="trk-age" type="number" inputmode="numeric" min="14" max="100" value="' + esc(prof.age) + '"></div>' +
            '<div class="trk-field"><label>Geschlecht</label><select id="trk-sex"><option value="male"' + (prof.sex === 'male' ? ' selected' : '') + '>Männlich</option><option value="female"' + (prof.sex === 'female' ? ' selected' : '') + '>Weiblich</option></select></div>' +
            '<div class="trk-field"><label>Größe (cm)</label><input id="trk-height" type="number" inputmode="numeric" min="120" max="230" value="' + esc(prof.height) + '"></div>' +
            '<div class="trk-field"><label>Gewicht (kg)</label><input id="trk-weight" type="number" inputmode="decimal" min="30" max="300" value="' + esc(prof.weight) + '"></div>' +
            '<div class="trk-field full"><label>Aktivitätslevel</label><select id="trk-activity">' +
              Object.keys(ACTIVITY).map(function (k) { return '<option value="' + k + '"' + (prof.activity === k ? ' selected' : '') + '>' + esc(ACTIVITY[k].label) + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="trk-field full"><label>Ziel</label><select id="trk-goal">' +
              Object.keys(GOALS).map(function (k) { return '<option value="' + k + '"' + (prof.goal === k ? ' selected' : '') + '>' + esc(GOALS[k]) + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="trk-field full"><label>Eiweißziel (g, optional)</label><input id="trk-protein" type="number" inputmode="numeric" min="30" max="400" placeholder="Automatisch: ' + fmt(g.p) + ' g" value="' + (prof.proteinOverride ? esc(prof.proteinOverride) : '') + '"></div>' +
          '</div>' +
          '<button class="trk-save" onclick="app.saveNutriProfileFromForm()">Speichern</button>' +
          '<div class="trk-goal-pill">Grundumsatz ca. ' + fmt(g.bmr) + ' kcal · Gesamtbedarf ca. ' + fmt(g.tdee) + ' kcal</div>' +
          (g.lowWarning ? '<div class="trk-warn">Hinweis: Dein errechnetes Ziel liegt sehr niedrig. Wir haben es auf einen sichereren Mindestwert angehoben. Sprich bei starkem Defizit bitte mit einer Ärztin oder einem Arzt.</div>' : '') +
          '<div class="trk-disclaimer">Die berechneten Kalorien- und Nährwertziele sind Näherungswerte und keine medizinische Empfehlung. Der tatsächliche Bedarf kann individuell abweichen.</div>' +
        '</div>' +
      '</div>';
    }

    app.saveNutriProfileFromForm = function () {
      var get = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
      var p = getProfile();
      p.age = Math.max(14, Math.min(100, parseInt(get('trk-age'), 10) || p.age));
      p.sex = get('trk-sex') === 'female' ? 'female' : 'male';
      p.height = Math.max(120, Math.min(230, parseInt(get('trk-height'), 10) || p.height));
      p.weight = Math.max(30, Math.min(300, parseFloat(String(get('trk-weight')).replace(',', '.')) || p.weight));
      p.activity = ACTIVITY[get('trk-activity')] ? get('trk-activity') : p.activity;
      p.goal = GOALS[get('trk-goal')] ? get('trk-goal') : p.goal;
      var po = parseInt(get('trk-protein'), 10);
      p.proteinOverride = po > 0 ? po : null;
      p.setup = true;
      saveProfile(p);
      app.render();
      try { app._flashToast('✅ Daten gespeichert'); } catch (e) {}
    };

    /* ---- Profil: neuer Menüeintrag + Unterseite ---- */
    var origProfileScreen = app.renderProfileScreen.bind(app);
    app.renderProfileScreen = function () {
      if (app.state.profileScreen === 'tracking') {
        return '<div class="profile-subpage">' +
          '<div class="profile-subpage-header">' +
            '<button class="profile-back-btn" onclick="app.closeProfileSubpage()" aria-label="Zurück">←</button>' +
            '<div class="profile-subpage-title">Tages-Tracking</div>' +
          '</div>' +
          '<div class="profile-subpage-body">' + renderTrackingBody() + '</div>' +
        '</div>';
      }
      var html = origProfileScreen();
      if (!app.state.profileScreen && html.indexOf('profile-menu') > -1) {
        var d = daySummary();
        var row = '<button class="profile-menu-row" onclick="app.openProfileSubpage(\'tracking\')">' +
          '<span class="profile-menu-icon">📊</span>' +
          '<span class="profile-menu-label">Tages-Tracking</span>' +
          '<span class="profile-menu-hint">' + fmt(d.sum.kcal) + ' / ' + fmt(d.goals.kcal) + ' kcal</span>' +
          '<span class="profile-menu-arrow">›</span>' +
        '</button>';
        html = html.replace('<div class="profile-menu">', '<div class="profile-menu">' + row);
      }
      return html;
    };

    /* ================= 6. REZEPTDETAIL: NÄHRWERTE + TRACKING ================= */
    var AMOUNTS = [
      { label: '¼ Rezept', type: 'recipe', v: 0.25 },
      { label: '½ Rezept', type: 'recipe', v: 0.5 },
      { label: '1 Portion', type: 'portion', v: 1 },
      { label: '1½ Portionen', type: 'portion', v: 1.5 },
      { label: '2 Portionen', type: 'portion', v: 2 },
      { label: 'Eigene Menge', type: 'custom', v: 0 }
    ];

    app.openTrackSheet = function (recipeId) {
      app.state.trackAddFor = { recipeId: recipeId, amountIdx: 2, customPct: 100, meal: guessMeal() };
      app.render();
    };
    app.closeTrackSheet = function () { app.state.trackAddFor = null; app.render(); };
    app.setTrackAmount = function (i) { if (app.state.trackAddFor) { app.state.trackAddFor.amountIdx = i; app.render(); } };
    app.setTrackMeal = function (m) { if (app.state.trackAddFor) { app.state.trackAddFor.meal = m; app.render(); } };
    app.setTrackCustom = function (v) {
      if (!app.state.trackAddFor) return;
      app.state.trackAddFor.customPct = Math.max(5, Math.min(400, parseInt(v, 10) || 100));
      app.state.trackAddFor.amountIdx = 5;
      updateTrackPreview();
    };

    function guessMeal() {
      var h = new Date().getHours();
      if (h < 11) return 'breakfast';
      if (h < 15) return 'lunch';
      if (h < 22) return 'dinner';
      return 'snack';
    }

    function trackFactor(st, n) {
      var a = AMOUNTS[st.amountIdx] || AMOUNTS[2];
      if (a.type === 'recipe') return a.v;
      if (a.type === 'portion') return a.v / (n.servings || 1);
      return (st.customPct || 100) / 100 / (n.servings || 1); // eigene Menge = Portionen in %
    }

    function updateTrackPreview() {
      var st = app.state.trackAddFor; if (!st) return;
      var r = app.getRecipeById(st.recipeId); if (!r) return;
      var n = recipeNutrition(r);
      var f = trackFactor(st, n);
      var el = document.getElementById('track-preview');
      if (el) el.innerHTML = trackPreviewHtml(r, n, f);
      var cv = document.getElementById('track-custom-val');
      if (cv) cv.textContent = (st.customPct || 100) + ' %';
      document.querySelectorAll('.track-amount-btn').forEach(function (b, i) { b.classList.toggle('active', i === st.amountIdx); });
    }

    function trackPreviewHtml(r, n, f) {
      var portions = Math.round(f * n.servings * 100) / 100;
      return '<div class="track-preview-line">Rezept für <b>' + n.servings + ' Portion' + (n.servings === 1 ? '' : 'en') + '</b></div>' +
        '<div class="track-preview-line">Du isst <b>' + String(portions).replace('.', ',') + ' Portion' + (portions === 1 ? '' : 'en') + '</b> → <b>' + Math.round(f * 100) + ' %</b> des gesamten Rezepts</div>' +
        '<div class="nutri-macros" style="grid-template-columns:repeat(4,1fr); margin-top:10px;">' +
          '<div class="nutri-macro"><div class="nutri-macro-v">' + fmt(n.kcal * f) + '</div><div class="nutri-macro-l">kcal</div></div>' +
          '<div class="nutri-macro p"><div class="nutri-macro-v">' + fmt(n.p * f) + ' g</div><div class="nutri-macro-l">Eiweiß</div></div>' +
          '<div class="nutri-macro c"><div class="nutri-macro-v">' + fmt(n.c * f) + ' g</div><div class="nutri-macro-l">Kohlenh.</div></div>' +
          '<div class="nutri-macro f"><div class="nutri-macro-v">' + fmt(n.f * f) + ' g</div><div class="nutri-macro-l">Fett</div></div>' +
        '</div>';
    }

    app.confirmTrackAdd = function () {
      var st = app.state.trackAddFor; if (!st) return;
      var r = app.getRecipeById(st.recipeId); if (!r) return;
      var n = recipeNutrition(r);
      app.trackAddEntry(r.id, trackFactor(st, n), st.meal);
    };

    function trackSheetHtml() {

          '</div>' +
          (st.amountIdx === 5 ? '<div class="track-custom"><input type="range" min="5" max="400" step="5" value="' + (st.customPct || 100) + '" oninput="app.setTrackCustom(this.value)"><div class="track-custom-val" id="track-custom-val">' + (st.customPct || 100) + ' %</div></div><div class="track-preview-line" style="margin-top:4px;">Anteil in Prozent einer Rezeptportion</div>' : '') +
          '<div class="track-meal-row">' +
            Object.keys(MEALS).map(function (m) { return '<button class="track-meal-btn' + (st.meal === m ? ' active' : '') + '" onclick="app.setTrackMeal(\'' + m + '\')">' + esc(MEALS[m]) + '</button>'; }).join('') +
          '</div>' +
          '<div class="track-preview" id="track-preview">' + trackPreviewHtml(r, n, f) + '</div>' +
          '<div class="track-sheet-actions">' +

              '</div>' +
              '<div class="nutri-kcal">' + fmt(per.kcal) + '<small>kcal / Portion</small></div>' +
              '<div class="nutri-macros">' +
                '<div class="nutri-macro p"><div class="nutri-macro-v">' + fmt(per.p) + ' g</div><div class="nutri-macro-l">Eiweiß</div></div>' +
                '<div class="nutri-macro c"><div class="nutri-macro-v">' + fmt(per.c) + ' g</div><div class="nutri-macro-l">Kohlenhydrate</div></div>' +
                '<div class="nutri-macro f"><div class="nutri-macro-v">' + fmt(per.f) + ' g</div><div class="nutri-macro-l">Fett</div></div>' +
              '</div>' +
              '<div class="nutri-note">Gesamt für ' + shown + ' Portion' + (shown === 1 ? '' : 'en') + ': <b>' + fmt(per.kcal * shown) + ' kcal</b> · ' + fmt(per.p * shown) + ' g Eiweiß · ' + fmt(per.c * shown) + ' g Kohlenhydrate · ' + fmt(per.f * shown) + ' g Fett<br>Näherungswerte aus den Zutaten, an die kcal-Angabe des Rezepts angeglichen – keine medizinische Empfehlung.</div>';
            var portionCalc = modal.querySelector('.portion-calc');
            if (portionCalc && portionCalc.parentNode) portionCalc.parentNode.insertBefore(block, portionCalc.nextSibling);
            else modal.appendChild(block);

            var btn = document.createElement('button');
            btn.className = 'btn-track-add';
            btn.textContent = '📊 Zum heutigen Tracking hinzufügen';
            btn.onclick = function () { app.openTrackSheet(r.id); };
            var actions = modal.querySelector('.modal-actions');

        if (old) old.remove();
        if (app.state.trackAddFor) {

          host.id = 'track-sheet-root';
          host.innerHTML = trackSheetHtml();
          document.body.appendChild(host);
        }
      } catch (e) {}
    };

    app.state.trackAddFor = null;
    app.render();
  })();

  <script>
  (function () {
    'use strict';
    if (!window.app) return;
    var app = window.app;

    var K_STATE = 'reco_state_v1';
    try {
      if (window.AppStorage && AppStorage.DATA_KEYS && AppStorage.DATA_KEYS.indexOf(K_STATE) === -1) {
        AppStorage.DATA_KEYS.push(K_STATE);
      }
    } catch (e) {}

    /* ---------------- State ---------------- */
    function emptyState() {
      return {
        v: 1,
        onboarded: false,
        initial: { goals: [], cuisines: [], timePref: '', nutrition: [], budget: '' },
        cuisineScores: {},      // cuisine -> gewichtete Punkte (positiv/negativ)
        categoryScores: {},
        ingredientScores: {},
        likedRecipes: {},       // id -> count
        skippedRecipes: {},
        favoriteRecipes: {},
        cookedRecipes: {},
        viewedRecipes: {},
        recentlyShown: [],
        interactions: 0
      };
    }
    var S = emptyState();

    function load() {
      try {
        var raw = AppStorage.getItem(K_STATE);
        var parsed = raw ? JSON.parse(raw) : null;
        S = Object.assign(emptyState(), parsed || {});
        S.initial = Object.assign(emptyState().initial, S.initial || {});
      } catch (e) { S = emptyState(); }
    }
    var saveTimer = null;
    function save() {
      if (saveTimer) return;
      saveTimer = setTimeout(function () {
        saveTimer = null;
        try { AppStorage.setItem(K_STATE, JSON.stringify(S)); } catch (e) {}
      }, 120);
    }
    load();

    // Bei Namespace-Wechsel (Login / Logout / Gast) Recommendation-State
    // sauber neu laden -> keine Vermischung verschiedener Accounts.
    try {
      var origSetNs = AppStorage.setNamespace.bind(AppStorage);
      AppStorage.setNamespace = function (ns) {
        origSetNs(ns);
        load();
        cache = Object.create(null);
        try { app.state.swipeOrder = null; } catch (e) {}
      };
    } catch (e) {}

    /* ---------------- Helpers auf bestehenden Daten ---------------- */
    function num(v) { var n = parseInt(String(v == null ? '' : v).replace(/[^\d]/g, ''), 10); return isFinite(n) ? n : null; }
    function minutes(r) { try { return app.getTimeValue(r.time); } catch (e) { return num(r && r.time) || 0; } }
    function kcal(r) { try { return app.getCaloriesValue(r.calories); } catch (e) { return num(r && r.calories); } }
    function cuisineOf(r) { try { return app.getRecipeCuisine(r) || ''; } catch (e) { return r && r.cuisine || ''; } }
    function categoryOf(r) { return String((r && r.category) || '').trim(); }
    function ingredientsOf(r) {
      try { return (app.getRecipeIngredients(r) || []).map(function (i) { return String(i.name || '').toLowerCase().trim(); }); }
      catch (e) { return []; }
    }
    function proteinOf(r) {
      try {
        if (!app.getRecipeNutrition) return null;
        var n = app.getRecipeNutrition(r);
        return n && n.perServing && n.perServing.p > 0 ? n.perServing.p : null;
      } catch (e) { return null; }
    }
    function priceOf(r) {
      // Nur verwenden, wenn die Rezeptdaten tatsächlich Preisangaben besitzen.
      if (!r) return null;
      var p = r.pricePerServing != null ? r.pricePerServing : (r.price != null ? r.price : (r.budget != null ? r.budget : null));
      if (p == null) return null;
      var f = parseFloat(String(p).replace(',', '.').replace(/[^\d.]/g, ''));
      return isFinite(f) ? f : null;
    }
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

    /* ---------------- Lernen aus Interaktionen ---------------- */
    function bump(map, key, w) {
      if (!key) return;
      map[key] = clamp((map[key] || 0) + w, -30, 60);
    }
    var WEIGHTS = {
      like:   { recipe: 15, cuisine: 3,  category: 3,  ingredient: 2.5 },
      fav:    { recipe: 20, cuisine: 5,  category: 5,  ingredient: 3 },
      cooked: { recipe: 20, cuisine: 5,  category: 5,  ingredient: 3 },
      view:   { recipe: 2,  cuisine: 0.6, category: 0.6, ingredient: 0.4 },
      skip:   { recipe: -15, cuisine: -3, category: -3, ingredient: -1.2 },
      unfav:  { recipe: -8, cuisine: -1.5, category: -1.5, ingredient: -1 }
    };

    function signal(type, recipe) {
      var w = WEIGHTS[type];
      if (!w || !recipe || !recipe.id) return;
      var bucket = ({ like: 'likedRecipes', fav: 'favoriteRecipes', cooked: 'cookedRecipes', view: 'viewedRecipes', skip: 'skippedRecipes' })[type];
      if (bucket) S[bucket][recipe.id] = (S[bucket][recipe.id] || 0) + 1;
      bump(S.cuisineScores, cuisineOf(recipe), w.cuisine);
      bump(S.categoryScores, categoryOf(recipe), w.category);
      ingredientsOf(recipe).slice(0, 8).forEach(function (n) { bump(S.ingredientScores, n, w.ingredient); });
      if (type !== 'view') S.interactions++;
      cache = Object.create(null);
      save();
    }

    function markShown(id) {
      if (!id) return;
      S.recentlyShown = [id].concat((S.recentlyShown || []).filter(function (x) { return x !== id; })).slice(0, 40);
      save();
    }

    /* ---------------- Onboarding-Präferenzen -> Signale ---------------- */
    var GOAL_MAP = {
      protein:  { nutrition: 'protein' },
      healthy:  { nutrition: 'balanced' },
      quick:    { time: 'fast' },
      cheap:    { budget: 'cheap' },
      world:    { cuisineBoostAll: true }
    };

    /* ---------------- Confidence ---------------- */
    function confidence() {
      // Frühe Interaktionen wirken schwächer, viele Interaktionen stärker.
      return clamp(0.35 + S.interactions * 0.05, 0.35, 1);
    }

    /* ---------------- Score ---------------- */
    var cache = Object.create(null);

    function rawScore(r) {
      if (!r || !r.id) return 0;
      if (cache[r.id] != null) return cache[r.id];
      var init = S.initial || {};
      var conf = confidence();
      var score = 50;

      // --- Kategorie ---
      var cat = categoryOf(r);
      var cs = S.categoryScores[cat] || 0;
      if (cs > 12) score += 12 * conf;
      else if (cs > 0) score += 8 * conf;
      else if (cs < -6) score -= clamp(-cs, 0, 10) * conf;
      else if (cs < 0) score -= 5 * conf;

      // --- Cuisine (Onboarding + gelernt) ---
      var cui = cuisineOf(r);
      var cuiScore = S.cuisineScores[cui] || 0;
      var prefCuisines = init.cuisines || [];
      if (prefCuisines.indexOf('any') !== -1) score += 2;
      else if (prefCuisines.indexOf(cui) !== -1) score += 8;
      if (cuiScore > 12) score += 12 * conf;
      else if (cuiScore > 0) score += 8 * conf;
      else if (cuiScore < 0) score -= clamp(-cuiScore, 0, 6) * conf;

      // --- Direkte Signale des Rezepts selbst ---
      if (S.favoriteRecipes[r.id]) score += 6;                       // bekanntes Lieblingsrezept
      if (S.cookedRecipes[r.id]) score += 4 * Math.min(3, S.cookedRecipes[r.id]);
      if (S.likedRecipes[r.id]) score += 3;
      if (S.viewedRecipes[r.id]) score += Math.min(4, S.viewedRecipes[r.id] * 2) * 0.5;
      if (S.skippedRecipes[r.id]) score -= Math.min(18, 15 * S.skippedRecipes[r.id]);

      // --- Zutaten-Präferenzen ---
      var ingBonus = 0;
      ingredientsOf(r).forEach(function (n) {
        var v = S.ingredientScores[n];
        if (!v) return;
        ingBonus += clamp(v, -4, 5) * 0.8;
      });
      score += clamp(ingBonus, -8, 14) * conf;

      // --- Ernährungspräferenzen aus Onboarding ---
      var nutr = init.nutrition || [];
      var diet = String(r.diet || '');
      if (nutr.indexOf('vegan') !== -1) {
        if (diet === 'vegan') score += 12;
        else score -= 30;
      } else if (nutr.indexOf('vegetarian') !== -1) {
        if (diet === 'vegan' || diet === 'vegetarian') score += 10;
        else score -= 25;
      } else {
        if (nutr.indexOf('meat') !== -1 && diet === 'non-vegetarian') score += 5;
        if (nutr.indexOf('fish') !== -1 && /lachs|fisch|thunfisch|garnele|shrimp|kabeljau/i.test(r.title + ' ' + ingredientsOf(r).join(' '))) score += 5;
      }

      // --- Nutrition / Protein (nur bei vorhandenen Daten) ---
      var wantsProtein = nutr.indexOf('protein') !== -1 || (init.goals || []).indexOf('protein') !== -1;
      var wantsLowCal = nutr.indexOf('lowcal') !== -1;
      var p = proteinOf(r);
      if (p != null && wantsProtein) {
        if (p > 60) score += 12;
        else if (p >= 40) score += 10;
        else if (p >= 25) score += 7;
        else if (p >= 15) score += 3;
        else score -= 3;
      }
      var kc = kcal(r);
      if (kc && wantsLowCal) {
        if (kc <= 600) score += 8;
        else if (kc > 850) score -= 5;
      }
      if (nutr.indexOf('lowcarb') !== -1) {
        try {
          var nn = app.getRecipeNutrition && app.getRecipeNutrition(r);
          if (nn && nn.perServing && nn.perServing.c > 0) score += nn.perServing.c < 40 ? 6 : -4;
        } catch (e) {}
      }
      if (nutr.indexOf('lowfat') !== -1) {
        try {
          var nf = app.getRecipeNutrition && app.getRecipeNutrition(r);
          if (nf && nf.perServing && nf.perServing.f > 0) score += nf.perServing.f < 18 ? 6 : -4;
        } catch (e) {}
      }

      // --- Zeit ---
      var m = minutes(r);
      var tp = init.timePref || ((init.goals || []).indexOf('quick') !== -1 ? 'very' : '');
      if (m > 0 && (tp === 'very' || tp === 'rather')) {
        var f = tp === 'very' ? 1 : 0.6;
        if (m <= 20) score += 10 * f;
        else if (m <= 30) score += 8 * f;
        else if (m > 60) score -= 5 * f;
      }
      // "Ich nehme mir gerne Zeit" -> kein Malus für lange Rezepte
      if (tp === 'slow' && m >= 45) score += 4;

      // --- Budget (nur wenn Preisdaten existieren) ---
      var price = priceOf(r);
      if (price != null && (init.budget === 'cheap' || (init.goals || []).indexOf('cheap') !== -1)) {
        if (price <= 2) score += 10;
        else if (price <= 3.5) score += 8;
        else if (price > 6) score -= 6;
      }

      // --- Besonderes / Überraschung ---
      var goals = init.goals || [];
      if (goals.indexOf('special') !== -1 && /(schwer|mittel)/i.test(String(r.difficulty || ''))) score += 4;
      if (goals.indexOf('easy') !== -1 && /leicht/i.test(String(r.difficulty || ''))) score += 4;

      // --- Recency / Wiederholungen ---
      var recentIdx = (S.recentlyShown || []).indexOf(r.id);
      if (recentIdx !== -1) score -= (recentIdx < 10 ? 14 : 7);

      cache[r.id] = score;
      return score;
    }

    // Normalisierung auf 0–100 (relative Reihenfolge bleibt erhalten)
    function score100(r) { return clamp(Math.round(rawScore(r)), 0, 100); }

    /* ---------------- Harte Startauswahl-Filter ----------------
       Wenn im Onboarding etwas gewählt wurde, müssen ALLE gewählten
       Kriterien zutreffen (nur dort, wo Daten vorhanden sind). */
    function matchesInitial(r) {
      var init = S.initial || {};
      var goals = init.goals || [];
      var nutr = init.nutrition || [];
      var cuis = (init.cuisines || []).filter(function (c) { return c !== 'any'; });
      var anyCuisine = (init.cuisines || []).indexOf('any') !== -1;

      if (cuis.length && !anyCuisine && cuis.indexOf(cuisineOf(r)) === -1) return false;

      var diet = String(r.diet || '');
      var text = String(r.title || '') + ' ' + ingredientsOf(r).join(' ');
      if (nutr.indexOf('vegan') !== -1 && diet !== 'vegan') return false;
      if (nutr.indexOf('vegetarian') !== -1 && diet !== 'vegan' && diet !== 'vegetarian') return false;
      if (nutr.indexOf('meat') !== -1 && (diet === 'vegan' || diet === 'vegetarian')) return false;
      if (nutr.indexOf('fish') !== -1 && !/lachs|fisch|thunfisch|garnele|shrimp|kabeljau|shrimps|krabben/i.test(text)) return false;

      var kc = kcal(r);
      if (nutr.indexOf('lowcal') !== -1 && kc && kc > 600) return false;
      var p = proteinOf(r);
      if ((nutr.indexOf('protein') !== -1 || goals.indexOf('protein') !== -1) && p != null && p < 20) return false;

      var m = minutes(r);
      var tp = init.timePref || '';
      if (m > 0) {
        if (tp === 'very' && m > 30) return false;
        else if (tp === 'rather' && m > 45) return false;
        if (goals.indexOf('quick') !== -1 && m > 30) return false;
      }

      var price = priceOf(r);
      if (price != null && (init.budget === 'cheap' || goals.indexOf('cheap') !== -1) && price > 3.5) return false;

      return true;
    }

    /* ---------------- Feed-Reihenfolge: Personalisierung + Diversity ---------------- */
    function orderRecipes(list) {
      if (!list || list.length === 0) return [];
      var strict = list.filter(matchesInitial);
      if (strict.length) list = strict;
      var scored = list.map(function (r) {

        return { r: r, s: rawScore(r) + Math.random() * 3 /* leichte Streuung, verhindert starre Feeds */ };
      });
      scored.sort(function (a, b) { return b.s - a.s; });

      var top = scored.slice(0, Math.ceil(scored.length * 0.75)).map(function (x) { return x.r; });
      var explore = scored.slice(Math.ceil(scored.length * 0.75)).map(function (x) { return x.r; });
      try { explore = app.shuffle(explore); } catch (e) {}

      // 70–80 % personalisiert, 20–30 % Discovery, zusätzlich Cuisine/Kategorie-
      // Diversity: nicht mehr als 2 fast identische Karten hintereinander.
      var out = [];
      var ti = 0, ei = 0, guard = 0;
      var lastKeys = [];
      function keyOf(r) { return cuisineOf(r) + '|' + categoryOf(r); }
      var total = top.length + explore.length;
      while (out.length < total && guard++ < total * 4) {
        var takeExplore = ((out.length + 1) % 4 === 0) && ei < explore.length;
        var pick = null;
        if (takeExplore) { pick = explore[ei++]; }
        else if (ti < top.length) {
          // Diversity: überspringe kurzfristig, wenn die letzten 2 Karten
          // dieselbe Küche+Kategorie hatten.
          var j = ti;
          while (j < top.length && lastKeys.length >= 2 && lastKeys[0] === keyOf(top[j]) && lastKeys[1] === keyOf(top[j]) && (j - ti) < 4) j++;
          if (j < top.length) { pick = top[j]; top.splice(j, 1); }
          else { pick = top[ti++]; }
        } else if (ei < explore.length) { pick = explore[ei++]; }
        if (!pick) break;
        out.push(pick);
        lastKeys = [keyOf(pick)].concat(lastKeys).slice(0, 2);
      }
      // Reste anhängen (Sicherheitsnetz – es darf kein Rezept verloren gehen)
      var have = new Set(out.map(function (r) { return r.id; }));
      scored.forEach(function (x) { if (!have.has(x.r.id)) out.push(x.r); });
      return out;
    }

    /* ---------------- Begründung: "Warum wird das vorgeschlagen?" ---------------- */
    function reasons(r) {
      if (!r || !r.id) return [];
      var init = S.initial || {};
      var out = [];
      function add(icon, text) {
        if (out.length >= 3) return;
        for (var i = 0; i < out.length; i++) if (out[i].text === text) return;
        out.push({ icon: icon, text: text });
      }

      var cui = cuisineOf(r);
      var cat = categoryOf(r);
      var cuiLabel = cui;
      try { cuiLabel = app.getCuisineLabel ? app.getCuisineLabel(cui) : cui; } catch (e) {}
      var catLabel = cat;
      try { catLabel = app.getCuisineLabel ? app.getCuisineLabel(cat) : cat; } catch (e) {}

      if (S.favoriteRecipes[r.id]) add('❤️', 'Ist in deinen Favoriten');
      if (S.cookedRecipes[r.id]) add('🍳', 'Hast du schon gekocht');

      if ((init.cuisines || []).indexOf(cui) !== -1) add('🌍', 'Du magst ' + cuiLabel);
      else if ((S.cuisineScores[cui] || 0) > 6) add('🌍', cuiLabel + ' gefällt dir oft');

      if ((S.categoryScores[cat] || 0) > 6) add('📂', 'Du wählst oft ' + catLabel);

      // stärkste bekannte Zutat
      var bestIng = null, bestVal = 0;
      ingredientsOf(r).forEach(function (n) {
        var v = S.ingredientScores[n] || 0;
        if (v > bestVal) { bestVal = v; bestIng = n; }
      });
      if (bestIng && bestVal > 4) add('🧄', 'Enthält ' + bestIng);

      var nutr = init.nutrition || [];
      var goals = init.goals || [];
      var p = proteinOf(r);
      if (p != null && p >= 25 && (nutr.indexOf('protein') !== -1 || goals.indexOf('protein') !== -1)) {
        add('💪', 'Proteinreich · ' + Math.round(p) + ' g');
      }
      var kc = kcal(r);
      if (kc && kc <= 600 && nutr.indexOf('lowcal') !== -1) add('🔥', 'Kalorienbewusst · ' + kc + ' kcal');

      var m = minutes(r);
      var tp = init.timePref || (goals.indexOf('quick') !== -1 ? 'very' : '');
      if (m > 0 && m <= 30 && (tp === 'very' || tp === 'rather')) add('⏱', 'Schnell fertig · ' + m + ' Min');
      if (tp === 'slow' && m >= 45) add('🍲', 'Zum in Ruhe kochen');

      var price = priceOf(r);
      if (price != null && (init.budget === 'cheap' || goals.indexOf('cheap') !== -1)) {
        if (price <= 3.5) add('💰', 'Günstig pro Portion');
      }

      var diet = String(r.diet || '');
      if (nutr.indexOf('vegan') !== -1 && diet === 'vegan') add('🌱', 'Vegan – wie gewünscht');
      else if (nutr.indexOf('vegetarian') !== -1 && (diet === 'vegan' || diet === 'vegetarian')) add('🌿', 'Vegetarisch – wie gewünscht');

      if (out.length === 0) add('✨', 'Neu für dich – zum Entdecken');
      return out;
    }

    window.Reco = {
      getState: function () { return S; },
      signal: signal,
      score: score100,
      order: orderRecipes,
      reasons: reasons,
      isOnboarded: function () { return !!S.onboarded; },
      hasInitialPreferences: function () {
        var i = S.initial || {};
        return !!((i.goals && i.goals.length) || (i.cuisines && i.cuisines.length) ||
          i.timePref || (i.nutrition && i.nutrition.length) || i.budget);
      },
      resetInitial: function () {
        S.initial = { goals: [], cuisines: [], timePref: '', nutrition: [], budget: '' };
        cache = Object.create(null);
        try { AppStorage.setItem(K_STATE, JSON.stringify(S)); } catch (e) {}
      },
      invalidate: function () { cache = Object.create(null); }
    };

    /* =========================================================
       PATCHES: bestehende Interaktionen zusätzlich als Lernsignale
       ========================================================= */
    function patch(name, wrapper) {
      if (typeof app[name] !== 'function') return;
      var orig = app[name].bind(app);
      app[name] = function () { return wrapper.apply(app, [orig].concat([].slice.call(arguments))); };
    }

    patch('handleLike', function (orig) {
      try {
        var deck = app.getSwipeDeck();
        if (deck && deck.recipe && !deck.ad) { signal('like', deck.recipe); markShown(deck.recipe.id); }
      } catch (e) {}
      return orig();
    });

    patch('handlePass', function (orig) {
      try {
        var deck = app.getSwipeDeck();
        if (deck && deck.recipe && !deck.ad) { signal('skip', deck.recipe); markShown(deck.recipe.id); }
      } catch (e) {}
      return orig();
    });

    patch('addToFavorites', function (orig, recipe) {
      var before = app.isFavorite(recipe && recipe.id);
      var res = orig(recipe);
      try { if (!before && app.isFavorite(recipe && recipe.id)) signal('fav', recipe); } catch (e) {}
      return res;
    });

    patch('removeFromFavorites', function (orig, id) {
      try {
        var r = app.getRecipeById(id);
        if (r) signal('unfav', r);
      } catch (e) {}
      return orig(id);
    });

    patch('markAsCooked', function (orig, id) {
      try {
        var r = app.getRecipeById(id);
        if (r) signal('cooked', r);
      } catch (e) {}
      return orig(id);
    });

    var viewTimer = null;
    patch('openRecipe', function (orig, id) {
      var res = orig(id);
      try {
        var r = app.getRecipeById(id);
        if (r) {
          signal('view', r);
          // Kleiner Zusatzbonus, wenn der Nutzer länger auf dem Rezept bleibt.
          if (viewTimer) clearTimeout(viewTimer);
          viewTimer = setTimeout(function () {
            try {
              if (app.state.selectedRecipe && app.state.selectedRecipe.id === id) {
                bump(S.cuisineScores, cuisineOf(r), 0.8);
                bump(S.categoryScores, categoryOf(r), 0.8);
                cache = Object.create(null);
                save();
              }
            } catch (e) {}
          }, 12000);
        }
      } catch (e) {}
      return res;
    });

    /* ---------------- Personalisierte Swipe-Deck-Reihenfolge ----------------
       Gleiche Struktur wie bisher (inkl. Ad-/Influencer-Karten, Endlos-Feed),
       nur die Reihenfolge kommt jetzt aus dem Scoring statt aus shuffle(). */
    app.getSwipeDeck = function () {
      var self = this;
      var filtered = allRecipes.filter(function (r) { return self.matchesSwipeFilters(r); });
      var source = this.state.swipeSource || 'all';
      if (source === 'viral') filtered = filtered.filter(function (r) { return !!r.isInfluencer; });

      var key = 'reco:' + source + ':' + JSON.stringify(this.state.swipeFilters) + ':' + filtered.length + ':' + (this.state.recoCycle || 0);
      if (!this.state.swipeOrder || this.state.swipeOrderKey !== key) {
        var ordered = orderRecipes(filtered);
        var rawIds = ordered.map(function (r) { return r.id; });
        if (source === 'all') {
          var deck = [];
          var normalCount = 0;
          var influencerPool = allRecipes.filter(function (r) { return r.isInfluencer; }).map(function (r) { return r.id; });
          var infIdx = 0, adCounter = 0, infCounter = 0;
          for (var i = 0; i < rawIds.length; i++) {
            deck.push(rawIds[i]);
            normalCount++;
            if (normalCount % 10 === 0) { adCounter++; deck.push('__ad_' + adCounter); }
            if (normalCount % 20 === 0 && influencerPool.length) {
              infCounter++;
              var infId = influencerPool[infIdx % influencerPool.length];
              infIdx++;
              deck.push('__inf_' + infCounter + '_' + infId);
            }
          }
          this.state.swipeOrder = deck;
        } else {
          this.state.swipeOrder = rawIds;
        }
        this.state.swipeOrderKey = key;
        this.state.currentIndex = 0;
      }
      var ids = this.state.swipeOrder;
      if (!ids.length) return { recipe: null, empty: true };
      var idx = ((this.state.currentIndex % ids.length) + ids.length) % ids.length;
      var id = ids[idx];
      if (typeof id === 'string' && id.indexOf('__ad_') === 0) return { recipe: null, empty: false, ad: { id: id } };
      if (typeof id === 'string' && id.indexOf('__inf_') === 0) {
        var realId = id.split('_').slice(3).join('_') || id.split('_').pop();
        var rec = allRecipes.find(function (r) { return r.id === realId; });
        return { recipe: rec, empty: false, influencer: true };
      }
      var recipe = allRecipes.find(function (r) { return r.id === id; });
      return { recipe: recipe, empty: false, influencer: !!(recipe && recipe.isInfluencer) };
    };

    // Endlos-Feed: nach einem kompletten Durchlauf wird der Feed mit den
    // aktualisierten Scores neu aufgebaut (keine harte Rezept-Grenze).
    patch('advanceSwipe', function (orig) {
      var lenBefore = (app.state.swipeOrder || []).length;
      var res = orig();
      if (lenBefore && app.state.currentIndex === 0) {
        app.state.recoCycle = (app.state.recoCycle || 0) + 1;
        cache = Object.create(null);
        app.state.swipeOrder = null;
      }
      return res;
    });

    /* =========================================================
       ONBOARDING-FRAGEBOGEN (nur beim ersten Start / ohne Präferenzen)
       ========================================================= */
    var QUESTIONS = [
      {
        key: 'goals', multi: true,
        title: 'Was möchtest du heute essen?',
        sub: 'Mehrfachauswahl möglich',
        options: [
          ['easy', '🍝 Einfach lecker'], ['protein', '💪 Proteinreich'],
          ['healthy', '🥗 Gesund & ausgewogen'], ['quick', '⚡ Schnell & unkompliziert'],
          ['cheap', '💰 Günstig'], ['special', '🔥 Etwas Besonderes'],
          ['world', '🌎 Internationale Küche'], ['surprise', '🎲 Überrasche mich']
        ]
      },
      {
        key: 'cuisines', multi: true,
        title: 'Welche Küche magst du?',
        sub: 'Mehrfachauswahl möglich',
        options: null // dynamisch aus den bestehenden Rezeptdaten
      },
      {
        key: 'timePref', multi: false,
        title: 'Wie wichtig ist dir eine schnelle Zubereitung?',
        sub: '',
        options: [
          ['very', '⚡ Sehr wichtig'], ['rather', '🙂 Eher wichtig'],
          ['none', '😐 Egal'], ['slow', '🍳 Ich nehme mir gerne Zeit']
        ]
      },
      {
        key: 'nutrition', multi: true,
        title: 'Was ist dir bei Ernährung wichtig?',
        sub: 'Mehrfachauswahl möglich',
        options: [
          ['protein', '💪 Viel Protein'], ['lowcal', '🔥 Kalorienbewusst'],
          ['balanced', '🥗 Ausgewogen'], ['lowfat', '🥑 Wenig Fett'],
          ['lowcarb', '🍚 Weniger Kohlenhydrate'], ['vegetarian', '🌱 Vegetarisch'],
          ['vegan', '🌿 Vegan'], ['meat', '🥩 Fleisch'], ['fish', '🐟 Fisch'],
          ['nopref', '😌 Keine besonderen Vorgaben']
        ]
      },
      {
        key: 'budget', multi: false,
        title: 'Wie viel möchtest du ungefähr ausgeben?',
        sub: '',
        options: [['cheap', '💰 Günstig'], ['normal', '💶 Normal'], ['any', '💎 Egal']]
      }
    ];

    var CUISINE_EMOJI = {
      'Italienisch': '🇮🇹', 'Mexikanisch': '🇲🇽', 'Indisch': '🇮🇳', 'Japanisch': '🇯🇵',
      'Thai': '🇹🇭', 'Thailändisch': '🇹🇭', 'Amerikanisch': '🇺🇸', 'Griechisch': '🇬🇷',
      'Türkisch': '🇹🇷', 'Chinesisch': '🇨🇳', 'Spanisch': '🇪🇸', 'Mediterran': '🥘',
      'Asiatisch': '🍜', 'Deutsch': '🍽️', 'Französisch': '🇫🇷', 'Orientalisch': '🧆'
    };

    function cuisineOptions() {
      var list = [];
      try { list = app.getAllCuisines() || []; } catch (e) {}
      if (!list.length) {
        var seen = {};
        allRecipes.forEach(function (r) { var c = cuisineOf(r); if (c && !seen[c]) { seen[c] = 1; list.push(c); } });
      }
      var opts = list.map(function (c) {
        var label = c;
        try { label = app.getCuisineLabel ? app.getCuisineLabel(c) : c; } catch (e) {}
        return [c, (CUISINE_EMOJI[label] || CUISINE_EMOJI[c] || '🍽️') + ' ' + label];
      });
      opts.push(['any', '🌎 Egal / alles']);
      return opts;
    }

    var draft = { goals: [], cuisines: [], timePref: '', nutrition: [], budget: '' };
    var step = 0;

    function closeOnboarding() {
      var el = document.getElementById('reco-onboarding');
      if (el) el.remove();
    }

    function finishOnboarding(skipped) {
      S.onboarded = true;
      if (skipped) {
        S.initial = { goals: [], cuisines: [], timePref: '', nutrition: [], budget: '' };
      } else {
        S.initial = {
          goals: draft.goals.slice(),
          cuisines: draft.cuisines.slice(),
          timePref: draft.timePref || '',
          nutrition: (draft.nutrition.indexOf('nopref') !== -1 ? [] : draft.nutrition.slice()),
          budget: draft.budget || ''
        };
        // Onboarding-Küchen als initiale Gewichtung (mild, damit Verhalten dominiert)
        (S.initial.cuisines || []).forEach(function (c) { if (c !== 'any') bump(S.cuisineScores, c, 4); });
      }
      cache = Object.create(null);
      try { AppStorage.setItem(K_STATE, JSON.stringify(S)); } catch (e) {}
      closeOnboarding();
      try {
        app.state.activeTab = 'swipe';
        app.state.swipeOrder = null;
        app.render();
      } catch (e) {}
    }

    function renderOnboarding() {
      var host = document.getElementById('reco-onboarding');
      if (!host) {
        host = document.createElement('div');
        host.id = 'reco-onboarding';
        document.body.appendChild(host);
      }
      var q = QUESTIONS[step];
      var opts = q.options || cuisineOptions();
      var val = draft[q.key];
      var isSel = function (v) { return q.multi ? (val || []).indexOf(v) !== -1 : val === v; };
      var last = step === QUESTIONS.length - 1;

      host.innerHTML =
        '<div class="reco-ob-backdrop" role="dialog" aria-modal="true">' +
          '<div class="reco-ob-sheet">' +
            (step > 0 ? '<button class="reco-ob-back" data-back="1">← Zurück</button>' : '') +
            '<div class="reco-ob-step">Frage ' + (step + 1) + ' von ' + QUESTIONS.length + '</div>' +
            '<div class="reco-ob-progress"><i style="width:' + Math.round((step + 1) / QUESTIONS.length * 100) + '%"></i></div>' +
            '<h2 class="reco-ob-title">' + q.title + '</h2>' +
            (q.sub ? '<p class="reco-ob-sub">' + q.sub + '</p>' : '') +
            '<div class="reco-ob-opts">' +
              opts.map(function (o) {
                return '<button class="reco-ob-opt' + (isSel(o[0]) ? ' sel' : '') + '" data-val="' + o[0] + '">' + o[1] + '</button>';
              }).join('') +
            '</div>' +
            '<div class="reco-ob-actions">' +
              '<button class="reco-ob-primary" data-next="1">' + (last ? 'Meine Rezepte entdecken' : 'Weiter') + '</button>' +
              '<button class="reco-ob-ghost" data-skip="1">Frage überspringen</button>' +
              '<button class="reco-ob-ghost" data-skipall="1">Alle Fragen überspringen</button>' +

            '</div>' +
          '</div>' +
        '</div>';

      host.querySelectorAll('.reco-ob-opt').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var v = btn.getAttribute('data-val');
          if (q.multi) {
            var arr = draft[q.key] || [];
            var i = arr.indexOf(v);
            if (i === -1) arr.push(v); else arr.splice(i, 1);
            draft[q.key] = arr;
          } else {
            draft[q.key] = draft[q.key] === v ? '' : v;
          }
          renderOnboarding();
        });
      });
      var backBtn = host.querySelector('[data-back]');
      if (backBtn) backBtn.addEventListener('click', function () { step = Math.max(0, step - 1); renderOnboarding(); });
      host.querySelector('[data-next]').addEventListener('click', function () {
        if (last) finishOnboarding(false);
        else { step++; renderOnboarding(); }
      });
      host.querySelector('[data-skip]').addEventListener('click', function () {
        if (last) finishOnboarding(false);
        else { step++; renderOnboarding(); }
      });
      var skipAll = host.querySelector('[data-skipall]');
      if (skipAll) skipAll.addEventListener('click', function () { finishOnboarding(true); });

    }

    function maybeShowOnboarding() {
      if (S.onboarded) return;
      if (document.getElementById('reco-onboarding')) return;
      step = 0;
      draft = { goals: [], cuisines: [], timePref: '', nutrition: [], budget: '' };
      renderOnboarding();
    }

    // Overlay bleibt bestehen, auch wenn die App neu rendert.
    patch('render', function (orig) {
      var res = orig();
      try { if (!S.onboarded) maybeShowOnboarding(); } catch (e) {}
      return res;
    });

    maybeShowOnboarding();
    try { app.state.swipeOrder = null; app.render(); } catch (e) {}
  })();
  </script>

      transition: color .18s ease, transform .18s ease;

    .nav-btn .nav-label { font-size: 9px; font-weight: 650; letter-spacing: .01em; }
    .nav-btn.active { color: var(--primary); }
    .nav-btn.active .nav-label { color: var(--primary); }
    .nav-btn:active { transform: translateY(1px); }
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity .18s ease, transform .18s ease;
    }
    .nav-icon svg { width: 26px; height: 26px; }
    .nav-btn.active .nav-icon { transform: scale(1.05); }
    .nav-label {
      opacity: .72;
      transform: translateY(0);
      transition: opacity .18s ease, color .18s ease;
      height: auto;
      margin-top: 2px;
    }
    .nav-btn.active .nav-label { opacity: 1; }



    /* ---------- Health / freshness accents ---------- */
    .tag.vegan, .tag.vegetarian, .ingredients-list .ingredient-check,
    .rating-inline .rating-count { color: inherit; }

    /* ---------- Motion ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .grid-item-text-only, .favorite-card, .popular-card, .social-post, .trk-card {
        animation: tt-rise .34s cubic-bezier(.22,.7,.25,1) both;
      }
      @keyframes tt-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
    }

    /* ---------- Responsive ---------- */
    @media (min-width: 900px) {
      .discover-container, .favorites-container, .profile-container,
      .social-container, .shopping-container { max-width: 960px; margin: 0 auto; }
      .grid-3-columns { grid-template-columns: repeat(3, 1fr); gap: 20px 18px; }
    }
    @media (min-width: 1280px) {
      .grid-3-columns { grid-template-columns: repeat(4, 1fr); }
    }
