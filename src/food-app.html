            <div class="cooked-grid">
              ${entries.map(({ e, idx, recipe }) => `
                <div class="cooked-tile" onclick="event.stopPropagation(); app.state.cookedDetailId=${idx}; app.render()">
                  <img loading="lazy" decoding="async" src="${recipe.image}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">
                  <div class="cooked-tile-body">
                    <div class="cooked-tile-title">${escapeHtml(recipe.title)}</div>
                    <div class="cooked-tile-date">${this.formatDate(e.cookedAt)}</div>
                    ${e.note ? `<div class="cooked-tile-note">${escapeHtml(e.note)}</div>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
          ${activeEntry ? `
            <div class="cooked-detail" style="padding:12px 0; border-top:1px solid rgba(255,255,255,0.08); margin-top:12px;">
              <div style="font-weight:700; margin-bottom:6px;">${escapeHtml(activeEntry.recipe.title)}</div>
              <div style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">${this.formatDate(activeEntry.e.cookedAt)}</div>
              <textarea placeholder="Notiz für nächstes Mal…" oninput="app.updateCookedNote(${activeEntry.idx}, this.value)">${escapeHtml(activeEntry.e.note || '')}</textarea>
              <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="swipe-filter-btn" onclick="app.state.cookedDetailId=null; app.render()">Schließen</button>
                <button class="swipe-filter-btn" style="background:rgba(255,107,107,0.15); color:var(--primary); border-color:rgba(255,107,107,0.3);" onclick="app.deleteCookedEntry(${activeEntry.idx})">Eintrag löschen</button>
              </div>
            </div>
          ` : ''}
        `;
      }
      renderCookedHistoryScreen() {
        return `
          <div class="history-sheet-overlay" onclick="app.closeCookedHistory()">
            <div class="history-sheet" onclick="event.stopPropagation()" style="max-height:85vh; overflow-y:auto;">
              <div class="history-sheet-header">
                <div class="history-sheet-title">Kochverlauf</div>
                <button class="history-sheet-close" onclick="app.closeCookedHistory()">×</button>
              </div>
              ${this.renderCookedHistoryBody()}
            </div>
          </div>
        `;
      }

      renderSocialTab() {
        const posts = this.state.socialPosts || [];
        const feed = posts.map(p => {
          const r = this.getRecipeById(p.recipeId);
          if (!r) return '';
          const img = p.photoDataUrl || r.image;
          const initials = (p.author || '?').split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase();
          return `
            <div class="social-post">
              <div class="social-post-head">
                <div class="social-avatar">${escapeHtml(initials)}</div>
                <div style="flex:1;">
                  <div class="social-author">${escapeHtml(p.author)}</div>
                  <div class="social-time">${this.timeAgo(p.createdAt)}</div>
                </div>
                ${p.author === 'Du' ? `<button class="social-action-btn" onclick="app.deleteSocialPost('${p.id}')" title="Löschen">✕</button>` : ''}
              </div>
              <img loading="lazy" decoding="async" class="social-post-image" src="${img}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">
              <div class="social-post-actions">
                <button class="social-action-btn ${p.likedByMe ? 'liked' : ''}" onclick="app.toggleSocialLike('${p.id}')">
                  ${p.likedByMe ? '♥' : '♡'} ${p.likes}
                </button>
                <button class="social-action-btn" onclick="document.getElementById('sc-input-${p.id}').focus()">💬 ${p.comments.length}</button>
                <button class="social-action-btn" onclick="app.shareSocialPost('${p.id}')">↗ Teilen</button>
                <button class="social-action-btn" style="margin-left:auto;" onclick="app.openRecipe('${r.id}')">Rezept</button>
              </div>
              <div class="social-post-body">
                <div class="social-post-recipe">${escapeHtml(r.title)}</div>
                ${p.caption ? `<div>${escapeHtml(p.caption)}</div>` : ''}
              </div>
              ${p.comments.length > 0 ? `
                <div class="social-comments">
                  ${p.comments.map(c => `<div class="social-comment"><strong>${escapeHtml(c.author)}</strong>${escapeHtml(c.text)}</div>`).join('')}
                </div>
              ` : ''}
              <div class="social-comment-input">
                <input id="sc-input-${p.id}" placeholder="Kommentieren…" onkeydown="if(event.key==='Enter'){app.addSocialComment('${p.id}')}">
                <button onclick="app.addSocialComment('${p.id}')">Senden</button>
              </div>
            </div>
          `;
        }).join('');
        return `
          <div class="social-container">
            <div class="social-header">
              <h2>Social</h2>
              <button class="social-create-btn" onclick="app.openSocialCreate()">+ Teilen</button>
            </div>
            ${posts.length === 0 ? '<div class="social-empty">Noch keine Beiträge. Teile ein Favoritenrezept!</div>' : feed}
          </div>
        `;
      }

      renderSocialCreateSheet() {
        const favs = this.state.favorites || [];
        return `
          <div class="history-sheet-overlay" onclick="app.closeSocialCreate()">
            <div class="history-sheet social-create-sheet" onclick="event.stopPropagation()">
              <div class="history-sheet-header">
                <div class="history-sheet-title">Rezept teilen</div>
                <button class="history-sheet-close" onclick="app.closeSocialCreate()">×</button>
              </div>
              ${favs.length === 0 ? `
                <div style="color:var(--text-muted); font-size:13px; padding:12px 0;">
                  Erst zu Favoriten hinzufügen, um zu teilen. Öffne den Swipe-Tab und tippe auf das Herz.
                </div>
              ` : `
                <label style="font-size:12px; color:var(--text-muted);">Rezept</label>
                <select id="social-recipe-select">
                  ${favs.map(r => `<option value="${r.id}">${escapeHtml(r.title)}</option>`).join('')}
                </select>
                <label style="font-size:12px; color:var(--text-muted);">Beschreibung</label>
                <textarea id="social-caption" placeholder="Wie war's? Was würdest du beim nächsten Mal anders machen?"></textarea>
                <label style="font-size:12px; color:var(--text-muted);">Foto (optional)</label>
                <input id="social-photo" type="file" accept="image/*">
                <button class="social-create-btn" style="width:100%;" onclick="app.createSocialPost()">Beitrag veröffentlichen</button>
              `}
            </div>
          </div>
        `;
      }

      render() {
        const root = document.getElementById('root');
        let content = '';
        let extraOverlay = '';

        if (this.state.activeTab === 'swipe') {
          const deckInfo = this.getSwipeDeck();
          const { recipe: currentRecipe, empty } = deckInfo;
          const filterCount = Object.values(this.state.swipeFilters).reduce((s, a) => s + (a?.length || 0), 0);

          let cardHtml;
          if (deckInfo.ad) {
            cardHtml = `
              <div class="recipe-card">
                <div class="swipe-ad-card">
                  <div class="ad-badge">Werbeanzeige · Sponsored</div>
                  <div style="font-size:44px; margin-bottom:12px;">📣</div>
                  <div class="ad-title">Hier könnte deine Werbung stehen</div>
                  <div class="ad-sub">Platzhalter – später wird an dieser Stelle echte Werbung eingebunden.</div>
                  <button class="swipe-skip-ad" onclick="app.handlePass()">Weiter →</button>
                </div>
              </div>
            `;
          } else if (empty || !currentRecipe) {
            cardHtml = `
              <div class="swipe-empty">
                <div style="font-size:32px; margin-bottom:8px;">🍽️</div>
                <div>${this.state.swipeSource === 'viral' ? 'Keine Viral-Rezepte gefunden.' : 'Keine Rezepte passen zu deinen Filtern.'}</div>
                ${filterCount > 0 ? '<button onclick="app.clearSwipeFilters()">Filter zurücksetzen</button>' : ''}
              </div>
            `;
          } else {
            const isInf = !!deckInfo.influencer;
            cardHtml = `
              <div class="recipe-card immersive-swipe-card">
                <div class="image-wrapper">
                  <div class="card-badges">
                    ${isInf ? '<span class="influencer-tag">⭐ Influencer</span>' : ''}
                  </div>
                  <img decoding="async" fetchpriority="high" src="${currentRecipe.image}" class="card-image" alt="${escapeHtml(currentRecipe.title)}" data-loaded="0" onload="this.dataset.loaded='1'" onerror="this.onerror=null;this.dataset.loaded='1';this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">
                </div>
                <div class="card-info">
                  <h2 class="card-title">${escapeHtml(currentRecipe.title)}${isInf && currentRecipe.creator ? ` <span style="font-size:12px; color:var(--text-muted); font-weight:500;">· ${escapeHtml(currentRecipe.creator)}</span>` : ''}</h2>
                  <div class="card-meta-tags">
                    <span class="tag">⏱ ${escapeHtml(currentRecipe.time)}</span>
                    <span class="tag">🔥 ${escapeHtml(currentRecipe.calories)}</span>
                    <span class="tag">📊 ${escapeHtml(currentRecipe.difficulty)}</span>
                    ${currentRecipe.diet === 'vegan' ? '<span class="tag">🌱 Vegan</span>' : currentRecipe.diet === 'vegetarian' ? '<span class="tag">🌿 Vegetarisch</span>' : ''}
                  </div>
                  <div class="card-buttons">
                    <button class="btn-pass" aria-label="Rezept überspringen" onclick="app.handlePass()">
                      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                     <button class="btn-like" aria-label="Rezept annehmen" onclick="app.handleLike()">
                       <svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }

          const swipeSrc = this.state.swipeSource || 'all';
          content = `
            <div class="swipe-topbar">
              <button class="swipe-filter-btn" onclick="app.toggleSwipeHistorySheet()">Verlauf</button>

              <div class="swipe-source-tabs" role="tablist" aria-label="Vorschlagsquelle">
                 <button class="swipe-source-tab ${swipeSrc === 'all' ? 'active' : ''}" onclick="app.setSwipeSource('all')">For You</button>
                 <button class="swipe-source-tab ${swipeSrc === 'viral' ? 'active' : ''}" onclick="app.setSwipeSource('viral')">Viral</button>
              </div>
              <button class="swipe-filter-btn ${filterCount > 0 ? 'has-active' : ''}" onclick="app.toggleSwipeFiltersPanel()">
                ${this.state.premiumUnlocked ? '' : '👑 '}Filter${filterCount > 0 ? ` (${filterCount})` : ''}
              </button>
            </div>
            ${(window.Reco && window.Reco.hasInitialPreferences && window.Reco.hasInitialPreferences()) ? `
              <div class="start-pref-reset-row">
                <button class="start-pref-reset" onclick="app.clearInitialPreferences()">🔄 Startauswahl zurücksetzen</button>
              </div>
            ` : ''}
            <div class="swipe-container">
              ${cardHtml}
            </div>
          `;
          if (this.state.swipeFiltersOpen) {
            extraOverlay += `
              <div class="history-sheet-overlay" onclick="app.toggleSwipeFiltersPanel()">
                <div class="history-sheet" onclick="event.stopPropagation()">
                  <div class="history-sheet-header">
                    <div class="history-sheet-title">Filter</div>
                    <button class="history-sheet-close" onclick="app.toggleSwipeFiltersPanel()">×</button>
                  </div>
                  ${this.renderSwipeFilterPanel()}
                </div>
              </div>
            `;
          }

          // History bottom sheet overlay (button moved into topbar above)
          if (this.state.swipeHistoryOpen) {
            const items = this.state.swipeHistory
              .map(id => allRecipes.find(r => r.id === id))
              .filter(Boolean);
            extraOverlay += `
              <div class="history-sheet-overlay" onclick="app.toggleSwipeHistorySheet()">
                <div class="history-sheet" onclick="event.stopPropagation()">
                  <div class="history-sheet-header">
                    <div class="history-sheet-title">Verlauf</div>
                    <button class="history-sheet-close" onclick="app.toggleSwipeHistorySheet()">×</button>
                  </div>
                  ${items.length === 0 ? '<div style="color:var(--text-muted); font-size:13px;">Noch keine Rezepte angeschaut.</div>' : items.map(r => `
                    <div class="history-item" onclick="app.toggleSwipeHistorySheet(); app.openRecipe('${r.id}')">
                      <img loading="lazy" decoding="async" src="${r.image}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">
                      <div>
                        <div class="history-item-title">${escapeHtml(r.title)}</div>
                        <div class="history-item-meta">${escapeHtml(r.time)} · ${escapeHtml(r.calories)}</div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }
        } else if (this.state.activeTab === 'discover') {
          const filtered = this.getFilteredRecipes();

          let historyHtml = '';
          if (this.state.searchHistory.length > 0 && this.state.searchQuery === '') {
            historyHtml = `
              <div class="history-container">
                <span class="history-title">Zuletzt gesucht:</span>
                ${this.state.searchHistory.map(h => `
                  <span class="history-badge" onclick="app.useHistoryQuery('${escapeHtml(h)}')">
                    ${escapeHtml(h)} <span class="history-delete" onclick="app.removeFromHistory(event, '${escapeHtml(h)}')">×</span>
                  </span>
                `).join('')}
              </div>
            `;
          }

          const activeFilters = [];
          if (this.state.selectedFilters.time) {
            const timeLabel = this.state.selectedFilters.time === 'under-20' ? 'Unter 20 Minuten' : this.state.selectedFilters.time === '20-40' ? '20–40 Minuten' : 'Über 40 Minuten';
            activeFilters.push(timeLabel);
          }
          if (this.state.selectedFilters.calories) {
            const calorieLabel = this.state.selectedFilters.calories === '0-200' ? 'Bis 200 kcal' : this.state.selectedFilters.calories === '800-plus' ? 'Über 800 kcal' : `${this.state.selectedFilters.calories} kcal`;
            activeFilters.push(calorieLabel);
          }
          if (this.state.selectedFilters.difficulty) {
            const difficultyLabel = this.state.selectedFilters.difficulty === 'easy' ? 'Einfach' : this.state.selectedFilters.difficulty === 'medium' ? 'Mittel' : 'Schwer';
            activeFilters.push(difficultyLabel);
          }
          if (this.state.selectedFilters.diet) {
            activeFilters.push({ vegan: 'Vegan', vegetarian: 'Vegetarisch', 'non-vegetarian': 'Nicht vegetarisch' }[this.state.selectedFilters.diet] || this.state.selectedFilters.diet);
          }
          if (this.state.selectedFilters.cuisine) {
            activeFilters.push(this.getCuisineLabel(this.state.selectedFilters.cuisine));
          }
          if (this.state.selectedFilters.spice) {
            const spiceMap = { 'mild': 'Mild', 'medium': 'Mittel', 'hot': 'Scharf', 'very-hot': 'Sehr scharf' };
            activeFilters.push(spiceMap[this.state.selectedFilters.spice] || this.state.selectedFilters.spice);
          }

          const hasFilters = activeFilters.length > 0;
          const filterIndicatorText = hasFilters ? `Aktive Filter: ${activeFilters.join(', ')}` : 'Kein Filter aktiv';

          content = `
            <div class="discover-container">
              <input type="text" value="${escapeHtml(this.state.searchQuery)}" placeholder="🔎 Nach Rezept oder Zutat suchen..." class="search-input" oninput="app.handleSearch(this.value)">

              <div class="controls-bar">
                <div class="filter-group-row">
                  <button class="filter-trigger-btn ${this.state.activeFilterPanel === 'time' ? 'active-filter' : ''}" onclick="app.toggleFilterPanel('time')">⏱️ Zeit ▼</button>
                  <button class="filter-trigger-btn ${this.state.activeFilterPanel === 'calories' ? 'active-filter' : ''}" onclick="app.toggleFilterPanel('calories')">🔥 Kalorien ▼</button>
                  <button class="filter-trigger-btn ${this.state.activeFilterPanel === 'difficulty' ? 'active-filter' : ''}" onclick="app.toggleFilterPanel('difficulty')">📊 Schwierigkeit ▼</button>
                  <button class="filter-trigger-btn ${this.state.activeFilterPanel === 'cuisine' ? 'active-filter' : ''}" onclick="app.toggleFilterPanel('cuisine')">🍽️ Küche ▼</button>
                  <button class="filter-trigger-btn ${this.state.activeFilterPanel === 'spice' ? 'active-filter' : ''}" onclick="app.toggleFilterPanel('spice')">🌶️ Schärfe ▼</button>
                  <button class="filter-trigger-btn" onclick="app.openLeftoverMode()">🥕 Reste-Modus</button>
                </div>

                <span style="font-size:11px; color:var(--text-muted);">${escapeHtml(filterIndicatorText)}</span>

                ${this.state.activeFilterPanel ? `
                  <div class="filter-panel">
                    ${this.state.activeFilterPanel === 'time' ? `
                      <div class="filter-section-title">Zeit</div>
                      ${['under-20', '20-40', '40-plus'].map(value => {
                        const label = value === 'under-20' ? 'Unter 20 Minuten' : value === '20-40' ? '20–40 Minuten' : 'Über 40 Minuten';
                        const isActive = this.state.selectedFilters.time === value;
                        return `
                          <label class="filter-option-row ${isActive ? 'active-option' : ''}" onclick="event.preventDefault(); app.setFilter('time', '${value}')">
                            <span>${escapeHtml(label)}</span>
                            <input type="checkbox" ${isActive ? 'checked' : ''}>
                          </label>
                        `;
                      }).join('')}
                    ` : ''}
                    ${this.state.activeFilterPanel === 'calories' ? `
                      <div class="filter-section-title">Kalorien</div>
                      ${['0-200', '200-400', '400-600', '600-800', '800-plus'].map(value => {
                        const label = value === '800-plus' ? 'Über 800 kcal' : value === '0-200' ? 'Bis 200 kcal' : `${value} kcal`;
                        const isActive = this.state.selectedFilters.calories === value;
                        return `
                          <label class="filter-option-row ${isActive ? 'active-option' : ''}" onclick="event.preventDefault(); app.setFilter('calories', '${value}')">
                            <span>${escapeHtml(label)}</span>
                            <input type="checkbox" ${isActive ? 'checked' : ''}>
                          </label>
                        `;
                      }).join('')}
                    ` : ''}
                    ${this.state.activeFilterPanel === 'difficulty' ? `
                      <div class="filter-section-title">Schwierigkeit</div>
                      ${['easy', 'medium', 'hard'].map(value => {
                        const label = value === 'easy' ? 'Einfach' : value === 'medium' ? 'Mittel' : 'Schwer';
                        const isActive = this.state.selectedFilters.difficulty === value;
                        return `
                          <label class="filter-option-row ${isActive ? 'active-option' : ''}" onclick="event.preventDefault(); app.setFilter('difficulty', '${value}')">
                            <span>${escapeHtml(label)}</span>
                            <input type="checkbox" ${isActive ? 'checked' : ''}>
                          </label>
                        `;
                      }).join('')}
                    ` : ''}
                    ${this.state.activeFilterPanel === 'spice' ? `
                      <div class="filter-section-title">Schärfe</div>
                      ${[['mild','🌶 Mild'],['medium','🌶🌶 Mittel'],['hot','🌶🌶🌶 Scharf'],['very-hot','🔥 Sehr scharf']].map(([value,label]) => {
                        const isActive = this.state.selectedFilters.spice === value;
                        return `
                          <label class="filter-option-row ${isActive ? 'active-option' : ''}" onclick="event.preventDefault(); app.setFilter('spice', '${value}')">
                            <span>${escapeHtml(label)}</span>
                            <input type="checkbox" ${isActive ? 'checked' : ''}>
                          </label>
                        `;
                      }).join('')}
                    ` : ''}
                    ${this.state.activeFilterPanel === 'cuisine' ? `
                      <div class="filter-section-title">Ernährungsweise</div>
                      ${[['non-vegetarian','Nicht vegetarisch'],['vegetarian','Vegetarisch'],['vegan','Vegan']].map(([value,label]) => {
                        const isActive = this.state.selectedFilters.diet === value;
                        return `
                          <label class="filter-option-row ${isActive ? 'active-option' : ''}" onclick="event.preventDefault(); app.setFilter('diet', '${value}')">
                            <span>${escapeHtml(label)}</span>
                            <input type="checkbox" ${isActive ? 'checked' : ''}>
                          </label>
                        `;
                      }).join('')}
                      <div class="filter-section-title">Küche</div>
                      ${this.getAllCuisines().map(value => {
                        const isActive = this.state.selectedFilters.cuisine === value;
                        return `
                          <label class="filter-option-row ${isActive ? 'active-option' : ''}" onclick="event.preventDefault(); app.setFilter('cuisine', '${value}')">
                            <span>${escapeHtml(this.getCuisineLabel(value))}</span>
                            <input type="checkbox" ${isActive ? 'checked' : ''}>
                          </label>
                        `;
                      }).join('')}
                    ` : ''}
                    <div class="filter-actions">
                      <button class="btn-clear-filters" onclick="app.clearFilters()">Zurücksetzen</button>
                      <button class="btn-apply-filters" onclick="app.applyFilters()">OK</button>
                    </div>
                  </div>
                ` : ''}
              </div>

              ${historyHtml}

              <div id="groupedGridContainer">
                ${this.buildGroupedGridHTML(filtered)}
              </div>
            </div>
          `;
        } else if (this.state.activeTab === 'shopping') {
          content = this.renderShoppingBody();
        } else if (this.state.activeTab === 'favorites') {
          const collections = this.state.favCollections || [];
          const collectionFilter = this.state.favCollectionFilter;
          const activeCollection = collections.find(c => c.id === collectionFilter) || null;
          let baseFavorites = this.state.favorites.filter(r => this.matchesFavFilters(r));
          if (activeCollection) {
            const set = new Set(activeCollection.recipeIds);
            baseFavorites = baseFavorites.filter(r => set.has(r.id));
          }
          const favoriteRecipes = this.sortFavorites(baseFavorites);
          const favSort = this.state.favSort || 'added';
          const sortOpt = (v, label) => `<option value="${v}" ${favSort === v ? 'selected' : ''}>${label}</option>`;
          const sortBarHtml = `
            <div style="display:flex; align-items:center; gap:8px; margin:6px 0 10px;">
              <label for="favSortSelect" style="font-size:12px; color:var(--text-muted);">Sortieren</label>
              <select id="favSortSelect" onchange="app.setFavSort(this.value)"
                style="flex:1; padding:8px 10px; border-radius:10px; font-size:13px; background:var(--card-bg, rgba(255,255,255,0.06)); color:var(--text-main, inherit); border:1px solid rgba(150,150,150,0.25);">
                ${sortOpt('added','Zuletzt hinzugefügt')}${sortOpt('az','Name A–Z')}${sortOpt('time','Zubereitungszeit')}${sortOpt('calories','Kalorien')}
              </select>
            </div>
          `;
          const favFilterCount = Object.values(this.state.favFilters).reduce((s, a) => s + (Array.isArray(a) ? a.length : 0), 0);
          const collectionsBarHtml = `
            <div class="collections-bar">
              <span class="collection-chip ${!collectionFilter ? 'active' : ''}" onclick="app.setFavCollectionFilter(null)">Alle (${this.state.favorites.length})</span>
              ${collections.map(c => `
                <span class="collection-chip ${collectionFilter === c.id ? 'active' : ''}" onclick="app.setFavCollectionFilter('${c.id}')">
                  <span>${escapeHtml(c.icon || '⭐')} ${escapeHtml(c.name)} (${c.recipeIds.length})</span>
                  <button class="collection-chip-edit" onclick="event.stopPropagation(); app.editCollection('${c.id}')" title="Umbenennen oder löschen">✎</button>
                </span>
              `).join('')}
              <button class="collection-chip new" onclick="app.createCollection()">+ Neu</button>
            </div>
          `;
          content = `
            <div class="favorites-container" style="position:relative;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">

                            ${cookedCount > 0 ? `<div class="cooked-meta">✓ ${cookedCount}× gekocht · zuletzt ${this.formatDate(lastCooked)}</div>` : ''}
                            ${inCollections.length > 0 ? `<div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${inCollections.map(c => escapeHtml((c.icon || '⭐') + ' ' + c.name)).join(' · ')}</div>` : ''}
                          </div>
                        </div>
                        <button class="favorite-card-arrow" onclick="event.stopPropagation(); app.toggleFavoriteAccordion('${recipe.id}')" aria-label="Details ein-/ausklappen" style="background:transparent;border:none;color:inherit;font-size:16px;cursor:pointer;padding:6px;">${this.state.expandedFavoriteId === recipe.id ? '▾' : '▸'}</button>
                      </div>
                      ${this.state.expandedFavoriteId === recipe.id ? `
                        <div class="favorite-card-details">
                          <div class="favorite-card-actions" style="flex-wrap:wrap;">
                            <button class="favorite-card-open" onclick="event.stopPropagation(); app.openRecipeFromFavorites('${recipe.id}')">Details öffnen</button>
                            <button class="cooked-mark-btn ${cookedCount > 0 ? 'done' : ''}" onclick="event.stopPropagation(); app.markAsCooked('${recipe.id}')">${cookedCount > 0 ? '✓ Nochmal gekocht' : 'Als gekocht markieren'}</button>
                            <button class="fav-collection-btn" onclick="event.stopPropagation(); app.openCollectionAssign('${recipe.id}')">📁 In Sammlung</button>
                            <button class="favorite-card-action" onclick="event.stopPropagation(); app.removeFromFavorites('${recipe.id}')">Entfernen</button>
                          </div>
                          ${this.getRecipeIngredients(recipe).map(ingredient => `
                            <div class="favorite-ingredient-row">
                              <span style="font-size:12px; color:var(--text-muted);">${escapeHtml(ingredient.name)}${ingredient.quantity ? ' – ' + escapeHtml(ingredient.quantity) : ''}</span>
                              <button class="favorite-ingredient-add" onclick="event.stopPropagation(); app.addIngredientToShoppingList('${escapeHtml(ingredient.name)}', '${escapeHtml(ingredient.quantity || '')}')">+</button>

              <div class="history-sheet-overlay" onclick="app.closeFavFilters()">

                  <div class="history-sheet-header">
                    <div class="history-sheet-title">Favoriten filtern</div>
                    <button class="history-sheet-close" onclick="app.closeFavFilters()">×</button>

                  ${this.renderFavFilterPanel()}
                </div>

            `;
          }
          if (this.state.cookedHistoryOpen) {
            extraOverlay += this.renderCookedHistoryScreen();
          }
          if (this.state.weekPlanOpen) {
            extraOverlay += this.renderWeekPlanScreen();
          }
        } else if (this.state.activeTab === 'profile') {
          content = this.renderProfileScreen();
        } else if (this.state.activeTab === 'social') {
          content = this.renderSocialTab();
          if (this.state.socialCreateOpen) {
            extraOverlay += this.renderSocialCreateSheet();
          }
        }

        if (this.state.pantryOpen) {
          extraOverlay += this.renderPantrySheet();
        }
        if (this.state.leftoverOpen) {
          extraOverlay += this.renderLeftoverSheet();

        if (this.state.favAssignRecipeId) {
          extraOverlay += this.renderCollectionAssignSheet();

        if (this.state.premiumPopupOpen) {
          extraOverlay += `

                <button class="premium-popup-close" onclick="app.closePremiumPopup()">Später</button>
              </div>
            </div>
          `;
        }


        let modalHtml = '';
        if (this.state.selectedRecipe) {
          const r = this.state.selectedRecipe;
          const ingredients = this.getRecipeIngredients(r);

          modalHtml = `
            <div class="modal-overlay" onclick="app.state.selectedRecipe = null; app.render();">
              <div class="modal-content" onclick="event.stopPropagation();">
                <img loading="lazy" decoding="async" src="${r.image}" class="modal-image" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">

                <p style="color:var(--text-muted); font-size:13px; margin-bottom:18px;">⏱ ${escapeHtml(r.time)} | 🔥 ${escapeHtml(r.calories)} | 📊 ${escapeHtml(r.difficulty)}</p>

                <ul class="ingredients-list">

                    const factor = (this.state.currentServings || base) / base;
                    const scaledQty = this.scaleQuantity(item.quantity || '', factor);
                    return `
                    <li>
                      <span class="ingredient-name">• ${escapeHtml(item.name)}</span>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <span class="ingredient-qty">${escapeHtml(scaledQty || 'nach Bedarf')}</span>
                        <button class="ingredient-add-btn" onclick="event.stopPropagation(); app.addIngredientToShoppingList('${escapeHtml(item.name)}', '${escapeHtml(scaledQty || '')}')">+</button>

                    </li>
                  `;}).join('')}
                </ul>

                <h3 style="margin-bottom:10px; font-size:16px;">Zubereitung</h3>
                <ol class="instruction-list">
                  ${r.steps.map(step => `<li>${escapeHtml(step)}</li>`).join('')}
                </ol>

                <button class="btn-cook-start" onclick="app.startCookMode()">👨‍🍳 Kochmodus starten</button>

                <div class="modal-actions">
                  <button class="btn-outline" onclick="app.addToShoppingList(app.state.selectedRecipe)">Zur Einkaufsliste</button>
                  <button class="btn-favorite-toggle" onclick="app.toggleFavorite(app.state.selectedRecipe)">${this.isFavorite(r.id) ? 'Aus Favoriten entfernen' : 'Zu Favoriten hinzufügen'}</button>
                  <button class="btn-outline" onclick="app.openCollectionAssign('${r.id}')">📁 In Sammlung</button>
                </div>

                ${(() => {
                  const similar = this.findSimilarRecipes(r, 4);
                  if (!similar.length) return '';
                  let ratings = {};
                  try { ratings = JSON.parse(AppStorage.getItem('recipe_ratings_v1') || '{}'); } catch (e) {}
                  return `
                    <div class="similar-section">
                      <div class="similar-title">Das könnte dir auch gefallen</div>
                      <div class="similar-scroll">
                        ${similar.map(s => {
                          const stats = ratings[s.id] || {};
                          const avg = typeof stats.avg === 'number' ? stats.avg : 0;
                          const stars = avg > 0 ? ('★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg))) : '☆☆☆☆☆';
                          return `
                            <div class="similar-card" onclick="app.openRecipe('${s.id}')">
                              <img loading="lazy" decoding="async" src="${s.image}" class="similar-card-img" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">
                              <div class="similar-card-body">
                                <div class="similar-card-title">${escapeHtml(s.title)}</div>
                                <div class="similar-card-meta">
                                  <span>⏱ ${escapeHtml(s.time)}</span>
                                  <span class="similar-card-stars" title="${avg ? avg.toFixed(1) : 'Keine Bewertung'}">${stars}</span>
                                </div>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `;
                })()}
              </div>
            </div>
          `;
        }

        const cookHtml = this.renderCookMode();
        const cookMinibarHtml = this.renderCookMinibar ? this.renderCookMinibar() : '';
        const cookToastHtml = this.renderCookToast ? this.renderCookToast() : '';
        root.innerHTML = `
          <div class="app">
            <div class="content">${content}</div>
            ${modalHtml}
            ${cookHtml}
            ${cookMinibarHtml}
            ${cookToastHtml}
            ${extraOverlay || ''}
            <nav class="navbar">${(() => {

              const navIcons = {
                discover: {
                  outline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
                  filled: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 4a6.5 6.5 0 1 0 4.2 11.6l4.8 4.8 1.4-1.4-4.8-4.8A6.5 6.5 0 0 0 10.5 4z"/></svg>'
                },
                favorites: {
                  outline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.7-4.4-9.2-7.8C.5 10.5 2.4 6 6 6c2 0 3.8 1.2 4.6 2.8h.8C12.2 7.2 14 6 16 6c3.6 0 5.5 4.5 3.2 7.2C16.7 16.6 12 21 12 21z"/></svg>',
                  filled: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.4-9.2-7.8C.5 10.5 2.4 6 6 6c2 0 3.8 1.2 4.6 2.8h.8C12.2 7.2 14 6 16 6c3.6 0 5.5 4.5 3.2 7.2C16.7 16.6 12 21 12 21z"/></svg>'
                },
                swipe: {
                  outline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.75L12 3l9 6.75"/><path d="M5 10.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9.5"/><path d="M10 21V12h4v9"/></svg>',
                  filled: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l-9.5 7.1A1 1 0 0 0 2 11v9a2 2 0 0 0 2 2h5v-7h6v7h5a2 2 0 0 0 2-2v-9a1 1 0 0 0-.5-.7L12 3.2z"/></svg>'
                },
                social: {
                  outline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
                  filled: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8 3c2.8 0 5 2.2 5 5v1H11v-1c0-2.8 2.2-5 5-5zm-8 0c2.8 0 5 2.2 5 5v1H3v-1c0-2.8 2.2-5 5-5z"/></svg>'
                },
                profile: {
                  outline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>',
                  filled: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.8 0 5-2.2 5-5s-2.2-5-5-5-5 2.2-5 5 2.2 5 5 5zm0 2c-5 0-9 3.6-9 8h18c0-4.4-4-8-9-8z"/></svg>'
                }
              };
              const labels = { discover: 'Entdecken', swipe: 'Swipe', favorites: 'Favoriten', social: 'Social', profile: 'Profil' };
              return Object.keys(navIcons).map(tab => {
                const active = this.state.activeTab === tab;
                return `<button class="nav-btn ${active ? 'active' : ''}" onclick="app.setTab('${tab}')"><span class="nav-icon">${active ? navIcons[tab].filled : navIcons[tab].outline}</span><span class="nav-label">${labels[tab]}</span></button>`;
              }).join('');
            })()}</nav>


          </div>
        `;
      }


      // ===================== SHOPPING (Body) =====================
      renderShoppingBody() {
        const SUPERMARKET_ORDER = [
          { key: 'Obst & Gemüse', icon: '🥬' },
          { key: 'Fleisch & Fisch', icon: '🥩' },
          { key: 'Milchprodukte', icon: '🥛' },
          { key: 'Backwaren', icon: '🍞' },
          { key: 'Konserven', icon: '🥫' },
          { key: 'Nudeln, Reis & Trockenware', icon: '🍝' },
          { key: 'Gewürze & Öle', icon: '🧂' },
          { key: 'Getränke', icon: '🥤' },
          { key: 'Tiefkühl', icon: '🧊' },
          { key: 'Snacks & Süßes', icon: '🍫' },
          { key: 'Sonstiges', icon: '📦' }
        ];
        const groupedShoppingList = SUPERMARKET_ORDER.reduce((acc, s) => { acc[s.key] = []; return acc; }, {});
        const supermarketIcons = Object.fromEntries(SUPERMARKET_ORDER.map(s => [s.key, s.icon]));
        const pantryLikeItems = [];
        this.state.shoppingList.forEach(item => {
          if (this.isPantryIngredient(item.name)) {
            pantryLikeItems.push(item);
            return;
          }
          const category = this.getSupermarketCategory(item.name);
          if (!groupedShoppingList[category]) groupedShoppingList[category] = [];
          groupedShoppingList[category].push(item);
        });
        Object.keys(groupedShoppingList).forEach(k => {
          groupedShoppingList[k].sort((a, b) => String(a.name).localeCompare(String(b.name), 'de'));
        });
        const pantryExpanded = this.state.shoppingPantryExpanded;
        const pantrySectionHtml = pantryLikeItems.length === 0 ? '' : `
          <div style="margin-top:18px; border-top:1px solid var(--border, rgba(255,255,255,0.08)); padding-top:12px;">
            <button class="discover-diet-toggle" style="width:100%;" onclick="app.toggleShoppingPantry()">
              <span class="discover-toggle-icon">${pantryExpanded ? '▾' : '▸'}</span>
              <span>Aus deinen Vorräten (${pantryLikeItems.length})</span>
            </button>
            ${pantryExpanded ? `
              <div style="margin-top:8px;">
                ${pantryLikeItems.map(item => `
                  <div class="shopping-item ${item.done ? 'done' : ''}">
                    <label>
                      <input type="checkbox" ${item.done ? 'checked' : ''} onchange="app.toggleShoppingItem(${this.state.shoppingList.indexOf(item)})">
                      <span>${escapeHtml(item.name)}${item.quantity ? ` – ${escapeHtml(item.quantity)}` : ''}</span>
                    </label>
                    <button class="btn-delete" onclick="app.removeShoppingItem(${this.state.shoppingList.indexOf(item)})">🗑️</button>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
        return `
          <div class="shopping-container">
            ${this.state.shoppingList.length === 0 ? '<p style="color:var(--text-muted)">Deine Liste ist leer 🛒</p>' : Object.entries(groupedShoppingList).filter(([, items]) => items.length > 0).map(([section, items]) => `
              <div style="margin-bottom:14px;">
                <div style="font-size:12px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px;">${supermarketIcons[section] || ''} ${escapeHtml(section)}</div>
                ${items.map(item => `
                  <div class="shopping-item ${item.done ? 'done' : ''}">
                    <label>
                      <input type="checkbox" ${item.done ? 'checked' : ''} onchange="app.toggleShoppingItem(${this.state.shoppingList.indexOf(item)})">
                      <span>${escapeHtml(item.name)}${item.quantity ? ` – ${escapeHtml(item.quantity)}` : ''}</span>
                    </label>
                    <button class="btn-delete" onclick="app.removeShoppingItem(${this.state.shoppingList.indexOf(item)})">🗑️</button>
                  </div>
                `).join('')}
              </div>
            `).join('')}
            ${pantrySectionHtml}
          </div>
        `;
      }

      // ===================== PREFERENCES BODY =====================
      renderPreferencesBody() {
        const p = this.state.preferences || { diet: 'none', intolerances: [] };
        const dietOpts = [['none','Keine Einschränkung'],['vegetarian','Vegetarisch'],['vegan','Vegan']];
        const intolOpts = [['gluten','Glutenfrei'],['lactose','Laktosefrei']];
        return `
          <p style="color:var(--text-muted); font-size:12px; margin-bottom:14px;">
            Diese Einstellungen werden dauerhaft gespeichert und automatisch auf Swipe, Entdecken und Wochenplan-Vorschläge angewendet.
          </p>
          <div class="filter-section-title">Diätform</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;">
            ${dietOpts.map(([v,l]) => `
              <span class="swipe-chip ${p.diet === v ? 'active' : ''}" onclick="app.setPreferenceDiet('${v}')">${escapeHtml(l)}</span>
            `).join('')}
          </div>
          <div class="filter-section-title" style="margin-top:16px;">Unverträglichkeiten</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;">
            ${intolOpts.map(([v,l]) => `
              <span class="swipe-chip ${(p.intolerances||[]).includes(v) ? 'active' : ''}" onclick="app.togglePreferenceIntolerance('${v}')">${escapeHtml(l)}</span>
            `).join('')}
          </div>
        `;
      }

      // ===================== PROFILE SCREEN =====================
      renderProfileScreen() {
        const sub = this.state.profileScreen;
        if (!sub) {
          const pantryCount = (this.state.pantry.items.length + this.state.pantry.custom.length);
          const cookedCount = this.state.cookedLog.length;
          const favCount = (this.state.favorites || []).length;
          const collectionsCount = (this.state.favCollections || []).length;
          let ratingsCount = 0;
          try {
            const r = JSON.parse(AppStorage.getItem('recipe_ratings_v1') || '{}');
            ratingsCount = Object.values(r).filter(v => v && v.userStars > 0).length;
          } catch (e) {}

          const cloudUser = (window.Cloud && window.Cloud.getUser && window.Cloud.getUser()) || null;
          const isSignedIn = !!cloudUser;
          const displayName = isSignedIn
            ? ((cloudUser.email || '').split('@')[0] || 'Konto')
            : 'Gast';
          const avatarInitial = isSignedIn
            ? (displayName.charAt(0) || '👤').toUpperCase()
            : '👤';
          const accountEmailHtml = isSignedIn
            ? `<div class="profile-email">${escapeHtml(cloudUser.email || '')}</div>`
            : `<div class="profile-email">Als Gast &middot; nur auf diesem Ger&auml;t gespeichert</div>`;
          const accountButtonHtml = isSignedIn
            ? `<button class="profile-account-btn" onclick="window.openAccountModal && window.openAccountModal()">Konto verwalten</button>`
            : `<button class="profile-account-btn primary" onclick="window.openAccountModal && window.openAccountModal()">Anmelden / Registrieren</button>`;

          const statsHtml = `
            <div class="profile-stats">
              <div class="profile-stat"><div class="profile-stat-value">${favCount}</div><div class="profile-stat-label">Favoriten</div></div>
              <div class="profile-stat"><div class="profile-stat-value">${cookedCount}</div><div class="profile-stat-label">Gekocht</div></div>
              <div class="profile-stat"><div class="profile-stat-value">${collectionsCount}</div><div class="profile-stat-label">Sammlungen</div></div>
              <div class="profile-stat"><div class="profile-stat-value">${ratingsCount}</div><div class="profile-stat-label">Bewertungen</div></div>
            </div>
          `;

          const rows = [
            { key: 'shopping', icon: '🛒', label: 'Einkaufsliste', hint: this.state.shoppingList.length > 0 ? `${this.state.shoppingList.length} Einträge` : '' },
            { key: 'weekplan', icon: '📅', label: 'Wochenplan', hint: '' },
            { key: 'preferences', icon: '🥗', label: (this.state.premiumUnlocked ? '' : '👑 ') + 'Ernährung & Präferenzen', hint: '' },
            { key: 'pantry', icon: '🥫', label: 'Vorratsschrank', hint: pantryCount > 0 ? `${pantryCount} Zutaten` : '' },
            { key: 'cooked', icon: '📖', label: 'Kochverlauf', hint: cookedCount > 0 ? `${cookedCount}` : '' }
          ];
          return `
            <div class="profile-container" style="padding: 20px 15px;">
              <div class="profile-header">

                    <span class="profile-menu-arrow">›</span>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }
        const titles = { shopping: 'Einkaufsliste', weekplan: 'Wochenplan', preferences: 'Ernährung & Präferenzen', pantry: 'Vorratsschrank', cooked: 'Kochverlauf' };
        let body = '';

        if (sub === 'shopping') body = this.renderShoppingBody();
        else if (sub === 'weekplan') { body = this.renderWeekPlanBody(); extraAfter = this.renderWeekPlanPickerOverlay(); }
        else if (sub === 'preferences') body = this.renderPreferencesBody();
        else if (sub === 'pantry') body = this.renderPantryBody();
        else if (sub === 'cooked') body = this.renderCookedHistoryBody();
        return `

          ${extraAfter}
        `;
      }
    }

    const app = new PremiumApp();
    window.app = app;
    try { window.allRecipes = allRecipes; } catch(e) {}
    // ---- Kochmodus: Wiederherstellung nach Reload ----
    try { app.restoreCookModeFromStorage(); app.render(); } catch(e) { console.warn('cook restore', e); }
    // Bei Sichtbarkeitswechsel Tick sofort ausführen, damit Restzeit / Ablauf-Erkennung stimmt.
    try {
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) { try { app._cookTick(); } catch(e){} }
      });
      window.addEventListener('focus', () => { try { app._cookTick(); } catch(e){} });
    } catch(e) {}
  </script>

  <script>
  (function(){
    // ---------- Rating store ----------
    const RKEY = 'recipe_ratings_v1';
    function loadRatings(){ try { return JSON.parse(localStorage.getItem(RKEY) || '{}'); } catch { return {}; } }
    function saveRatings(r){ localStorage.setItem(RKEY, JSON.stringify(r)); }
    function ensure(id){
      const all = loadRatings();
      if (!all[id]) all[id] = { sum:0, count:0, likes:0, cookedYes:0, cookedTotal:0, userStars:0 };
      return { all, r: all[id] };
    }
    // Seed some plausible community data once
    if (!localStorage.getItem(RKEY + ':seeded')) {
      const seed = {};
      const ids = ['1','2','3','5','6','7','8','9','10','11','12'];
      let s = 42;
      const rnd = () => { s = (s*1103515245 + 12345) & 0x7fffffff; return s/0x7fffffff; };
      ids.forEach(id => {
        const count = 8 + Math.floor(rnd()*80);
        const avg = 3.6 + rnd()*1.4;
        const cookedTotal = Math.floor(count * (0.5 + rnd()*0.4));
        const cookedYes = Math.floor(cookedTotal * (0.6 + rnd()*0.35));
        seed[id] = {
          sum: Math.round(avg*count*10)/10,
          count,
          likes: Math.floor(rnd()*120),
          cookedYes, cookedTotal,
          userStars: 0
        };
      });
      saveRatings(seed);
      localStorage.setItem(RKEY + ':seeded','1');
    }
    function getStats(id){
      const { r } = ensure(id);
      const avg = r.count > 0 ? (r.sum / r.count) : 0;
      const cookAgainPct = r.cookedTotal > 0 ? Math.round((r.cookedYes / r.cookedTotal)*100) : null;
      return { avg, count:r.count, likes:r.likes, userStars:r.userStars, cookAgainPct, cookedYes:r.cookedYes, cookedTotal:r.cookedTotal };
    }
    function addRating(id, stars){
      const { all, r } = ensure(id);
      if (r.userStars > 0) { r.sum -= r.userStars; r.count -= 1; }
      r.userStars = stars; r.sum += stars; r.count += 1;
      saveRatings(all);
    }
    function recordCookedAgain(id, yes){
      const { all, r } = ensure(id);
      r.cookedTotal += 1;
      if (yes) r.cookedYes += 1;
      saveRatings(all);
    }
    function popularityScore(id){
      const s = getStats(id);
      const cookBonus = s.cookAgainPct != null ? (s.cookAgainPct/100)*5 : 0;
      return s.avg * Math.log2(s.count + 2) + s.likes*0.3 + cookBonus;
    }
    window.__ratings = { getStats, addRating, recordCookedAgain, popularityScore };

    // ---------- Helpers ----------
    function starsUnicode(avg){
      const full = Math.round(avg);
      let out = '';
      for (let i=1;i<=5;i++) out += (i<=full ? '★' : '☆');
      return out;
    }
    function formatAvg(a){ return a.toFixed(1).replace('.', ','); }
    function inlineStars(id, opts){
      const s = getStats(id);
      if (s.count === 0) return '<span class="rating-inline" style="color:var(--text-muted); font-weight:500;">Noch keine Bewertung</span>';
      const compact = opts && opts.compact;
      const showCount = !opts || opts.showCount !== false;
      return `<span class="rating-inline">★ ${formatAvg(s.avg)}${showCount ? ` <span class="rc">(${s.count})</span>` : ''}</span>`;
    }

    // ---------- Patch: swipe card meta ----------
    const origBuildGrouped = app.buildGroupedGridHTML.bind(app);
    app.buildGroupedGridHTML = function(recipes){
      let html = origBuildGrouped(recipes);
      // Inject stars into grid items by mapping title back? Use recipe order per group is hard;
      // easier: use regex to insert after grid-item-meta based on adjacent openRecipe id
      html = html.replace(
        /<div class="grid-item-text-only" onclick="app\.openRecipe\('([^']+)'\)">([\s\S]*?)<\/div>/g,
        (m, id, inner) => `<div class="grid-item-text-only" onclick="app.openRecipe('${id}')">${inner}${inlineStars(id, {compact:true, showCount:false})}</div>`
      );
      return html;
    };

    // ---------- Patch: Social tab ----------
    if (!('socialSubTab' in app.state)) app.state.socialSubTab = 'popular';
    app.setSocialSubTab = function(t){ app.state.socialSubTab = t; app.render(); };
    app.openRecipeAndRender = function(id){ app.openRecipe(id); };

    const origRenderSocial = app.renderSocialTab.bind(app);
    app.renderSocialTab = function(){
      const sub = app.state.socialSubTab || 'popular';
      const tabs = `
        <div class="social-tabs">
          <button class="social-tab-btn ${sub==='popular'?'active':''}" onclick="app.setSocialSubTab('popular')">Beliebt</button>
          <button class="social-tab-btn ${sub==='posts'?'active':''}" onclick="app.setSocialSubTab('posts')">Beiträge</button>
        </div>`;
      if (sub === 'posts') {
        return tabs + origRenderSocial();
      }
      // popular
      const recipes = (typeof allRecipes !== 'undefined' ? allRecipes : []).slice();
      const ranked = recipes
        .map(r => ({ r, score: popularityScore(r.id), stats: getStats(r.id) }))
        .sort((a,b) => b.score - a.score)
        .slice(0, 20);
      const items = ranked.map((row, i) => {
        const r = row.r; const s = row.stats;
        const countTxt = s.count > 0 ? `${s.count} Bewertungen` : 'Noch keine Bewertungen';
        const starTxt = s.count > 0 ? `<span class="stat-star">★ ${formatAvg(s.avg)}</span>` : '';
        return `
          <div class="popular-card" onclick="app.openRecipe('${r.id}')">
            <img loading="lazy" decoding="async" src="${r.image}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">
            <div class="popular-card-body">
              <div class="popular-card-cat"><span class="popular-rank">${i+1}</span>${r.category || ''}</div>
              <div class="popular-card-title">${r.title.replace(/</g,'&lt;')}</div>
              <div class="popular-card-stats">
                ${starTxt}
                <span>${countTxt}</span>
                <span class="stat-likes">♥ ${s.likes}</span>
              </div>
            </div>
          </div>`;
      }).join('');
      return tabs + `
        <div class="popular-container">
          <div style="padding: 4px 15px 0; color:var(--text-muted); font-size:12px;">Die beliebtesten Rezepte der Community</div>
          <div class="popular-list">${items || '<div class="social-empty">Noch keine bewerteten Rezepte.</div>'}</div>
        </div>`;
    };

    // ---------- Patch: markAsCooked -> Cooked-Again sheet ----------
    const origMarkCooked = app.markAsCooked.bind(app);
    app.markAsCooked = function(id){
      origMarkCooked(id);
      app.state.cookedAgainAskId = id;
      app.render();
    };
    app.answerCookedAgain = function(yes){
      const id = app.state.cookedAgainAskId;
      if (id) recordCookedAgain(id, !!yes);
      app.state.cookedAgainAskId = null;
      // Remove the overlay from DOM so we return to the main view
      document.querySelectorAll('.cooked-again-overlay').forEach(el => el.remove());
      app.render();
    };

    // ---------- Patch: rate from detail ----------
    app.rateRecipe = function(id, stars){
      addRating(id, stars);
      app.render();
    };

    // ---------- Post-render enhancements ----------
    const origRender = app.render.bind(app);
    app.render = function(){
      origRender();

      // Swipe card: gelbes Stern/Rating-Badge entfernt — gewünscht ohne gelbe Hinweise
      // (keine Injection des rating-tag in die Swipe-Karte)

      // Favorites: add rating line under meta
      try {
        const favs = (app.state.favorites || []);
        document.querySelectorAll('.favorite-card').forEach(card => {
          const titleEl = card.querySelector('.favorite-card-title');
          if (!titleEl) return;
          const title = titleEl.textContent.trim();
          const rec = favs.find(f => f.title === title);
          if (!rec) return;
          const metaEl = card.querySelector('.favorite-card-meta');
          if (metaEl && !metaEl.parentElement.querySelector('.favorite-card-rating')) {
            const s = getStats(rec.id);
            const div = document.createElement('div');
            div.className = 'favorite-card-rating';
            div.innerHTML = s.count > 0 ? `★ ${formatAvg(s.avg)} <span style="color:var(--text-muted); font-weight:500;">(${s.count})</span>` : '';
            if (s.count > 0) metaEl.parentElement.insertBefore(div, metaEl.nextSibling);
          }
        });
      } catch(e){}

      // Detail modal: rating block + user star input
      try {
        const r = app.state.selectedRecipe;
        if (r) {
          const modal = document.querySelector('.modal-content');
          if (modal && !modal.querySelector('.rating-block')) {
            const s = getStats(r.id);
            const wrap = document.createElement('div');
            wrap.className = 'rating-block';
            wrap.innerHTML = `
              <div>${s.count>0 ? `<span class="rb-avg">★ ${formatAvg(s.avg)}</span> <span class="rb-count">(${s.count} Bewertungen)</span>` : '<span class="rb-count">Noch keine Bewertungen</span>'}</div>
              ${s.cookAgainPct != null ? `<div class="rb-cook">👍 ${s.cookAgainPct}% würden es wieder kochen (${s.cookedTotal})</div>` : ''}
              <div class="rb-hint">Deine Bewertung:</div>
              <div class="star-input" id="star-input-${r.id}">
                ${[1,2,3,4,5].map(i => `<span data-v="${i}" class="${i <= s.userStars ? 'on' : ''}">★</span>`).join('')}
              </div>
            `;
            const h2 = modal.querySelector('h2');
            if (h2 && h2.nextSibling) modal.insertBefore(wrap, h2.nextSibling.nextSibling);
            else modal.appendChild(wrap);

            const input = wrap.querySelector('.star-input');
            input.addEventListener('mouseover', (e) => {
              const v = e.target.dataset && +e.target.dataset.v;
              if (!v) return;
              input.querySelectorAll('span').forEach(sp => {
                sp.classList.toggle('hover', +sp.dataset.v <= v);
              });
            });
            input.addEventListener('mouseout', () => input.querySelectorAll('span').forEach(sp => sp.classList.remove('hover')));
            input.addEventListener('click', (e) => {
              const v = e.target.dataset && +e.target.dataset.v;
              if (v) app.rateRecipe(r.id, v);
            });
          }
        }
      } catch(e){}

      // Cooked-again bottom sheet
      try {
        if (app.state.cookedAgainAskId) {
          if (!document.querySelector('.cooked-again-overlay')) {
            const overlay = document.createElement('div');
            overlay.className = 'cooked-again-overlay';
            overlay.innerHTML = `
              <div class="cooked-again-sheet" onclick="event.stopPropagation()">
                <h3>Würdest du dieses Rezept noch einmal kochen?</h3>
                <p>Deine Antwort hilft der Community, die besten Rezepte zu finden.</p>
                <div class="cooked-again-actions">
                  <button class="ca-no" onclick="app.answerCookedAgain(false)">❌ Nein</button>
                  <button class="ca-yes" onclick="app.answerCookedAgain(true)">✅ Ja</button>
                </div>
              </div>`;
            overlay.addEventListener('click', (e) => {
              if (e.target === overlay) app.answerCookedAgain(false);
            });
            document.body.appendChild(overlay);
          }
        }
      } catch(e){}
    };

    // Kick a re-render to apply patches to the current view
    app.render();
  })();
  </script>

  <script>
  (function(){
    if (!window.app) return;

    if (!('postsSubTab' in app.state)) app.state.postsSubTab = 'discover';
    if (!('followingUsers' in app.state)) {
      try { app.state.followingUsers = JSON.parse(localStorage.getItem('following_users') || '[]'); }
      catch { app.state.followingUsers = []; }
    }
    if (!('viewingProfileAuthor' in app.state)) app.state.viewingProfileAuthor = null;

    function saveFollowing(){ localStorage.setItem('following_users', JSON.stringify(app.state.followingUsers)); }
    function isFollowing(name){ return (app.state.followingUsers || []).includes(name); }
    function esc(s){ return (typeof escapeHtml === 'function') ? escapeHtml(s) : String(s||''); }
    function initials(name){ return (name || '?').split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase(); }
    function hashStr(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h*16777619) >>> 0; } return h; }
    function seedStats(name){
      const h = hashStr(name || '');
      return { followers: 40 + (h % 860), following: 30 + ((h >>> 8) % 240) };
    }

    app.setPostsSubTab = function(t){ app.state.postsSubTab = t; app.render(); };
    app.openUserProfile = function(name){
      if (!name) return;
      app.state.viewingProfileAuthor = name;
      app.render();
    };
    app.closeUserProfile = function(){ app.state.viewingProfileAuthor = null; app.render(); };
    app.toggleFollow = function(name){
      if (!name || name === 'Du') return;
      const arr = app.state.followingUsers || [];
      const i = arr.indexOf(name);
      if (i >= 0) arr.splice(i,1); else arr.push(name);
      app.state.followingUsers = arr;
      saveFollowing();
      app.render();
    };

    function renderPostCard(p){
      const r = app.getRecipeById(p.recipeId);
      if (!r) return '';
      const img = p.photoDataUrl || r.image;
      const author = p.author || '?';
      const authorClickable = author !== 'Du';
      const safeAuthor = author.replace(/'/g,"\\'");
      const clickAttr = authorClickable ? `onclick="app.openUserProfile('${safeAuthor}')"` : '';
      const followBtn = authorClickable
        ? `<button class="follow-btn ${isFollowing(author) ? 'following':''}" onclick="event.stopPropagation(); app.toggleFollow('${safeAuthor}')">${isFollowing(author) ? 'Folge ich' : 'Folgen'}</button>`
        : '';
      return `
        <div class="social-post post-card-v2">
          <div class="social-post-head">
            <div class="social-avatar post-author-link" ${clickAttr}>${esc(initials(author))}</div>
            <div style="flex:1; min-width:0;" class="post-author-link" ${clickAttr}>
              <div class="social-author">${esc(author)}</div>
              <div class="social-time">${app.timeAgo(p.createdAt)}</div>
            </div>
            ${author === 'Du'
              ? `<button class="social-action-btn" onclick="app.deleteSocialPost('${p.id}')" title="Löschen">✕</button>`
              : followBtn}
          </div>
          <img loading="lazy" decoding="async" class="social-post-image" src="${img}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'">
          <div class="social-post-actions">
            <button class="social-action-btn ${p.likedByMe ? 'liked' : ''}" onclick="app.toggleSocialLike('${p.id}')">
              ${p.likedByMe ? '♥' : '♡'} ${p.likes}
            </button>
            <button class="social-action-btn" onclick="document.getElementById('sc-input-${p.id}').focus()">💬 ${p.comments.length}</button>
            <button class="social-action-btn" onclick="app.shareSocialPost('${p.id}')">↗ Teilen</button>
            <button class="social-action-btn" style="margin-left:auto;" onclick="app.openRecipe('${r.id}')">Rezept</button>
          </div>
          <div class="social-post-body">
            <div class="social-post-recipe">${esc(r.title)}</div>
            ${p.caption ? `<div>${esc(p.caption)}</div>` : ''}
          </div>
          ${p.comments.length > 0 ? `
            <div class="social-comments">
              ${p.comments.map(c => `<div class="social-comment"><strong>${esc(c.author)}</strong>${esc(c.text)}</div>`).join('')}
            </div>` : ''}
          <div class="social-comment-input">
            <input id="sc-input-${p.id}" placeholder="Kommentieren…" onkeydown="if(event.key==='Enter'){app.addSocialComment('${p.id}')}">
            <button onclick="app.addSocialComment('${p.id}')">Senden</button>
          </div>
        </div>`;
    }

    function renderTopTabs(active){
      return `
        <div class="social-tabs">
          <button class="social-tab-btn ${active==='popular'?'active':''}" onclick="app.setSocialSubTab('popular')">Beliebt</button>
          <button class="social-tab-btn ${active==='posts'?'active':''}" onclick="app.setSocialSubTab('posts')">Beiträge</button>
        </div>`;
    }

    function renderPostsFeed(){
      const sub = app.state.postsSubTab || 'discover';
      const posts = (app.state.socialPosts || []).slice();
      const filtered = (sub === 'following')
        ? posts.filter(p => p.author === 'Du' || isFollowing(p.author))
        : posts;
      const header = `
        <div class="social-header" style="padding: 8px 15px 4px;">
          <div style="font-size:13px; color:var(--text-muted);">
            ${sub==='following' ? 'Beiträge von Personen, denen du folgst' : 'Neue Beiträge aus der Community'}
          </div>
          <button class="social-create-btn" onclick="app.openSocialCreate()">+ Teilen</button>
        </div>`;
      const subtabs = `
        <div class="social-subtabs">
          <button class="social-subtab-btn ${sub==='discover'?'active':''}" onclick="app.setPostsSubTab('discover')">Entdecken</button>
          <button class="social-subtab-btn ${sub==='following'?'active':''}" onclick="app.setPostsSubTab('following')">Folge ich</button>
        </div>`;
      const empty = sub === 'following'
        ? '<div class="empty-feed">Du folgst noch niemandem.<br>Öffne ein Profil unter „Entdecken" und tippe auf „Folgen".</div>'
        : '<div class="empty-feed">Noch keine Beiträge. Teile ein Favoritenrezept!</div>';
      const feed = filtered.length
        ? `<div class="posts-feed">${filtered.map(renderPostCard).join('')}</div>`
        : empty;
      return renderTopTabs('posts') + subtabs + header + feed;
    }

    function renderProfile(){
      const name = app.state.viewingProfileAuthor;
      const posts = (app.state.socialPosts || []).filter(p => p.author === name);
      const isMe = name === 'Du';
      const seeded = seedStats(name);
      const followers = isMe ? (seeded.followers) : (seeded.followers + (isFollowing(name) ? 1 : 0));
      const following = isMe ? (app.state.followingUsers || []).length : seeded.following;
      const safeName = (name || '').replace(/'/g,"\\'");
      const followBtn = isMe ? '' : `
        <button class="follow-btn ${isFollowing(name)?'following':''}" onclick="app.toggleFollow('${safeName}')">
          ${isFollowing(name) ? 'Folge ich' : 'Folgen'}
        </button>`;
      const postsHtml = posts.length
        ? `<div class="posts-feed" style="padding:6px 0 24px;">${posts.map(renderPostCard).join('')}</div>`
        : '<div class="empty-feed">Noch keine Beiträge.</div>';
      return `
        <div class="profile-view">
          <button class="profile-back-btn" onclick="app.closeUserProfile()">← Zurück</button>
          <div class="profile-header">
            <div class="profile-avatar-lg">${esc(initials(name))}</div>
            <div style="flex:1; min-width:0;">
              <div class="profile-name">${esc(name)}</div>
              <div class="profile-stats">
                <div><div class="profile-stat-num">${posts.length}</div><div class="profile-stat-label">Beiträge</div></div>
                <div><div class="profile-stat-num">${followers}</div><div class="profile-stat-label">Follower</div></div>
                <div><div class="profile-stat-num">${following}</div><div class="profile-stat-label">Folge ich</div></div>
              </div>
            </div>
          </div>
          <div class="profile-actions">${followBtn}</div>
          <div class="profile-section-title">Beiträge</div>
          ${postsHtml}
        </div>`;
    }

    // Preserve "Beliebt" branch by delegating to the previous implementation.
    const prevRender = app.renderSocialTab.bind(app);
    app.renderSocialTab = function(){
      if (app.state.viewingProfileAuthor) return renderProfile();
      const sub = app.state.socialSubTab || 'popular';
      if (sub === 'posts') return renderPostsFeed();
      return prevRender();
    };

    // Close profile view when switching main tabs
    if (typeof app.switchTab === 'function') {
      const origSwitchTab = app.switchTab.bind(app);
      app.switchTab = function(t){
        if (t !== 'social') app.state.viewingProfileAuthor = null;
        return origSwitchTab(t);
      };
    }

    // Double-tap active tab -> reset to that tab's default view
    if (typeof app.setTab === 'function') {
      const origSetTab = app.setTab.bind(app);
      app.setTab = function(tab){
        const isSame = app.state.activeTab === tab;
        if (isSame) {
          app.state.selectedRecipe = null;
          app.state.socialCreateOpen = false;
          app.state.socialSelectedPostId = null;
          app.state.favAssignRecipeId = null;
          app.state.pantryOpen = false;
          app.state.leftoverOpen = false;
          if (tab === 'profile') {
            app.state.profileScreen = null;
          } else if (tab === 'favorites') {
            app.state.favCollectionFilter = null;
            app.state.favFiltersOpen = false;
            app.state.favOptionsOpen = false;
            app.state.cookedHistoryOpen = false;
            app.state.cookedDetailId = null;
          } else if (tab === 'discover') {
            app.state.discoverExpandedDiet = {};
            app.state.discoverExpandedCuisine = {};
          } else if (tab === 'swipe') {
            app.state.swipeSource = 'all';
            try { AppStorage.setItem('swipe_source', 'all'); } catch(e){}
            app.state.swipeFiltersOpen = false;
            app.state.swipeHistoryOpen = false;
          } else if (tab === 'social') {
            app.state.socialSubTab = 'popular';
            app.state.viewingProfileAuthor = null;
            app.state.postsSubTab = 'discover';
          }
          app.render();
          try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){ window.scrollTo(0,0); }
          return;
        }
        origSetTab(tab);
        try { window.scrollTo(0, 0); } catch(e){}
      };
    }

    app.render();
  })();
  </script>
