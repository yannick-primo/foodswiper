        const targetDiet = recipe.diet;
        const targetSpice = recipe.spice || 'mild';
        const targetTime = this.getTimeValue(recipe.time);
        const targetCat = String(recipe.category || '').toLowerCase();
        const targetIngs = new Set(this.getRecipeIngredients(recipe).map(i => String(i.name || '').toLowerCase()));
        const scored = allRecipes.filter(r => r.id !== recipe.id && this.matchesPreferences(r)).map(r => {
          let s = 0;
          if (this.getRecipeCuisine(r) === targetCuisine) s += 4;
          if (r.diet === targetDiet) s += 2;
          if ((r.spice || 'mild') === targetSpice) s += 1.5;
          if (String(r.category || '').toLowerCase() === targetCat) s += 1.5;
          const dt = Math.abs(this.getTimeValue(r.time) - targetTime);
          if (dt <= 10) s += 1.2; else if (dt <= 20) s += 0.6;
          const ings = this.getRecipeIngredients(r).map(i => String(i.name || '').toLowerCase());
          let overlap = 0;
          ings.forEach(n => { if (targetIngs.has(n)) overlap++; });
          s += overlap * 0.8;
          s += Math.random() * 0.3;
          return { r, s };
        });
        scored.sort((a, b) => b.s - a.s);
        return scored.slice(0, count).map(x => x.r);
      }
      addSwipeHistory(recipeId) {
        let hist = this.state.swipeHistory.filter(id => id !== recipeId);
        hist.unshift(recipeId);
        hist = hist.slice(0, 20);
        this.state.swipeHistory = hist;
        AppStorage.setItem('swipe_hist', JSON.stringify(hist));
      }
      advanceSwipe() {
        if (this.state.swipeOrder && this.state.swipeOrder.length > 0) {
          this.state.currentIndex = (this.state.currentIndex + 1) % this.state.swipeOrder.length;
        }
      }

      toggleSwipeFilter(cat, value) {
        if (!this.state.premiumUnlocked) { this.showPremiumPopup(); return; }
        const arr = this.state.swipeFilters[cat] || [];
        const idx = arr.indexOf(value);
        if (idx >= 0) arr.splice(idx, 1); else arr.push(value);
        this.state.swipeFilters[cat] = arr;
        AppStorage.setItem('swipe_filters', JSON.stringify(this.state.swipeFilters));
        this.state.swipeOrder = null;
        this.render();
      }
      clearSwipeFilters() {
        this.state.swipeFilters = { diet: [], calories: [], time: [], difficulty: [], servings: [], spice: [], cuisine: [] };
        AppStorage.setItem('swipe_filters', JSON.stringify(this.state.swipeFilters));
        this.state.swipeOrder = null;
        this.render();
      }
      clearInitialPreferences() {
        try { if (window.Reco && window.Reco.resetInitial) window.Reco.resetInitial(); } catch (e) {}
        this.state.swipeOrder = null;
        this.render();
      }
      toggleSwipeFiltersPanel() {
        if (!this.state.premiumUnlocked && !this.state.swipeFiltersOpen) {
          this.showPremiumPopup();
          return;
        }
        this.state.swipeFiltersOpen = !this.state.swipeFiltersOpen;
        this.render();
      }
      toggleSwipeHistorySheet() {
        this.state.swipeHistoryOpen = !this.state.swipeHistoryOpen;
        this.render();
      }

      handlePass() {
        const deck = this.getSwipeDeck();
        if (deck.recipe && !deck.ad) this.addSwipeHistory(deck.recipe.id);
        this.advanceSwipe();
        this.render();
      }


      clearAllFavorites() {
        if (this.state.favorites.length === 0) return;
        if (!confirm('Alle Favoriten wirklich löschen?')) return;
        this.state.favorites = [];
        AppStorage.setItem('favs', JSON.stringify([]));
        this.render();
      }

      isFavorite(id) {
        return this.state.favorites.some(f => f.id === id);
      }

      addToFavorites(recipe) {
        if (!this.isFavorite(recipe.id)) {
          // Free: max. 15 Favoriten
          if (!this.state.premiumUnlocked && this.state.favorites.length >= 15) {
            this.showPremiumPopup();
            return;
          }
          this.state.favorites.push(recipe);
          AppStorage.setItem('favs', JSON.stringify(this.state.favorites));
        }
      }

      removeFromFavorites(id) {
        this.state.favorites = this.state.favorites.filter(f => f.id !== id);
        AppStorage.setItem('favs', JSON.stringify(this.state.favorites));
        // Detail-Slot in ALLEN Tabs schließen, wenn dieses Rezept dort offen war.
        const slots = this.state.selectedRecipeByTab || {};
        Object.keys(slots).forEach(k => {
          if (slots[k] && slots[k].id === id) slots[k] = null;
        });
        this.render();
      }

      toggleFavorite(recipe) {
        if (this.isFavorite(recipe.id)) {
          this.removeFromFavorites(recipe.id);
        } else {
          this.addToFavorites(recipe);
          this.render();
        }
      }

      handleLike() {
        const deck = this.getSwipeDeck();
        if (deck.ad) { this.advanceSwipe(); this.render(); return; }
        const recipe = deck.recipe;
        if (!recipe) return;
        this.addToFavorites(recipe);
        this.addSwipeHistory(recipe.id);
        this.advanceSwipe();
        this.render();
      }


      getRecipeById(id) {
        // Immer zuerst aus allRecipes (autoritative Quelle inkl. aktueller image-URL),
        // erst danach als Fallback aus den (evtl. älteren) Favoriten.
        return allRecipes.find(r => r.id === id) || this.state.favorites.find(r => r.id === id) || null;
      }

      getRecipeIngredients(recipe) {
        return (recipe.ingredients || []).map(item => {
          if (typeof item === 'string') {
            return { name: item, quantity: '' };
          }
          return item;
        });
      }


      // ============ PORTIONSRECHNER ============
      getRecipeBaseServings(recipe) {
        const n = parseInt(recipe && recipe.servings, 10);
        return n > 0 ? n : 2;
      }

      scaleQuantity(qty, factor) {
        if (!qty || typeof qty !== 'string') return qty || '';
        // Match: optional fraction like "1/2", ranges "1-2", decimals "1,5" or "1.5", integers
        return qty.replace(/(\d+[.,]\d+|\d+\s*\/\s*\d+|\d+)/, (match) => {
          let value;
          if (match.includes('/')) {
            const [a, b] = match.split('/').map(s => parseFloat(s.trim()));
            value = b ? a / b : a;
          } else {
            value = parseFloat(match.replace(',', '.'));
          }
          if (isNaN(value)) return match;
          const scaled = value * factor;
          let out;
          if (Math.abs(scaled - Math.round(scaled)) < 0.05) {
            out = String(Math.round(scaled));
          } else {
            out = scaled.toFixed(1).replace('.', ',');
          }
          return out;
        });
      }

      changeServings(delta) {
        const next = (this.state.currentServings || 2) + delta;
        if (next < 1 || next > 20) return;
        this.state.currentServings = next;
        this.render();
      }

      // ============ KOCHMODUS ============
      // Timer state:
      //   this.state.cookTimer = { recipeId, stepIndex, seconds, endTime, pausedRemaining }
      //     - endTime: absolute epoch ms when timer ends (running)
      //     - pausedRemaining: remaining seconds if paused (running -> null)
      // Cook state:
      //   this.state.cookMode = { recipeId, stepIndex, minimized }
      // Persisted in localStorage under 'cookStateV2'.

      _cookPersistKey = 'cookStateV2';

      _findRecipeById(id) {
        try {
          if (typeof allRecipes !== 'undefined') {
            const r = allRecipes.find(x => x.id === id);
            if (r) return r;
          }
        } catch(e) {}
        if (Array.isArray(this.state.favorites)) {
          const r = this.state.favorites.find(x => x.id === id);
          if (r) return r;
        }
        return null;
      }

      _writeCookPersist() {
        try {
          const cm = this.state.cookMode;
          if (!cm) { localStorage.removeItem(this._cookPersistKey); return; }
          const ct = this.state.cookTimer;
          const payload = {
            recipeId: cm.recipeId,
            stepIndex: cm.stepIndex,
            minimized: !!cm.minimized,
            timer: ct ? {
              recipeId: ct.recipeId,
              stepIndex: ct.stepIndex,
              seconds: ct.seconds,
              endTime: ct.endTime,
              pausedRemaining: ct.pausedRemaining
            } : null
          };
          localStorage.setItem(this._cookPersistKey, JSON.stringify(payload));
        } catch(e) {}
      }

      _readCookPersist() {
        try { return JSON.parse(localStorage.getItem(this._cookPersistKey) || 'null'); }
        catch { return null; }
      }

      restoreCookModeFromStorage() {
        const data = this._readCookPersist();
        if (!data || !data.recipeId) return;
        const recipe = this._findRecipeById(data.recipeId);
        if (!recipe) { localStorage.removeItem(this._cookPersistKey); return; }
        this.state.selectedRecipe = recipe;
        this.state.cookMode = {
          recipeId: recipe.id,
          stepIndex: Math.max(0, Math.min((recipe.steps || []).length - 1, data.stepIndex || 0)),
          minimized: !!data.minimized
        };
        if (data.timer) {
          const t = data.timer;
          // If timer already expired while away, fire ended state.
          if (t.pausedRemaining == null && typeof t.endTime === 'number' && t.endTime <= Date.now()) {
            this.state.cookTimer = null;
            this._writeCookPersist();
          } else {
            this.state.cookTimer = {
              recipeId: t.recipeId,
              stepIndex: t.stepIndex,
              seconds: t.seconds,
              endTime: t.endTime,
              pausedRemaining: t.pausedRemaining == null ? null : t.pausedRemaining
            };
          }
        }
        this._startTickLoop();
      }

      startCookMode() {
        if (!this.state.selectedRecipe) return;
        // A running timer must NEVER be reset by starting/entering cook mode.
        const rid = this.state.selectedRecipe.id;
        // Preserve existing timer only if it belongs to this recipe.
        if (this.state.cookTimer && this.state.cookTimer.recipeId !== rid) {
          this._clearCookTimer();
        }
        this.state.cookMode = { recipeId: rid, stepIndex: 0, minimized: false };
        this._writeCookPersist();
        this._startTickLoop();
        this.render();
      }

      exitCookMode() {
        // X-Button beendet Kochmodus vollständig inkl. Timer.
        this.state.cookMode = null;
        this._clearCookTimer();
        this._stopTickLoop();
        try { localStorage.removeItem(this._cookPersistKey); } catch(e){}
        this._dismissToast();
        this.render();
      }

      minimizeCookMode() {
        if (!this.state.cookMode) return;
        this.state.cookMode.minimized = true;
        this._writeCookPersist();
        this.render();
      }

      restoreCookMode() {
        if (!this.state.cookMode) return;
        this.state.cookMode.minimized = false;
        // Ensure selectedRecipe matches (in case user navigated).
        const recipe = this._findRecipeById(this.state.cookMode.recipeId);
        if (recipe) this.state.selectedRecipe = recipe;
        this._writeCookPersist();
        this.render();
      }

      cookNextStep() {
        if (!this.state.cookMode || !this.state.selectedRecipe) return;
        const steps = this.state.selectedRecipe.steps || [];
        if (this.state.cookMode.stepIndex < steps.length - 1) {
          this.state.cookMode.stepIndex++;
          this._writeCookPersist();
          this._updateCookStep('next');
        }
      }

      cookPrevStep() {
        if (!this.state.cookMode) return;
        if (this.state.cookMode.stepIndex > 0) {
          this.state.cookMode.stepIndex--;
          this._writeCookPersist();
          this._updateCookStep('prev');
        }
      }

      // Aktualisiert NUR die dynamischen Teile im Kochmodus-Overlay
      // (Progress-Balken, Body-Inhalt, Footer-Buttons, Header-Chip). Der
      // Overlay-Container, Header, Hintergrund und Event-Handler bleiben
      // unverändert – dadurch kein Flackern, keine Bild-Reloads.
      _updateCookStep(direction) {
        const root = document.getElementById('root');
        if (!root) return;
        const overlay = root.querySelector('.cook-overlay');
        const html = this.renderCookMode();
        if (!overlay || !html) {
          // Overlay fehlt (z. B. minimiert) → einmalig vollständig rendern.
          this.render();
          return;
        }
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        const fresh = tmp.querySelector('.cook-overlay');
        if (!fresh) { overlay.remove(); return; }

        // Progress-Bar aktualisieren
        const oldBar = overlay.querySelector('.cook-progress-bar');
        const newBar = fresh.querySelector('.cook-progress-bar');
        if (oldBar && newBar) oldBar.style.width = newBar.style.width;

        // Header-Chip (Timer eines anderen Schritts) synchronisieren
        const oldChipHost = overlay.querySelector('.cook-header-actions');
        const newChipHost = fresh.querySelector('.cook-header-actions');
        if (oldChipHost && newChipHost) {
          const oldChip = oldChipHost.querySelector('.cook-header-chip');
          const newChip = newChipHost.querySelector('.cook-header-chip');
          if (oldChip && !newChip) oldChip.remove();
          else if (!oldChip && newChip) oldChipHost.insertBefore(newChip, oldChipHost.firstChild);
          else if (oldChip && newChip) oldChip.replaceWith(newChip);
        }

        // Body: alten Step erst kurz ausblenden und ENTFERNEN, danach den neuen
        // Step einblenden. So sind niemals zwei Schritte gleichzeitig sichtbar
        // und es entsteht kein Flackern oder Weißblitzen.
        const body = overlay.querySelector('.cook-body');
        const freshStep = fresh.querySelector('.cook-step-anim');
        if (body && freshStep) {
          const oldStep = body.querySelector('.cook-step-anim');
          const enterCls = direction === 'prev' ? 'cook-step-enter-prev' : 'cook-step-enter-next';
          const swapIn = () => {
            // Sicherstellen, dass kein alter Step mehr im DOM ist
            body.querySelectorAll('.cook-step-anim').forEach(n => n.remove());
            freshStep.classList.add(enterCls);
            body.appendChild(freshStep);
            requestAnimationFrame(() => {
              freshStep.addEventListener('animationend', () => {
                freshStep.classList.remove(enterCls);
              }, { once: true });
            });
          };
          if (oldStep) {
            // Fade-out via opacity, dann Swap – garantiert keine Überlagerung
            oldStep.style.transition = 'opacity .12s ease';
            oldStep.style.opacity = '0';
            setTimeout(swapIn, 120);
          } else {
            swapIn();
          }
        }

        // Footer-Buttons (Zurück/Weiter/Fertig) aktualisieren
        const oldFooter = overlay.querySelector('.cook-footer');
        const newFooter = fresh.querySelector('.cook-footer');
        if (oldFooter && newFooter) oldFooter.innerHTML = newFooter.innerHTML;
      }

      // Alter Name für Kompatibilität mit bestehenden Aufrufern
      _updateCookOverlay() { this._updateCookStep('next'); }


      extractTimerFromStep(text) {
        if (!text) return null;
        const m = text.match(/(\d+)\s*(Stunden?|Std|Minuten?|Min|Sekunden?|Sek)\b/i);
        if (!m) return null;
        const n = parseInt(m[1], 10);
        const unit = m[2].toLowerCase();
        let seconds = n * 60;
        if (unit.startsWith('std') || unit.startsWith('stund')) seconds = n * 3600;
        else if (unit.startsWith('sek')) seconds = n;
        return { seconds, label: m[0] };
      }

      _clearCookTimer() {
        this.state.cookTimer = null;
        this._writeCookPersist();
      }

      _cookTimerRemainingMs() {
        const t = this.state.cookTimer;
        if (!t) return 0;
        if (t.pausedRemaining != null) return Math.max(0, t.pausedRemaining * 1000);
        return Math.max(0, t.endTime - Date.now());
      }

      _cookTimerIsRunning() {
        const t = this.state.cookTimer;
        return !!(t && t.pausedRemaining == null && t.endTime > Date.now());
      }

      _cookTimerExpired() {
        const t = this.state.cookTimer;
        return !!(t && t.pausedRemaining == null && t.endTime <= Date.now());
      }

      async _ensureNotificationPermission() {
        try {
          if (typeof Notification === 'undefined') return 'unsupported';
          if (Notification.permission === 'granted') return 'granted';
          if (Notification.permission === 'denied') return 'denied';
          if (this._notificationAsked) return Notification.permission;
          this._notificationAsked = true;
          const res = await Notification.requestPermission();
          return res;
        } catch(e) { return 'error'; }
      }

      startCookTimer(seconds) {
        if (!this.state.cookMode) return;
        // Only one active timer at a time – ersetze bestehenden.
        const rid = this.state.cookMode.recipeId;
        const step = this.state.cookMode.stepIndex;
        this.state.cookTimer = {
          recipeId: rid,
          stepIndex: step,
          seconds: seconds,
          endTime: Date.now() + seconds * 1000,
          pausedRemaining: null
        };
        this._writeCookPersist();
        this._startTickLoop();
        // Fire permission request on first user-initiated start.
        this._ensureNotificationPermission();
        this.render();
      }

      toggleCookTimer() {
        const t = this.state.cookTimer;
        if (!t) return;
        if (t.pausedRemaining == null) {
          // running -> pause
          const rem = Math.max(0, Math.ceil((t.endTime - Date.now()) / 1000));
          t.pausedRemaining = rem;
        } else {
          // paused -> resume
          t.endTime = Date.now() + t.pausedRemaining * 1000;
          t.pausedRemaining = null;
        }
        this._writeCookPersist();
        this.render();
      }

      resetCookTimer() {
        this._clearCookTimer();
        this._stopTickLoopIfIdle();
        this.render();
      }

      stopCookTimer() {
        this._clearCookTimer();
        this._stopTickLoopIfIdle();
      }

      formatCookTime(secs) {
        secs = Math.max(0, secs | 0);
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }

      _startTickLoop() {
        if (this._cookTickTimer) return;
        this._cookTickTimer = setInterval(() => this._cookTick(), 500);
      }

      _stopTickLoop() {
        if (this._cookTickTimer) {
          clearInterval(this._cookTickTimer);
          this._cookTickTimer = null;
        }
      }

      _stopTickLoopIfIdle() {
        if (!this.state.cookTimer && !this.state.cookMode) this._stopTickLoop();
      }

      _cookTick() {
        const t = this.state.cookTimer;
        if (!t) { this._stopTickLoopIfIdle(); return; }
        // Update UI displays without decrementing internal state.
        const remMs = this._cookTimerRemainingMs();
        const secs = Math.ceil(remMs / 1000);
        const txt = this.formatCookTime(secs);
        const displays = document.querySelectorAll('[data-cook-timer-display]');
        displays.forEach(el => { el.textContent = txt; });
        // Expiry check
        if (t.pausedRemaining == null && t.endTime <= Date.now()) {
          this._onCookTimerEnd();
        }
      }

      _onCookTimerEnd() {
        const t = this.state.cookTimer;
        if (!t) return;
        const recipe = this._findRecipeById(t.recipeId);
        const stepIdx = t.stepIndex;
        // Clear timer state (single active timer).
        this._clearCookTimer();
        // Vibration
        try { if (navigator.vibrate) navigator.vibrate([220, 120, 220, 120, 400]); } catch(e){}
        // Toast (modern in-app)
        this._showToast({
          title: '⏰ Timer abgelaufen!',
          sub: (recipe ? recipe.title : 'Rezept') + ' – Schritt ' + (stepIdx + 1),
          variant: 'alarm',
          duration: 8000
        });
        // System notification
        this._fireCookNotification(recipe, stepIdx);
        this.render();
      }

      _fireCookNotification(recipe, stepIdx) {
        try {
          if (typeof Notification === 'undefined') return;
          if (Notification.permission !== 'granted') return;
          const title = '⏰ Timer abgelaufen!';
          const body = (recipe ? recipe.title : 'Rezept') + ' – Schritt ' + (stepIdx + 1);
          // Prefer SW-based notification when installed as PWA (iOS PWA requirement)
          if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(reg => {
              try {
                reg.showNotification(title, {
                  body,
                  icon: '/favicon.ico',
                  badge: '/favicon.ico',
                  tag: 'cook-timer',
                  renotify: true,
                  vibrate: [220, 120, 220, 120, 400]
                });
              } catch(e) {
                try { new Notification(title, { body, icon: '/favicon.ico', tag: 'cook-timer' }); } catch(_) {}
              }
            }).catch(() => {
              try { new Notification(title, { body, icon: '/favicon.ico', tag: 'cook-timer' }); } catch(_) {}
            });
          } else {
            new Notification(title, { body, icon: '/favicon.ico', tag: 'cook-timer' });
          }
        } catch(e) {}
      }

      _showToast(opts) {
        this._dismissToast();
        this.state.cookToast = {
          title: opts.title || '',
          sub: opts.sub || '',
          variant: opts.variant || 'info',
          id: Date.now()
        };
        const dur = Math.max(1500, opts.duration || 4000);
        this._toastTimer = setTimeout(() => this._dismissToast(true), dur);
        this.render();
      }

      _dismissToast(rerender) {
        if (this._toastTimer) { clearTimeout(this._toastTimer); this._toastTimer = null; }
        if (this.state.cookToast) {
          this.state.cookToast = null;
          if (rerender) this.render();
        }
      }

      dismissCookToast() { this._dismissToast(true); }

      renderCookToast() {
        const tt = this.state.cookToast;
        if (!tt) return '';
        return `
          <div class="cook-toast ${tt.variant === 'alarm' ? 'alarm' : ''}" role="status" aria-live="polite">
            <div class="cook-toast-body">
              <div class="cook-toast-title">${escapeHtml(tt.title)}</div>
              ${tt.sub ? `<div class="cook-toast-sub">${escapeHtml(tt.sub)}</div>` : ''}
            </div>
            <button class="cook-toast-close" onclick="app.dismissCookToast()" aria-label="Schließen">×</button>
          </div>
        `;
      }

      renderCookMinibar() {
        const cm = this.state.cookMode;
        if (!cm || !cm.minimized) return '';
        const recipe = this._findRecipeById(cm.recipeId);
        if (!recipe) return '';
        const steps = recipe.steps || [];
        const t = this.state.cookTimer;
        const running = this._cookTimerIsRunning();
        const rem = t ? this.formatCookTime(Math.ceil(this._cookTimerRemainingMs() / 1000)) : '';
        return `
          <div class="cook-minibar" onclick="app.restoreCookMode()" role="button" aria-label="Kochmodus öffnen">
            <div class="cook-minibar-icon">👨‍🍳</div>
            <div class="cook-minibar-body">
              <div class="cook-minibar-title">${escapeHtml(recipe.title)}</div>
              <div class="cook-minibar-meta">
                <span>Schritt ${cm.stepIndex + 1} von ${steps.length}</span>
                ${t ? `<span class="cook-minibar-timer ${running ? 'running' : ''}" data-cook-timer-display>${rem}</span>` : ''}
              </div>
            </div>
            <button class="cook-minibar-close" onclick="event.stopPropagation(); app.exitCookMode()" aria-label="Kochmodus beenden">×</button>
          </div>
        `;
      }

      renderCookMode() {
        const cm = this.state.cookMode;
        if (!cm) return '';
        if (cm.minimized) return '';
        const r = this._findRecipeById(cm.recipeId) || this.state.selectedRecipe;
        if (!r) return '';
        const steps = r.steps || [];
        const idx = cm.stepIndex;
        const step = steps[idx] || '';
        const timerInfo = this.extractTimerFromStep(step);
        const t = this.state.cookTimer;
        const progress = ((idx + 1) / Math.max(1, steps.length)) * 100;
        const running = this._cookTimerIsRunning();
        const paused = !!(t && t.pausedRemaining != null);
        const timerBelongsToThisStep = !!(t && t.recipeId === r.id && t.stepIndex === idx);
        const remSecs = t ? Math.ceil(this._cookTimerRemainingMs() / 1000) : 0;

        // Timer box – full – only on step where timer was started.
        let timerHtml = '';
        if (timerBelongsToThisStep && t) {
          timerHtml = `
            <div class="cook-timer-box ${running ? 'running' : ''}">
              <span data-cook-timer-display class="cook-timer-display">${this.formatCookTime(remSecs)}</span>
              <div class="cook-timer-actions">
                <button class="cook-timer-btn ${running ? 'running' : ''}" onclick="app.toggleCookTimer()">${paused ? 'Weiter' : 'Pause'}</button>
                <button class="cook-timer-btn reset" onclick="app.resetCookTimer()">Reset</button>
              </div>
            </div>`;
        } else if (timerInfo && !t) {
          timerHtml = `
            <div class="cook-timer-box">
              <span class="cook-timer-display">${escapeHtml(timerInfo.label)}</span>
              <div class="cook-timer-actions">
                <button class="cook-timer-btn" onclick="app.startCookTimer(${timerInfo.seconds})">Timer starten</button>
              </div>
            </div>`;
        }

        // Header compact chip when a timer runs on a DIFFERENT step of the SAME recipe.
        let headerChipHtml = '';
        if (t && t.recipeId === r.id && !timerBelongsToThisStep) {
          const chipCls = paused ? 'paused' : 'pulsing';
          headerChipHtml = `
            <button class="cook-header-chip ${chipCls}" onclick="app.jumpToTimerStep()" title="Zum Timer-Schritt springen">
              ⏱ <span data-cook-timer-display>${this.formatCookTime(remSecs)}</span>
            </button>`;
        }

        return `
          <div class="cook-overlay"
               ontouchstart="app._cookTouchX=event.touches[0].clientX"
               ontouchend="app._handleCookSwipe(event)">
            <div class="cook-header">
              <div class="cook-title-wrap">
                <span class="cook-title">Kochmodus</span>
                <span class="cook-title-recipe">${escapeHtml(r.title)}</span>
              </div>
              <div class="cook-header-actions">
                ${headerChipHtml}
                <button class="cook-icon-btn cook-minimize-btn" onclick="app.minimizeCookMode()" aria-label="Minimieren" title="Minimieren">−</button>
                <button class="cook-icon-btn" onclick="app.exitCookMode()" aria-label="Beenden" title="Beenden">×</button>
              </div>
            </div>
            <div class="cook-progress"><div class="cook-progress-bar" style="width:${progress}%"></div></div>
            <div class="cook-body">
              <div class="cook-step-anim" key="s${idx}">
                <div class="cook-step-num">Schritt ${idx + 1} von ${steps.length}</div>
                <div class="cook-step-text">${escapeHtml(step)}</div>
                ${timerHtml}
                ${(() => {
                  const ing = this.getRecipeIngredients(r);
                  if (!ing.length) return '';
                  const base = this.getRecipeBaseServings(r);
                  const factor = (this.state.currentServings || base) / base;
                  // Nur Zutaten anzeigen, die im aktuellen Schritt erwähnt werden.
                  const stepLc = String(step || '').toLowerCase();
                  const matched = ing.filter(it => {
                    const name = String(it.name || '').toLowerCase().trim();
                    if (!name) return false;
                    const tokens = name.split(/[\s,()\/\-]+/).filter(t => t.length >= 3);
                    return tokens.some(t => stepLc.includes(t));
                  });
                  if (!matched.length) return '';
                  return `
                    <div class="cook-ingredients">
                      <div class="cook-ingredients-title">Zutaten für diesen Schritt</div>
                      <ul class="cook-ingredients-list">
                        ${matched.map(it => {
                          const q = this.scaleQuantity(it.quantity || '', factor);
                          return `<li><span>${escapeHtml(it.name)}</span><span class="qty">${escapeHtml(q || 'n. B.')}</span></li>`;
                        }).join('')}
                      </ul>
                    </div>
                  `;
                })()}
              </div>
            </div>
            <div class="cook-footer">
              <button class="cook-nav-btn cook-nav-prev" onclick="app.cookPrevStep()" ${idx === 0 ? 'disabled' : ''}>← Zurück</button>
              <button class="cook-nav-btn cook-nav-next" onclick="app.${idx === steps.length - 1 ? 'exitCookMode' : 'cookNextStep'}()">${idx === steps.length - 1 ? 'Fertig ✓' : 'Weiter →'}</button>
            </div>
          </div>
        `;
      }

      jumpToTimerStep() {
        const t = this.state.cookTimer;
        if (!t || !this.state.cookMode) return;
        this.state.cookMode.stepIndex = t.stepIndex;
        this._writeCookPersist();
        this._updateCookOverlay();
      }

      _handleCookSwipe(event) {
        if (this._cookTouchX == null) return;
        const endX = (event.changedTouches && event.changedTouches[0].clientX) || 0;
        const dx = endX - this._cookTouchX;
        this._cookTouchX = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0) this.cookNextStep(); else this.cookPrevStep();
      }



      getCuisineLabel(category) {
        const map = {
          Vegetarisch: 'Vegetarisch',
          Asiatisch: 'Asiatisch',
          Mexikanisch: 'Mexikanisch',
          Italienisch: 'Italienisch',
          Other: 'Andere'
        };
        return map[category] || category || 'Andere';
      }

      getRecipeCuisine(recipe) {
        return recipe.cuisine || recipe.category || 'Andere';
      }

      getRecipeDietLabel(recipe) {
        return recipe.diet === 'vegan' ? 'Vegan' : recipe.diet === 'vegetarian' ? 'Vegetarisch' : null;
      }

      parseQuantity(raw) {
        const value = String(raw || '').trim();
        const match = value.match(/^([0-9]+(?:[.,][0-9]+)?)(?:\s*)([a-zA-Zµ°/]+)?$/);
        if (!match) return { amount: null, unit: '', raw: value };
        return { amount: parseFloat(match[1].replace(',', '.')), unit: (match[2] || '').trim(), raw: value };
      }

      mergeQuantities(existingRaw, incomingRaw) {
        const existing = this.parseQuantity(existingRaw);
        const incoming = this.parseQuantity(incomingRaw);
        if (existing.amount !== null && incoming.amount !== null && existing.unit && incoming.unit && existing.unit === incoming.unit) {
          return `${(existing.amount + incoming.amount).toFixed(existing.amount % 1 === 0 && incoming.amount % 1 === 0 ? 0 : 2).replace(/\.0$/, '')} ${existing.unit}`.trim();
        }
        const parts = [existingRaw, incomingRaw].filter(Boolean);
        return parts.length > 0 ? parts.join(' + ') : '';
      }

      getIngredientCategory(name) {
        const value = String(name || '').toLowerCase();
        if (/(hack|fleisch|hähnchen|chicken|bacon|wurst|fish|salmon|shrimp|rinder|schinken|speck)/.test(value)) return 'Fleisch';
        if (/(zitrone|limette|orange|apfel|banane|beere|birne|kiwi|mango|ananas|mandarine|grapefruit|pflaume|erdbeere)/.test(value)) return 'Obst';
        if (/(zwiebel|knoblauch|tomate|tomaten|paprika|gurke|karotte|kartoffel|salat|gemüse|sellerie|brokkoli|pilz|spinat|aubergine|curry|basilikum)/.test(value)) return 'Gemüse';
        if (/(käse|mozzarella|parmesan|sahne|butter|milch|joghurt|creme)/.test(value)) return 'Milcherzeugnisse';
        if (/(nudeln|reis|mehl|sauce|soße|paste|brühe|öl|salz|pfeffer|gewürz|zucker|honig|ketchup|teig)/.test(value)) return 'Öle & Gewürze';
        if (/(brot|teig|mehl|backpulver|zucker|vanille)/.test(value)) return 'Teig & Backzutaten';
        if (/(reis|nudeln|kartoffeln|brot|rice|pasta|beilage|sides)/.test(value)) return 'Getreide & Beilagen';
        if (/(wasser|saft|wein|bier|kaffee|tee|milch|smoothie)/.test(value)) return 'Getränke';
        if (/(gefroren|frozen|eis|tiefkühl)/.test(value)) return 'Tiefkühlprodukte';
        return 'Sonstiges';
      }

      // ===== FAVORITEN-SAMMLUNGEN =====
      saveFavCollections() { try { AppStorage.setItem('fav_collections', JSON.stringify(this.state.favCollections)); } catch (e) {} }
      createCollection() {
        const name = (prompt('Name der neuen Sammlung:') || '').trim();
        if (!name) return;
        const icon = (prompt('Emoji für die Sammlung (optional):', '⭐') || '⭐').trim() || '⭐';
        const id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        this.state.favCollections.push({ id: id, name: name, icon: icon, recipeIds: [] });
        this.saveFavCollections();
        this.render();
      }
      editCollection(id) {
        const c = this.state.favCollections.find(x => x.id === id);
        if (!c) return;
        const action = prompt('Sammlung "' + c.name + '":\nGib einen neuen Namen ein zum Umbenennen, oder gib "löschen" ein zum Entfernen.', c.name);
        if (action === null) return;
        const trimmed = action.trim();
        if (trimmed.toLowerCase() === 'löschen' || trimmed.toLowerCase() === 'loeschen' || trimmed.toLowerCase() === 'delete') {
          if (!confirm('Sammlung "' + c.name + '" wirklich löschen?')) return;
          this.state.favCollections = this.state.favCollections.filter(x => x.id !== id);
          if (this.state.favCollectionFilter === id) this.state.favCollectionFilter = null;
        } else if (trimmed) {
          c.name = trimmed;
          const newIcon = (prompt('Emoji für die Sammlung:', c.icon || '⭐') || c.icon || '⭐').trim() || '⭐';
          c.icon = newIcon;
        }
        this.saveFavCollections();
        this.render();
      }
      setFavCollectionFilter(id) { this.state.favCollectionFilter = id; this.render(); }
      openCollectionAssign(recipeId) {
        if (!this.isFavorite(recipeId)) {
          const r = allRecipes.find(x => x.id === recipeId);
          if (r) this.addToFavorites(r);
        }
        this.state.favAssignRecipeId = recipeId;
        this.render();
      }
      closeCollectionAssign() { this.state.favAssignRecipeId = null; this.render(); }
      toggleRecipeInCollection(collectionId, recipeId) {
        const c = this.state.favCollections.find(x => x.id === collectionId);
        if (!c) return;
        const idx = c.recipeIds.indexOf(recipeId);
        if (idx >= 0) c.recipeIds.splice(idx, 1); else c.recipeIds.push(recipeId);
        this.saveFavCollections();
        this.render();
      }

      addToShoppingList(recipe) {
        const ingredients = this.getRecipeIngredients(recipe);
        const base = this.getRecipeBaseServings(recipe);
        const factor = (this.state.currentServings || base) / base;
        ingredients.forEach(item => {
          const qty = this.scaleQuantity(item.quantity || '', factor);
          this.addIngredientToShoppingList(item.name, qty, true);
        });
        AppStorage.setItem('shop', JSON.stringify(this.state.shoppingList));
        this._flashToast('🛒 Zur Einkaufsliste hinzugefügt');
      }

      // Lightweight DOM-only toast: kein this.render(), damit sich offene
      // Modals (z. B. Rezeptdetails) nicht neu aufbauen.
      _flashToast(msg) {
        try {
          let el = document.getElementById('quick-toast');
          if (!el) {
            el = document.createElement('div');
            el.id = 'quick-toast';
            el.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:10050;padding:12px 18px;border-radius:14px;background:rgba(20,20,24,.94);color:#fff;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .18s ease, transform .18s ease;pointer-events:none;max-width:80vw;text-align:center;';
            document.body.appendChild(el);
          }
          el.textContent = msg;
          requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translate(-50%,0)'; });
          if (this._quickToastTimer) clearTimeout(this._quickToastTimer);
          this._quickToastTimer = setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translate(-50%,10px)';
          }, 1800);
        } catch (e) {}
      }

      addIngredientToShoppingList(name, quantity = '', silent = false) {
        const cleanName = String(name || '').trim();
        if (!cleanName) return;
        const existing = this.state.shoppingList.find(i => i.name.toLowerCase() === cleanName.toLowerCase());
        if (existing) {
          existing.quantity = this.mergeQuantities(existing.quantity, quantity || '');
          existing.category = existing.category || this.getIngredientCategory(cleanName);
        } else {
          this.state.shoppingList.push({ name: cleanName, quantity: quantity || '', done: false, category: this.getIngredientCategory(cleanName) });
        }
        AppStorage.setItem('shop', JSON.stringify(this.state.shoppingList));
        if (silent) return;
        // Kein Full-Render: nur Toast, ausser die Einkaufsliste ist gerade sichtbar.
        if (this.state.activeTab === 'shopping' || this.state.profileSubpage === 'shopping') {
          this.render();
        } else {
          this._flashToast('🛒 ' + cleanName + ' hinzugefügt');
        }
      }


      toggleShoppingItem(idx) { this.state.shoppingList[idx].done = !this.state.shoppingList[idx].done; AppStorage.setItem('shop', JSON.stringify(this.state.shoppingList)); this.render(); }
      removeShoppingItem(idx) { this.state.shoppingList.splice(idx, 1); AppStorage.setItem('shop', JSON.stringify(this.state.shoppingList)); this.render(); }

      addToHistory(query) {
        if (!query || query.trim() === '') return;
        let hist = this.state.searchHistory.filter(h => h.toLowerCase() !== query.toLowerCase());
        hist.unshift(query);
        hist = hist.slice(0, 3);
        this.state.searchHistory = hist;
        AppStorage.setItem('search_hist', JSON.stringify(hist));
      }

      removeFromHistory(e, query) {
        e.stopPropagation();
        this.state.searchHistory = this.state.searchHistory.filter(h => h !== query);
        AppStorage.setItem('search_hist', JSON.stringify(this.state.searchHistory));
        this.render();
      }

      useHistoryQuery(query) {
        this.state.searchQuery = query;
        this.state.selectedCategories = [];
        this.render();
        const input = document.querySelector('.search-input');
        if (input) input.value = query;
      }

      getTimeValue(timeText) {
        const match = String(timeText || '').match(/(\d+)/);
        return match ? parseInt(match[1], 10) : Infinity;
      }

      matchesTimeFilter(recipe) {
        const filter = this.state.selectedFilters.time;
        if (!filter) return true;
        const minutes = this.getTimeValue(recipe.time);
        if (filter === 'under-20') return minutes < 20;
        if (filter === '20-40') return minutes >= 20 && minutes <= 40;
        if (filter === '40-plus') return minutes > 40;
        return true;
      }

      getCaloriesValue(caloriesText) {
        const match = String(caloriesText || '').match(/(\d+)/);
        return match ? parseInt(match[1], 10) : Infinity;
      }

      matchesCaloriesFilter(recipe) {
        const filter = this.state.selectedFilters.calories;
        if (!filter) return true;
        const calories = this.getCaloriesValue(recipe.calories);
        if (filter === '0-200') return calories <= 200;
        if (filter === '200-400') return calories > 200 && calories <= 400;
        if (filter === '400-600') return calories > 400 && calories <= 600;
        if (filter === '600-800') return calories > 600 && calories <= 800;
        if (filter === '800-plus') return calories > 800;
        return true;
      }

      matchesDifficultyFilter(recipe) {
        const filter = this.state.selectedFilters.difficulty;
        if (!filter) return true;
        const difficulty = String(recipe.difficulty || '').toLowerCase();
        if (filter === 'easy') return difficulty === 'leicht';
        if (filter === 'medium') return difficulty === 'medium';
        if (filter === 'hard') return difficulty === 'schwer';
        return true;
      }

      matchesDietFilter(recipe) {
        const filter = this.state.selectedFilters.diet;
        if (!filter) return true;
        if (filter === 'vegan') return recipe.diet === 'vegan';
        if (filter === 'vegetarian') return recipe.diet === 'vegetarian';
        if (filter === 'non-vegetarian') return recipe.diet === 'non-vegetarian';
        return true;
      }

      matchesSpiceFilter(recipe) {
        const filter = this.state.selectedFilters.spice;
        if (!filter) return true;
        return (recipe.spice || 'mild') === filter;
      }

      matchesCuisineFilter(recipe) {
        const filter = this.state.selectedFilters.cuisine;
        if (!filter) return true;
        return this.getRecipeCuisine(recipe) === filter;
      }

      getAllCuisines() {
        const set = new Set(allRecipes.map(r => this.getRecipeCuisine(r)).filter(Boolean));
        return Array.from(set).sort((a,b) => a.localeCompare(b, 'de'));
      }

      // Unsichtbare Zuordnung: Zutat/Küche → Überkategorien + Alias-Wörter
      getIngredientCategoryTerms(name) {
        const n = this.normalizeText(name);
        const terms = new Set();
        for (const [cat, aliases] of Object.entries(INGREDIENT_CATEGORIES)) {
          for (const a of aliases) {
            const na = this.normalizeText(a);
            if (!na) continue;
            if (n.includes(na) || na.includes(n)) {
              terms.add(this.normalizeText(cat));
              aliases.forEach(x => terms.add(this.normalizeText(x)));
              break;
            }
          }
        }
        return Array.from(terms);
      }
      getCuisineCategoryTerms(cuisine) {
        const n = this.normalizeText(cuisine);
        const terms = new Set();
        for (const [cat, aliases] of Object.entries(CUISINE_CATEGORIES)) {
          if (this.normalizeText(cat) === n || aliases.map(x => this.normalizeText(x)).includes(n)) {
            terms.add(this.normalizeText(cat));
            aliases.forEach(x => terms.add(this.normalizeText(x)));
          }
        }
        return Array.from(terms);
      }
      getRecipeTagTerms(recipe) {
        const terms = new Set();
        const add = v => { const n = this.normalizeText(v); if (n) n.split(' ').filter(Boolean).forEach(x => terms.add(x)); };
        // Explizite Tags (falls im Rezept hinterlegt)
        const rawTags = [].concat(recipe.tags || [], recipe.labels || []);
        rawTags.forEach(add);
        // Ernährungsform
        if (recipe.diet === 'vegan') { add('vegan'); add('pflanzlich'); }
        else if (recipe.diet === 'vegetarian') { add('vegetarisch'); add('veggie'); }
        else { add('fleisch'); }
        // Schwierigkeit / Zeit / Kalorien
        add(recipe.difficulty);
        add(recipe.time);
        add(recipe.calories);
        const mins = parseInt(recipe.time, 10);
        if (!isNaN(mins) && mins <= 20) { add('schnell'); add('quick'); }
        if (recipe.isInfluencer) { add('viral'); add('influencer'); add('trend'); }
        // High Protein Heuristik (eiweißreiche Hauptzutaten)
        const proteinWords = ['hahnchen', 'huhn', 'chicken', 'pute', 'rind', 'steak', 'hackfleisch', 'lachs',
          'thunfisch', 'garnelen', 'fisch', 'tofu', 'linsen', 'kichererbsen', 'bohnen', 'quark', 'skyr',
          'huttenkase', 'ei', 'eier', 'protein'];
        const ingText = this.getRecipeIngredients(recipe).map(i => this.normalizeText(i.name)).join(' ');
        if (proteinWords.some(w => ingText.includes(w))) { add('high protein'); add('highprotein'); add('proteinreich'); add('eiweiss'); }
        return Array.from(terms);
      }
      matchesSearch(recipe, query) {
        const nq = this.normalizeText(query);
        if (!nq) return true;
        const tokens = nq.split(' ').filter(Boolean);
        const titleText = this.normalizeText(recipe.title);
        const ingredientNames = this.getRecipeIngredients(recipe).map(i => this.normalizeText(i.name));
        const cuisineText = this.normalizeText(this.getRecipeCuisine(recipe));
        const categoryText = this.normalizeText(recipe.category);
        const tagTerms = this.getRecipeTagTerms(recipe);
        // Erweitere um unsichtbare Kategorie-Terme aller Zutaten und der Küche
        const catTerms = new Set();
        this.getRecipeIngredients(recipe).forEach(i => {
          this.getIngredientCategoryTerms(i.name).forEach(t => catTerms.add(t));
        });
        this.getCuisineCategoryTerms(this.getRecipeCuisine(recipe)).forEach(t => catTerms.add(t));
        const fullText = [titleText, cuisineText, categoryText, ...ingredientNames, ...catTerms].join(' ');
        const words = fullText.split(' ').filter(Boolean);
        // Jeder Suchbegriff muss im Namen, in Zutaten, Kategorien oder Tags enthalten sein.
        const strictTags = ['vegan', 'vegetarisch', 'veggie', 'pflanzlich', 'fleisch'];
        return tokens.every(tok => {
          if (strictTags.indexOf(tok) !== -1) return tagTerms.indexOf(tok) !== -1;
          if (titleText.includes(tok)) return true;
          if (ingredientNames.some(n => n.includes(tok))) return true;
          if (cuisineText.includes(tok) || categoryText.includes(tok)) return true;
          for (const t of catTerms) { if (t.includes(tok)) return true; }
          for (const t of tagTerms) { if (t.includes(tok)) return true; }
          return this.fuzzyTokenMatch(tok, words);
        });
      }


      getFilteredRecipes() {

        recipes = recipes.filter(r => this.matchesTimeFilter(r));
        recipes = recipes.filter(r => this.matchesCaloriesFilter(r));
        recipes = recipes.filter(r => this.matchesDifficultyFilter(r));
        recipes = recipes.filter(r => this.matchesDietFilter(r));
        recipes = recipes.filter(r => this.matchesCuisineFilter(r));
        recipes = recipes.filter(r => this.matchesSpiceFilter(r));
        return recipes;

      _parseQtyForPlan(qty) {
        if (!qty) return null;
        const m = String(qty).match(/([\d.,]+)\s*(.*)$/);
        if (!m) return null;
        const val = parseFloat(m[1].replace(',', '.'));
        if (isNaN(val)) return null;
        return { value: val, unit: (m[2] || '').trim() };
      }
      buildShoppingListFromWeekPlan() {
        const recipeIds = [];
        Object.values(this.state.weekPlan).forEach(d => Object.values(d).forEach(id => id && recipeIds.push(id)));
        if (recipeIds.length === 0) { alert('Der Wochenplan ist noch leer.'); return; }
        const combined = {};
        recipeIds.forEach(id => {
          const r = this.getRecipeById(id);
          if (!r) return;
          this.getRecipeIngredients(r).forEach(ing => {
            const key = (ing.name || '').toLowerCase().trim();
            if (!key) return;
            if (!combined[key]) combined[key] = { name: ing.name, units: {}, freeText: [] };
            const parsed = this._parseQtyForPlan(ing.quantity);
            if (parsed) {
              const u = parsed.unit || '';
              combined[key].units[u] = (combined[key].units[u] || 0) + parsed.value;
            } else if (ing.quantity) {
              combined[key].freeText.push(ing.quantity);
            }
          });
        });
        Object.values(combined).forEach(entry => {
          const parts = [];
          Object.entries(entry.units).forEach(([unit, sum]) => {
            const rounded = Math.abs(sum - Math.round(sum)) < 0.05 ? String(Math.round(sum)) : sum.toFixed(1).replace('.', ',');
            parts.push(unit ? `${rounded} ${unit}` : rounded);
          });
          entry.freeText.forEach(t => parts.push(t));
          this.addIngredientToShoppingList(entry.name, parts.join(' + '), true);
        });
        AppStorage.setItem('shop', JSON.stringify(this.state.shoppingList));
        alert('🛒 Einkaufsliste aus dem Wochenplan wurde erstellt/ergänzt.');
        this.render();
      }

      _persistWeekPlanBuckets() {
        try { AppStorage.setItem('week_plan_extra', JSON.stringify(this.state.weekPlanExtra || {})); } catch(e){}
      }
      setWeekPlanWeek(idx) {
        idx = Math.max(0, Math.min(2, parseInt(idx, 10) || 0));
        if (idx === this.state.weekPlanCurrentWeek) return;
        if (idx > 0 && !this.state.premiumUnlocked) {
          this.showPremiumPopup();
          return;
        }
        // Aktuellen weekPlan in Bucket sichern
        const cur = this.state.weekPlanCurrentWeek || 0;
        if (!this.state.weekPlanExtra) this.state.weekPlanExtra = {};
        this.state.weekPlanExtra[String(cur)] = JSON.parse(JSON.stringify(this.state.weekPlan || {}));
        // Ziel-Bucket laden
        const next = this.state.weekPlanExtra[String(idx)] || {};
        this.state.weekPlan = JSON.parse(JSON.stringify(next));
        this.state.weekPlanCurrentWeek = idx;
        try { AppStorage.setItem('week_plan', JSON.stringify(this.state.weekPlan)); } catch(e){}
        this._persistWeekPlanBuckets();
        this.render();
      }

      // Determine which INGREDIENT_CATEGORIES keys an ingredient belongs to.
      // Word-boundary based to avoid false positives like "ei" inside "weisse".
      getIngredientCategoryKeys(name) {
        const nName = this.normalizeText(name);
        if (!nName) return [];
        const words = nName.split(' ').filter(Boolean);
        const keys = new Set();
        for (const [cat, aliases] of Object.entries(INGREDIENT_CATEGORIES)) {
          for (const a of aliases) {
            const na = this.normalizeText(a);
            if (!na) continue;
            const aWords = na.split(' ').filter(Boolean);
            const matches =
              nName === na ||
              (aWords.length === 1 && words.includes(na)) ||
              (aWords.length > 1 && aWords.every(w => words.includes(w)));
            if (matches) { keys.add(this.normalizeText(cat)); break; }
          }
        }
        return Array.from(keys);
      }
      // Match a shopping-list / recipe ingredient name against a list of pantry/leftover needles.
      // Rules:
      //   1) direct fuzzy match between needle and ingredient (typos / umlauts / plurals)
      //   2) category expansion only when the needle IS a category key (e.g. "Nudeln",
      //      "Reis", "Mehl", "Eier", "Gemüse") — then every alias in that category matches,
      //      mirroring the search bar behavior via INGREDIENT_CATEGORIES.
      ingredientContainsAny(ingredientName, needles) {
        if (!needles || needles.length === 0) return false;
        const nName = this.normalizeText(ingredientName);
        if (!nName) return false;
        const ingredientWords = nName.split(' ').filter(Boolean);
        const ingredientCats = this.getIngredientCategoryKeys(ingredientName);
        return needles.some(n => {
          const nn = this.normalizeText(n);
          if (!nn) return false;
          const needleWords = nn.split(' ').filter(Boolean);
          // 1) Direct match / word containment / fuzzy typo tolerance
          if (nName === nn) return true;
          if (needleWords.length && needleWords.every(w => ingredientWords.includes(w))) return true;
          if (ingredientWords.length && ingredientWords.every(w => needleWords.includes(w))) return true;
          if (this.fuzzyTokenMatch(nn, ingredientWords)) return true;
          // 2) Category expansion: needle refers to a whole category key.
          //    Accept exact match or fuzzy match against any category key that the
          //    ingredient itself belongs to.
          if (ingredientCats.some(catKey => catKey === nn)) return true;
          if (ingredientCats.length) {
            for (const catKey of ingredientCats) {
              const catWords = catKey.split(' ').filter(Boolean);
              if (this.fuzzyTokenMatch(catKey, needleWords)) return true;
              if (catWords.every(w => needleWords.includes(w))) return true;
            }
          }
          return false;
        });
      }
      // Strikte Vorrats-Zuordnung: eine Zutat gilt NUR dann als vorrätig,
      // wenn ihr Name exakt (nach Normalisierung: Kleinschreibung + Umlaute)
      // im Vorratsschrank aktiviert wurde. Keine Kategorie-Erweiterung,
      // keine Fuzzy-/Substring-Verallgemeinerung, keine Synonyme.
      isPantryIngredient(name) {
        const p = this.state.pantry || { items: [], custom: [] };
        const needles = [...(p.items || []), ...(p.custom || [])];
        if (needles.length === 0) return false;
        const target = this.normalizeText(name);
        if (!target) return false;
        return needles.some(n => this.normalizeText(n) === target);
      }

      getLeftoverNeedles() {
        const custom = (this.state.leftoverCustomText || '')
          .split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
        return [...this.state.leftoverSelected, ...custom];
      }
      computeLeftoverMatches() {
        const needles = this.getLeftoverNeedles();
        if (needles.length < 1) return [];
        const results = allRecipes.map(r => {
          const ings = this.getRecipeIngredients(r);
          let have = 0;
          const missing = [];
          ings.forEach(ing => {
            // "Vorhanden" = entweder vom Nutzer ausgewählte Zutat (mit
            // Kategorie-Erweiterung/Fuzzy für „Nudeln"→Spaghetti etc.)
            // ODER strikt im Vorratsschrank aktiviert.
            const inSelection = this.ingredientContainsAny(ing.name, needles);
            const inPantry = this.isPantryIngredient(ing.name);
            if (inSelection || inPantry) have++;
            else missing.push(ing.name);
          });
          const haveUser = ings.filter(ing => this.ingredientContainsAny(ing.name, needles)).length;
          return { recipe: r, have, total: ings.length, missing, haveUser };
        });
        return results
          .filter(x => x.haveUser > 0)
          .sort((a, b) => (b.have / b.total) - (a.have / a.total) || b.have - a.have || a.total - b.total);
      }
      renderLeftoverSheet() {
        const selected = this.state.leftoverSelected;
        const chipsHtml = LEFTOVER_CHIPS.map(name => `
          <span class="swipe-chip ${selected.includes(name) ? 'active' : ''}" onclick="app.toggleLeftoverChip('${escapeHtml(name)}')">${escapeHtml(name)}</span>
        `).join('');
        const needles = this.getLeftoverNeedles();
        const canSearch = needles.length >= 2;
        let resultsHtml = '';
        if (this.state.leftoverResultsShown) {
          if (needles.length < 2) {
            resultsHtml = `<p style="color:var(--text-muted); font-size:12px; margin-top:12px;">Bitte wähle mindestens 2 Zutaten.</p>`;
          } else {
            const matches = this.computeLeftoverMatches().slice(0, 30);
            if (matches.length === 0) {
              resultsHtml = `<p style="color:var(--text-muted); font-size:12px; margin-top:12px;">Keine Rezepte gefunden, die zu deiner Auswahl passen.</p>`;
            } else {
              resultsHtml = `
                <div style="margin-top:14px;">
                  <div class="filter-section-title">Passende Rezepte (${matches.length})</div>
                  <div class="grid-3-columns">
                    ${matches.map(m => {
                      const r = m.recipe;
                      return `
                        <div class="grid-item-text-only" onclick="app.closeLeftoverMode(); app.openRecipe('${r.id}')">
                          <h3 class="grid-item-title">${escapeHtml(r.title)}</h3>
                          <span class="grid-item-meta" style="display:block; margin-top:4px;">${m.have} von ${m.total} Zutaten vorhanden</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }
          }
        }
        return `
          <div class="history-sheet-overlay" onclick="app.closeLeftoverMode()">
            <div class="history-sheet" onclick="event.stopPropagation()" style="max-height:90vh; overflow-y:auto;">
              <div class="history-sheet-header">

              </div>
              <p style="color:var(--text-muted); font-size:12px; margin-bottom:10px;">
                Was hast du noch da? Wähle 2–5 Zutaten – wir zeigen dir Rezepte, die möglichst viele davon nutzen. Vorratsschrank wird automatisch mitgezählt.
              </p>
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;">
                ${chipsHtml}
              </div>
              <div class="filter-section-title">Eigene Zutaten</div>
              <input id="leftoverCustomInput" type="text" class="search-input" style="margin:0;" placeholder="z.B. Feta, Rucola, Auberginen" value="${escapeHtml(this.state.leftoverCustomText || '')}" oninput="app.state.leftoverCustomText = this.value" onkeydown="app.handleLeftoverCustomKey(event)">
              <div class="filter-actions" style="margin-top:10px;">
                <button class="btn-clear-filters" onclick="app.resetLeftoverSearch()">Zurücksetzen</button>
                <button class="btn-apply-filters" onclick="app.runLeftoverSearch()" ${canSearch ? '' : 'disabled style="opacity:0.5;"'}>Rezepte finden</button>
              </div>
              ${resultsHtml}
            </div>

        `;
      }

      toggleFavFilterOption(cat, value) {
        const list = this.state.favFilters[cat] || [];
        const i = list.indexOf(value);
        if (i === -1) list.push(value); else list.splice(i, 1);
        this.state.favFilters[cat] = list;

      clearFavFilters() {
        this.state.favFilters = { diet: [], calories: [], time: [], difficulty: [], cuisine: [], spice: [], category: [] };
        AppStorage.setItem('fav_filters', JSON.stringify(this.state.favFilters));

      setFavSort(value) {
        this.state.favSort = value || 'added';
        AppStorage.setItem('fav_sort', this.state.favSort);
        this.render();
      }
      getFavCategories() {
        const set = new Set();
        (this.state.favorites || []).forEach(r => { if (r.category) set.add(r.category); });
        return Array.from(set).sort((a, b) => a.localeCompare(b, 'de'));
      }
      sortFavorites(list) {
        const sort = this.state.favSort || 'added';
        const arr = list.slice();
        if (sort === 'az') arr.sort((a, b) => String(a.title).localeCompare(String(b.title), 'de'));
        else if (sort === 'time') arr.sort((a, b) => this.getTimeValue(a.time) - this.getTimeValue(b.time));
        else if (sort === 'calories') arr.sort((a, b) => this.getCaloriesValue(a.calories) - this.getCaloriesValue(b.calories));
        // 'added' = Reihenfolge des Hinzufügens (Standard, neueste zuletzt hinzugefügt oben)
        else arr.reverse();
        return arr;
      }
      matchesFavFilters(recipe) {
        const f = this.state.favFilters;
        if (f.diet && f.diet.length && !f.diet.includes(recipe.diet)) return false;
        if (f.category && f.category.length && !f.category.includes(recipe.category)) return false;
        if (f.calories && f.calories.length) {
          const kcal = this.getCaloriesValue(recipe.calories);
          const ok = f.calories.some(v => v === 'under-500' ? kcal < 500 : kcal >= 500);
          if (!ok) return false;
        }
        if (f.time && f.time.length) {
          const mins = this.getTimeValue(recipe.time);
          const ok = f.time.some(v => v === 'under-30' ? mins < 30 : mins >= 30);
          if (!ok) return false;
        }
        if (f.difficulty && f.difficulty.length) {
          const d = String(recipe.difficulty || '').toLowerCase();
          const map = { easy: 'leicht', medium: 'medium', hard: 'schwer' };
          if (!f.difficulty.some(v => d === map[v])) return false;
        }
        if (f.cuisine && f.cuisine.length) {
          if (!f.cuisine.includes(this.getRecipeCuisine(recipe))) return false;
        }
        if (f.spice && f.spice.length) {
          if (!f.spice.includes(recipe.spice || 'mild')) return false;
        }
        return true;
      }


      // ===================== SOCIAL =====================
      ensureSocialSeed() {
        const raw = localStorage.getItem('social_posts');
        if (raw) { this.state.socialPosts = JSON.parse(raw); return; }
        const now = Date.now();
        const pick = (i) => (typeof allRecipes !== 'undefined' && allRecipes[i]) ? allRecipes[i] : null;
        const seed = [];
        const authors = ['Lena K.', 'Max B.', 'Sofia R.'];
        for (let i = 0; i < 3; i++) {
          const r = pick(i);
          if (!r) continue;
          seed.push({
            id: 'seed-' + i,
            recipeId: r.id,
            author: authors[i],
            createdAt: new Date(now - (i + 1) * 3600 * 1000 * 6).toISOString(),
            caption: ['So gut geworden! 🌿', 'Familie liebt es.', 'Beim nächsten Mal mehr Chili.'][i],
            photoDataUrl: null,
            likes: 5 + i * 3,
            likedByMe: false,
            comments: []
          });
        }
        this.state.socialPosts = seed;
        localStorage.setItem('social_posts', JSON.stringify(seed));
      }
      saveSocialPosts() { localStorage.setItem('social_posts', JSON.stringify(this.state.socialPosts)); }
      openSocialCreate() { this.state.socialCreateOpen = true; this.render(); }
      closeSocialCreate() { this.state.socialCreateOpen = false; this.render(); }
      createSocialPost() {
        const recipeSel = document.getElementById('social-recipe-select');
        const captionEl = document.getElementById('social-caption');
        const fileEl = document.getElementById('social-photo');
        if (!recipeSel || !recipeSel.value) { alert('Bitte ein Rezept auswählen.'); return; }
        const finish = (photoDataUrl) => {
          const post = {
            id: 'p-' + Date.now(),
            recipeId: recipeSel.value,
            author: 'Du',
            createdAt: new Date().toISOString(),
            caption: (captionEl && captionEl.value) || '',
            photoDataUrl: photoDataUrl || null,
            likes: 0, likedByMe: false, comments: []
          };
          this.state.socialPosts.unshift(post);
          this.saveSocialPosts();
          this.state.socialCreateOpen = false;
          this.render();
        };
        const file = fileEl && fileEl.files && fileEl.files[0];
        if (file) {
          if (file.size > 1500000) { alert('Foto ist zu groß (max ~1.5 MB).'); return; }
          const reader = new FileReader();
          reader.onload = e => finish(e.target.result);
          reader.readAsDataURL(file);
        } else { finish(null); }
      }
      toggleSocialLike(postId) {
        const p = this.state.socialPosts.find(x => x.id === postId);
        if (!p) return;
        p.likedByMe = !p.likedByMe;
        p.likes += p.likedByMe ? 1 : -1;
        this.saveSocialPosts();
        this.render();
      }
      addSocialComment(postId) {
        const input = document.getElementById('sc-input-' + postId);
        if (!input || !input.value.trim()) return;
        const p = this.state.socialPosts.find(x => x.id === postId);
        if (!p) return;
        p.comments.push({ id: 'c-' + Date.now(), author: 'Du', text: input.value.trim(), createdAt: new Date().toISOString() });
        this.saveSocialPosts();
        this.render();
      }
      deleteSocialPost(postId) {
        if (!confirm('Beitrag löschen?')) return;
        this.state.socialPosts = this.state.socialPosts.filter(p => p.id !== postId);
        this.saveSocialPosts();
        this.render();
      }
      shareSocialPost(postId) {
        const p = this.state.socialPosts.find(x => x.id === postId);
        const r = p && this.getRecipeById(p.recipeId);
        if (!r) return;
        const shareData = { title: r.title, text: (p.caption || '') + ' — ' + r.title, url: location.href };
        if (navigator.share) {
          navigator.share(shareData).catch(() => {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(shareData.text + ' ' + shareData.url);
          alert('In Zwischenablage kopiert.');
        }
      }
      timeAgo(iso) {
        const diff = (Date.now() - new Date(iso).getTime()) / 1000;
        if (diff < 60) return 'gerade eben';
        if (diff < 3600) return Math.floor(diff / 60) + ' Min';
        if (diff < 86400) return Math.floor(diff / 3600) + ' Std';
        return Math.floor(diff / 86400) + ' Tage';
      }
