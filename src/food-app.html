<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food4You - Multi-Select Fashion Filter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==================== GLOBAL STYLES ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1e;
      --primary: #ff6b6b;
      --secondary: #2ecc71;
      --accent: #f39c12;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --nav-bg: #1a1a1a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #root {
      height: 100%;
    }

    /* ==================== APP LAYOUT ==================== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 110px;
    }

    /* ==================== SWIPE STARTSEITE ==================== */
    .swipe-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 10px 15px;
      overflow: hidden;
    }

    /* Swipe-Tab ist ein fester Screen: kein vertikales/horizontales Scrollen */
    body.swipe-screen, body.swipe-screen #root { overflow: hidden; overscroll-behavior: none; }
    body.swipe-screen .content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding-bottom: 92px;
    }
    body.swipe-screen .content > .swipe-container { flex: 1 1 auto; min-height: 0; height: auto; }
    body.swipe-screen .swipe-topbar { flex: 0 0 auto; }

    .recipe-card {
      background: var(--bg-card);
      border-radius: 28px;
      width: 100%;
      max-width: 350px;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-category {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card-info {
      padding: 12px 18px 16px 18px;
      text-align: center;
      flex: 0 0 auto;
    }

    /* Badges auf der Karte: nie überlappend, automatisch umbrechend */
    .card-badges {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
      pointer-events: none;
    }
    .card-badges > * {
      position: static !important;
      margin: 0 !important;
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .card-meta-tags {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-buttons {
      display: flex;
      gap: 25px;
      justify-content: center;
    }

    .card-buttons button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card-buttons button:active { transform: scale(0.9); }

    .btn-pass { background: rgba(255, 107, 107, 0.15); border: 1px solid rgba(255, 107, 107, 0.3) !important; }
    .btn-pass svg { fill: var(--primary); width: 22px; height: 22px; }

    .btn-like { background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.3) !important; }
    .btn-like svg { fill: var(--secondary); width: 24px; height: 24px; }

    /* ==================== ADVANCED DISCOVER TAB ==================== */
    .discover-container {
      padding: 20px 15px;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      font-size: 15px;
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
    }

    .search-input:focus { border-color: var(--primary); }

    /* Suchverlauf Styles */
    .history-container {
      margin: -10px 0 20px 2px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .history-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .history-badge {
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .history-badge:active { background: rgba(255, 255, 255, 0.1); }
    .history-delete { color: var(--primary); font-weight: bold; cursor: pointer; font-size: 10px; }

    /* Mode-Seiten Steuerungsleiste */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 20px;
      align-items: stretch;
      position: relative;
    }

    .filter-group-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-trigger-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      position: relative;
    }

    .filter-trigger-btn:hover {
      background: rgba(255,255,255,0.08);
    }

    .filter-trigger-btn.active-filter {
      border-color: rgba(255, 107, 107, 0.4);
      background: rgba(255, 107, 107, 0.12);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(255,107,107,0.2);
    }

    .filter-panel {
      background: rgba(20,20,20,0.98);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      min-width: 220px;
      max-width: 100%;
      margin-top: 6px;
      z-index: 20;
      position: relative;
    }

    .filter-section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 2px 4px 0;
    }

    .filter-option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-main);
      background: rgba(255,255,255,0.03);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .filter-option-row.active-option {
      background: rgba(255, 107, 107, 0.16);
      color: var(--primary);
    }

    .filter-option-row input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .filter-actions button {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-clear-filters {
      background: rgba(255,255,255,0.08);
      color: var(--text-main);
    }

    .btn-apply-filters {
      background: var(--primary);
      color: #000000;
    }

    /* Kategorie Überschriften */
    .diet-section-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin: 18px 0 10px 2px;
      letter-spacing: 0.3px;
    }

    .discover-diet-section {
      margin: 12px 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      overflow: hidden;
    }

    .discover-diet-toggle,
    .discover-cuisine-toggle {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .discover-diet-toggle {
      font-size: 16px;
      color: var(--text-main);
    }

    .discover-cuisine-toggle {
      font-size: 13px;
      color: #f0f0f0;
      padding-left: 18px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .discover-toggle-icon {
      font-size: 13px;
      width: 14px;
      display: inline-block;
      color: var(--text-muted);
    }

    .discover-diet-body {
      padding: 0 10px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .discover-cuisine-block {
      border-left: 2px solid rgba(255, 255, 255, 0.08);
      padding-left: 4px;
      margin-left: 4px;
    }

    .discover-cuisine-body {
      overflow: hidden;
      max-height: 2200px;
      opacity: 1;
      transition: max-height 0.25s ease, opacity 0.2s ease;
      padding-left: 2px;
    }

    .discover-cuisine-body.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .cuisine-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #f0f0f0;
      margin: 8px 0 8px 4px;
      letter-spacing: 0.2px;
    }

    .grid-3-columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .grid-item-text-only {
      cursor: pointer;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 105px;
      transition: background 0.2s, border-color 0.2s;
    }

    .grid-item-text-only:active {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .grid-item-title {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .grid-item-meta { font-size: 9px; color: var(--text-muted); }

    /* ==================== SHOPPING LIST ==================== */
    .shopping-container { padding: 20px 15px; }

    .shopping-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: var(--bg-card);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .shopping-item.done { opacity: 0.4; }

    .shopping-item label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .shopping-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--secondary); }
    .btn-delete { background: none; border: none; font-size: 16px; cursor: pointer; }

    /* ==================== FAVORITES ==================== */
    .favorites-container { padding: 20px 15px; }

    .favorites-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .favorite-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .favorite-card-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .favorite-card-summary-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .favorite-card img {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .favorite-card-content {
      flex: 1;
      min-width: 0;
    }

    .favorite-card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .favorite-card-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .favorite-card-action {
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.2);
      color: var(--primary);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .favorite-card-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 82px;
    }

    .favorite-card-arrow {
      color: var(--text-muted);
      font-size: 16px;
      flex-shrink: 0;
    }

    .favorite-card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .favorite-card-actions button {
      border: none;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .favorite-card-open {
      background: rgba(255,255,255,0.08);
      color: var(--text-main);
    }

    .empty-state {
      color: var(--text-muted);
      padding: 24px 10px;
      text-align: center;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.08);
      line-height: 1.5;
    }

    /* ==================== MODAL BIG VIEW ==================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-content {
      background: var(--bg-card);
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 30px 30px 0 0;
      padding: 25px 20px;
    }

    .modal-image {
      width: min(100%, 260px);
      height: 320px;
      border-radius: 24px;
      object-fit: cover;
      object-position: center;
      margin: 0 auto 15px auto;
      display: block;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .btn-shopping-big {
      width: 100%;
      padding: 14px;
      background: var(--secondary);
      color: var(--text-main);
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
    }

    .favorite-ingredient-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .favorite-ingredient-add {
      background: rgba(46, 204, 113, 0.14);
      border: 1px solid rgba(46, 204, 113, 0.25);
      color: var(--secondary);
      width: 26px;
      height: 26px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .modal-actions button {
      flex: 1;
      min-width: 140px;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-main);
    }

    .btn-outline {
      background: rgba(255,255,255,0.08);
    }

    .btn-favorite-toggle {
      background: rgba(255, 107, 107, 0.15);
      color: var(--primary);
    }

    .ingredient-filter {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text-main);
      margin-bottom: 12px;
      font-size: 14px;
    }

    .ingredients-list {
      list-style: none;
      margin-bottom: 16px;
    }

    .ingredients-list li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .ingredients-list .ingredient-name { color: var(--text-main); }
    .ingredient-add-btn {
      background: rgba(46, 204, 113, 0.14);
      border: 1px solid rgba(46, 204, 113, 0.25);
      color: var(--secondary);
      width: 26px;
      height: 26px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ingredients-list .ingredient-qty { color: var(--text-muted); font-size: 12px; white-space: nowrap; }

    .instruction-list {
      list-style: decimal;
      padding-left: 18px;
      color: var(--text-main);
    }

    .instruction-list li {
      padding: 6px 0;
      line-height: 1.5;
      color: var(--text-main);
    }

    /* ==================== BOTTOM NAVBAR ==================== */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      background: var(--nav-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      height: 80px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .nav-btn.active { color: var(--primary); }
    .nav-btn .nav-label { font-size: 10px; font-weight: 600; }
    .nav-icon svg { width: 26px; height: 26px; display: block; }


    /* ==================== PROFILE TAB ==================== */
    .profile-container { display: flex; flex-direction: column; gap: 20px; }
    .profile-header { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0 10px; }
    .profile-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--bg-card); display: flex; align-items: center; justify-content: center;
      font-size: 40px; border: 1px solid rgba(255,255,255,0.08);
    }
    .profile-name { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .profile-email { font-size: 12px; color: var(--text-muted); margin-top: -4px; }
    .profile-account-btn {
      margin-top: 6px;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .profile-account-btn.primary { background: var(--primary); border-color: transparent; }
    .profile-account-btn:hover { filter: brightness(1.08); }
    .profile-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .profile-stat {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 12px 6px;
      text-align: center;
      min-width: 0;
    }
    .profile-stat-value { font-size: 20px; font-weight: 800; color: var(--text-main); line-height: 1.1; }
    .profile-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
    @media (max-width: 360px) {
      .profile-stat-value { font-size: 17px; }
      .profile-stat-label { font-size: 10px; }
    }
    .profile-menu { display: flex; flex-direction: column; gap: 10px; }
    .profile-menu-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05);
      color: var(--text-main); padding: 14px 16px; border-radius: 16px;
      font-size: 15px; font-weight: 600; text-align: left; cursor: pointer;
      transition: background 0.15s;
    }
    .profile-menu-row:hover { background: rgba(255,255,255,0.04); }
    .profile-menu-icon { font-size: 22px; width: 28px; text-align: center; }
    .profile-menu-label { flex: 1; }
    .profile-menu-hint { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .profile-menu-arrow { color: var(--text-muted); font-size: 20px; }

    .profile-subpage { display: flex; flex-direction: column; }
    .profile-subpage-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
      background: var(--bg-dark); position: sticky; top: 0; z-index: 5;
    }
    .profile-back-btn {
      background: transparent; border: none; color: var(--text-main);
      font-size: 24px; width: 40px; height: 40px; border-radius: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .profile-back-btn:hover { background: rgba(255,255,255,0.05); }
    .profile-subpage-title { font-size: 17px; font-weight: 700; color: var(--text-main); }
    .profile-subpage-body { padding: 16px 15px; }

    /* Swipe top filter bar */
    .swipe-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px 0;
      gap: 8px;
    }
    .swipe-topbar-spacer { flex: 0 0 auto; }
    .swipe-filter-btn {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swipe-filter-btn.has-active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .swipe-filter-panel {
      margin: 10px 15px 0;
      background: var(--nav-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px;
    }
    .swipe-filter-group { margin-bottom: 10px; }
    .swipe-filter-group-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .swipe-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .swipe-chip {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .swipe-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .swipe-filter-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .swipe-filter-actions button {
      flex: 1;
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .swipe-filter-actions button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* History button (topbar, mirrors filter button) */
    .history-topbar-btn { }

    /* Favorites options (3-dot menu) */
    .fav-options-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0 12px; gap: 8px;
    }
    .fav-options-btn {
      background: rgba(255,255,255,0.06);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .fav-options-menu {
      position: absolute; right: 15px; top: 60px;
      background: var(--nav-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 6px;
      z-index: 150;
      min-width: 180px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .fav-options-menu button {
      display: block; width: 100%; text-align: left;
      background: transparent; color: var(--text-main);
      border: none; padding: 10px 12px; border-radius: 8px;
      font-size: 13px; cursor: pointer;
    }
    .fav-options-menu button:hover { background: rgba(255,255,255,0.06); }

    /* Cooked mark */
    .cooked-mark-btn {
      background: rgba(46, 204, 113, 0.15);
      color: var(--secondary);
      border: 1px solid rgba(46, 204, 113, 0.3);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .cooked-mark-btn.done { background: var(--secondary); color: #fff; border-color: var(--secondary); }
    .cooked-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Cooked history grid */
    .cooked-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 4px 0 20px;
    }
    .cooked-tile {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .cooked-tile img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    .cooked-tile-body { padding: 6px 8px 8px; }
    .cooked-tile-title { font-size: 11px; font-weight: 700; line-height: 1.2; margin-bottom: 3px; }
    .cooked-tile-date { font-size: 10px; color: var(--text-muted); }
    .cooked-tile-note { font-size: 10px; color: var(--text-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .cooked-detail textarea {
      width: 100%; min-height: 100px;
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 10px;
      font-family: inherit; font-size: 13px; resize: vertical;
    }

    /* Social tab */
    .social-container { padding: 12px 15px 20px; }
    .social-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .social-header h2 { font-size: 22px; }
    .social-create-btn {
      background: var(--primary); color: #fff; border: none;
      border-radius: 999px; padding: 8px 14px;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .social-post {
      background: var(--bg-card);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .social-post-head {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
    }
    .social-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; font-size: 14px;
    }
    .social-author { font-size: 13px; font-weight: 700; }
    .social-time { font-size: 11px; color: var(--text-muted); }
    .social-post-image { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background:#000; }
    .social-post-actions {
      display: flex; gap: 14px; padding: 10px 12px 6px;
    }
    .social-action-btn {
      background: transparent; color: var(--text-main); border: none;
      cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px;
    }
    .social-action-btn.liked { color: var(--primary); }
    .social-post-body { padding: 4px 12px 12px; font-size: 13px; }
    .social-post-recipe { font-weight: 700; margin-bottom: 4px; }
    .social-comments { padding: 0 12px 12px; }
    .social-comment { font-size: 12px; margin-bottom: 4px; }
    .social-comment strong { margin-right: 4px; }
    .social-comment-input {
      display: flex; gap: 6px; padding: 0 12px 12px;
    }
    .social-comment-input input {
      flex: 1; background: rgba(255,255,255,0.05);
      color: var(--text-main); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px; padding: 7px 12px; font-size: 12px;
    }
    .social-comment-input button {
      background: var(--primary); color: #fff; border: none;
      border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .social-create-sheet select,
    .social-create-sheet textarea,
    .social-create-sheet input[type=file] {
      width: 100%; background: rgba(255,255,255,0.05);
      color: var(--text-main); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 10px; margin-bottom: 10px;
      font-family: inherit; font-size: 13px;
    }
    .social-create-sheet textarea { min-height: 80px; resize: vertical; }
    .social-empty { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px; }

    /* History bottom sheet */
    .history-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .history-sheet {
      background: var(--nav-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
      max-height: 70vh;
      overflow-y: auto;
    }
    .history-sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-sheet-title { font-size: 16px; font-weight: 700; }
    .history-sheet-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
    }
    .history-item:active { background: rgba(255,255,255,0.06); }
    .history-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .history-item-title { font-size: 13px; font-weight: 600; }
    .history-item-meta { font-size: 11px; color: var(--text-muted); }

    /* Clear favorites button */
    .clear-favs-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .clear-favs-btn:active { background: rgba(255,255,255,0.06); }

    /* Empty deck message */
    .swipe-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .swipe-empty button {
      margin-top: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Cook-Mode Step-Übergänge (weich, kein Flackern) */
    .cook-body { position: relative; overflow: hidden; }
    .cook-step-anim {
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    @keyframes cookStepEnterNext {
      from { opacity: 0; transform: translate3d(24px,0,0); }
      to   { opacity: 1; transform: translate3d(0,0,0); }
    }
    @keyframes cookStepExitNext {
      from { opacity: 1; transform: translate3d(0,0,0); }
      to   { opacity: 0; transform: translate3d(-24px,0,0); }
    }
    @keyframes cookStepEnterPrev {
      from { opacity: 0; transform: translate3d(-24px,0,0); }
      to   { opacity: 1; transform: translate3d(0,0,0); }
    }
    @keyframes cookStepExitPrev {
      from { opacity: 1; transform: translate3d(0,0,0); }
      to   { opacity: 0; transform: translate3d(24px,0,0); }
    }
    .cook-step-enter-next { animation: cookStepEnterNext .22s ease both; }
    .cook-step-exit-next  { position: absolute; inset: 0; animation: cookStepExitNext .22s ease both; }
    .cook-step-enter-prev { animation: cookStepEnterPrev .22s ease both; }
    .cook-step-exit-prev  { position: absolute; inset: 0; animation: cookStepExitPrev .22s ease both; }
    .cook-progress-bar { transition: width .25s ease; }

    /* Premium Popup */
    .premium-popup-overlay { background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); }
    .premium-popup {
      max-width: 340px; width: 92%; margin: auto;
      background: linear-gradient(160deg, #1a1a1f 0%, #2b1f10 100%);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 20px; padding: 28px 22px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,215,0,0.15) inset;
      color: #fff;
    }
    .premium-popup-icon { font-size: 46px; margin-bottom: 8px; filter: drop-shadow(0 4px 12px rgba(255,200,0,0.5)); }
    .premium-popup-title { font-size: 22px; font-weight: 700; margin: 4px 0 10px; letter-spacing: .3px; }
    .premium-popup-text { font-size: 14px; color: rgba(255,255,255,0.78); margin-bottom: 20px; line-height: 1.5; }
    .premium-popup-cta {
      width: 100%; padding: 13px 16px; border: none; border-radius: 12px;
      background: linear-gradient(135deg,#ffd76a,#f5a623);
      color: #221a00; font-weight: 700; font-size: 15px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(245,166,35,0.35);
    }
    .premium-popup-cta:hover { filter: brightness(1.05); }
    .premium-popup-close {
      margin-top: 10px; width: 100%; padding: 10px; background: transparent;
      border: none; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer;
    }

    /* Weekplan – Wochennavigation */
    .weekplan-week-nav { display:flex; gap:6px; margin-bottom:14px; }
    .weekplan-week-btn {
      flex:1; padding:9px 10px; border-radius:999px; font-size:12px; font-weight:700;
      background:rgba(255,255,255,0.05); color:var(--text-muted);
      border:1px solid var(--hairline, rgba(255,255,255,0.08)); cursor:pointer;
    }
    .weekplan-week-btn.active { background:var(--primary, #FF6B35); color:#17110C; border-color:transparent; }
    .weekplan-week-btn.locked { opacity:.7; }


    /* Zutaten-Panel im Kochmodus */
    .cook-ingredients {
      margin-top: 14px;
      padding: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }
    .cook-ingredients-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .cook-ingredients-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .cook-ingredients-list li {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 14px;
    }
    .cook-ingredients-list .qty { color: var(--primary); font-weight: 600; white-space: nowrap; }

    /* Swipe-Ad-/Influencer-Karten */
    .swipe-ad-card, .swipe-influencer-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      color: #fff;
    }
    .swipe-ad-card {
      background: linear-gradient(140deg, #2b2b2b, #1a1a1a);
      border: 1px dashed rgba(255,255,255,0.25);
    }
    .swipe-ad-card .ad-badge {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .swipe-ad-card .ad-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .swipe-ad-card .ad-sub { font-size: 13px; color: var(--text-muted); }
    .swipe-influencer-card {
      background: linear-gradient(140deg, #3a1d5a, #1a1a1a);
      border: 1px solid rgba(255,107,107,0.4);
    }
    .influencer-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--primary); color:#fff;
      padding: 4px 10px; border-radius: 999px; font-size: 11px;
      font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .recipe-card .influencer-tag { position: absolute; top: 12px; left: 12px; z-index: 3; }

    .swipe-skip-ad {
      margin-top: 16px;
      background: rgba(255,255,255,0.08); color:#fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 16px; border-radius: 999px; font-weight: 600; cursor: pointer;
    }


  
    /* ==================== PORTIONSRECHNER ==================== */
    .portion-calc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 12px 16px;
      margin: 4px 0 18px 0;
    }
    .portion-calc-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .portion-calc-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .portion-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .portion-btn:active { transform: scale(0.9); }
    .portion-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .portion-count {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      min-width: 22px;
      text-align: center;
    }
    .btn-cook-start {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #ff8f6b);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 20px rgba(255,107,107,0.25);
    }
    .btn-cook-start:active { transform: scale(0.98); }

    /* ==================== KOCHMODUS ==================== */
    .cook-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0f0f10 0%, #0a0a0b 100%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
      animation: cookFadeIn 0.28s cubic-bezier(0.2, 0.7, 0.2, 1);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    @keyframes cookFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cook-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .cook-title-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cook-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .cook-title-recipe {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cook-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .cook-header-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(243, 156, 18, 0.15);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      border: 1px solid rgba(243, 156, 18, 0.3);
      cursor: pointer;
    }
    .cook-header-chip.pulsing { animation: cookPulse 1.8s ease-in-out infinite; }
    .cook-header-chip.paused  { opacity: 0.7; }
    .cook-header-chip.done    { background: rgba(46,204,113,0.15); color: var(--secondary); border-color: rgba(46,204,113,0.35); }
    .cook-icon-btn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .cook-icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.14); }
    .cook-progress {
      height: 8px;
      width: 100%;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .cook-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #ff9b7a);
      transition: width 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      box-shadow: 0 0 12px rgba(255,107,107,0.35);
    }
    .cook-body {
      flex: 1;
      overflow-y: auto;
      padding: 36px 24px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      touch-action: pan-y;
      position: relative;
    }
    .cook-step-anim {
      animation: cookStepIn 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    @keyframes cookStepIn {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .cook-step-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

  <script>
    // ================= AppStorage =================
    // Trennt Gast- und Benutzer-Daten sauber über Namespaces:
    //   guest:<key>         -> Daten des Gastnutzers
    //   user:<uid>:<key>    -> Daten eines eingeloggten Nutzers
    // Auth-Session bleibt global (food4you_auth) und wird nicht namespaced.
    // Vorbereitet für spätere Supabase-Sync: alle Schreibzugriffe laufen
    // durch AppStorage.setItem und können zentral gespiegelt werden.
    (function(){
      var DATA_KEYS = [
        'preferences','favs','shop','search_hist','swipe_hist','swipe_filters',
        'cooked_log','fav_filters','week_plan','pantry','swipe_source',
        'fav_collections','recipe_ratings_v1'
      ];
      var NS_KEY = 'f4y_active_ns';
      var MIGRATED_KEY = 'f4y_migrated_v1';

      function readNs() {
        try { return localStorage.getItem(NS_KEY) || 'guest'; } catch(e) { return 'guest'; }
      }
      var currentNs = readNs();

      // Einmalige Migration alter (nicht namespaced) Keys -> guest:
      try {
        if (!localStorage.getItem(MIGRATED_KEY)) {
          for (var i=0;i<DATA_KEYS.length;i++) {
            var k = DATA_KEYS[i];
            var v = localStorage.getItem(k);
            if (v !== null && localStorage.getItem('guest:'+k) === null) {
              localStorage.setItem('guest:'+k, v);
            }
          }
          localStorage.setItem(MIGRATED_KEY, '1');
        }
      } catch(e) {}

      function prefixed(key) { return currentNs + ':' + key; }

      window.AppStorage = {
        DATA_KEYS: DATA_KEYS,
        getNamespace: function(){ return currentNs; },
        setNamespace: function(ns) {
          currentNs = ns || 'guest';
          try { localStorage.setItem(NS_KEY, currentNs); } catch(e){}
        },
        setUser: function(user) {
          this.setNamespace(user && user.id ? ('user:' + user.id) : 'guest');
        },
        getItem: function(key) {
          try { return localStorage.getItem(prefixed(key)); } catch(e) { return null; }
        },
        setItem: function(key, value) {
          try { localStorage.setItem(prefixed(key), value); } catch(e) {}
          // Für eingeloggte Nutzer zusätzlich in die Cloud spiegeln.
          // CloudSync entscheidet selbst, welche Keys synchronisiert werden.
          try {
            if (currentNs.indexOf('user:') === 0 && window.CloudSync && window.CloudSync.enabled) {
              var uid = currentNs.slice(5);
              window.CloudSync.push(uid, key, value);
            }
          } catch(e) {}
        },
        removeItem: function(key) {
          try { localStorage.removeItem(prefixed(key)); } catch(e) {}
          try {
            if (currentNs.indexOf('user:') === 0 && window.CloudSync && window.CloudSync.enabled) {
              var uid2 = currentNs.slice(5);
              window.CloudSync.remove(uid2, key);
            }
          } catch(e) {}
        }
      };
    })();

    // ================= CloudSync =================
    // Zentrale Sync-Schicht hinter AppStorage. Nur eingeloggte Nutzer
    // synchronisieren; Gast bleibt rein lokal.
    //
    // Erweiterbar: neue Bereiche einfach in SYNC_KEYS aufnehmen.
    // Alle Daten landen in EINER Tabelle (public.user_app_state) mit
    // (user_id, key) als Primary Key und value als jsonb -> keine Schema-
    // Änderungen nötig, wenn später Einkaufsliste, Vorratsschrank oder
    // Kochverlauf ergänzt werden.
    (function(){
      var SYNC_KEYS = ['preferences', 'favs', 'shop', 'pantry', 'cooked_log', 'week_plan'];
      var TABLE = 'user_app_state';
      var pendingPush = {}; // debounce pro (uid,key)

      window.CloudSync = {
        SYNC_KEYS: SYNC_KEYS,
        enabled: false,
        client: null,
        setClient: function(supabase) {
          this.client = supabase || null;
          this.enabled = !!supabase;
        },
        isSyncKey: function(key) { return SYNC_KEYS.indexOf(key) !== -1 },
        // Lädt alle Cloud-Werte des Nutzers in dessen lokalen Namespace.
        pull: async function(user) {
          if (!this.client || !user || !user.id) return;
          try {
            var res = await this.client
              .from(TABLE)
              .select('key, value')
              .eq('user_id', user.id);
            if (res.error) {
              console.warn('[CloudSync] pull failed', res.error.message || res.error);
              return;
            }
            var rows = res.data || [];
            for (var i = 0; i < rows.length; i++) {
              var row = rows[i];
              if (!this.isSyncKey(row.key)) continue;
              try {
                var serialized = typeof row.value === 'string' ? row.value : JSON.stringify(row.value);
                localStorage.setItem('user:' + user.id + ':' + row.key, serialized);
              } catch (e) {}
            }
          } catch (e) {
            console.warn('[CloudSync] pull exception', e && e.message);
          }
        },
        // Upsert (debounced) eines Keys für den Nutzer.
        push: function(uid, key, rawValue) {
          if (!this.client || !uid || !this.isSyncKey(key)) return;
          var self = this;
          var slot = uid + '::' + key;
          if (pendingPush[slot]) clearTimeout(pendingPush[slot]);
          pendingPush[slot] = setTimeout(function(){
            pendingPush[slot] = null;
            var value;
            try { value = JSON.parse(rawValue); } catch (e) { value = rawValue; }
            self.client
              .from(TABLE)
              .upsert({ user_id: uid, key: key, value: value, updated_at: new Date().toISOString() }, { onConflict: 'user_id,key' })
              .then(function(res){
                if (res && res.error) console.warn('[CloudSync] push failed', key, res.error.message || res.error);
              });
          }, 250);
        },
        remove: function(uid, key) {
          if (!this.client || !uid || !this.isSyncKey(key)) return;
          this.client.from(TABLE).delete().eq('user_id', uid).eq('key', key)
            .then(function(res){
              if (res && res.error) console.warn('[CloudSync] remove failed', key, res.error.message || res.error);
            });
        }
      };
    })();
  </script>

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    // Automatische Schärfe-Zuordnung
    (function assignSpice() {
      const hotWords = /(vindaloo|habanero|ghost pepper|feuer|extra scharf)/i;
      const spicyWords = /(chili|chilli|scharf|jalape|sriracha|kimchi|curry|masala|szechuan|sichuan|sambal|harissa|piri|salsa picante|arrabbiata|diavola)/i;
      const mediumWords = /(paprika|salsa|taco|burrito|enchilada|thai|indisch|mexikan|korean|ramen|pad thai|kebab|döner|tikka|tandoori|gulasch|chorizo|jerk)/i;
      for (const r of allRecipes) {
        if (r.spice) continue;
        const hay = [r.title, r.category, r.cuisine, (r.ingredients||[]).map(i => typeof i === 'string' ? i : i.name).join(' ')].join(' ');
        if (hotWords.test(hay)) r.spice = 'very-hot';
        else if (spicyWords.test(hay)) r.spice = 'hot';
        else if (mediumWords.test(hay)) r.spice = 'medium';
        else r.spice = 'mild';
      }
    })();

      async switchUser(user) {

          // Gast-Namespace komplett zurücksetzen -> "frischer Gast" nach Logout
          try {
            for (var i = 0; i < AppStorage.DATA_KEYS.length; i++) {

      // ===== Search helpers =====
      normalizeText(str) {

          .toLowerCase()
          .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')

              d[i - 1][j] + 1,
              d[i][j - 1] + 1,

      }

      // ===== Swipe deck =====
      matchesSwipeFilters(recipe) {
        if (!this.matchesPreferences(recipe)) return false;
        const f = this.state.swipeFilters;
        // Diet OR
        if (f.diet && f.diet.length > 0) {
          if (!f.diet.includes(recipe.diet)) return false;
        }
        // Calories: 'under-500' | 'over-500'
        if (f.calories && f.calories.length > 0) {
          const kcal = this.getCaloriesValue(recipe.calories);
          const ok = f.calories.some(v => v === 'under-500' ? kcal < 500 : kcal >= 500);
          if (!ok) return false;
        }
        // Time: 'under-30' | 'over-30'
        if (f.time && f.time.length > 0) {
          const mins = this.getTimeValue(recipe.time);
          const ok = f.time.some(v => v === 'under-30' ? mins < 30 : mins >= 30);
          if (!ok) return false;
        }
        // Difficulty
        if (f.difficulty && f.difficulty.length > 0) {
          const d = String(recipe.difficulty || '').toLowerCase();
          const map = { easy: 'leicht', medium: 'medium', hard: 'schwer' };
          const ok = f.difficulty.some(v => d === map[v]);
          if (!ok) return false;
        }
        // Servings
        if (f.servings && f.servings.length > 0) {
          const s = parseInt(String(recipe.servings || '0').match(/\d+/)?.[0] || '0', 10);
          const ok = f.servings.some(v => v === '1-2' ? (s >= 1 && s <= 2) : s >= 3);
          if (!ok) return false;
        }
        // Küche
        if (f.cuisine && f.cuisine.length > 0) {

        if (f.spice && f.spice.length > 0) {

      getSwipeDeck() {
        let filtered = allRecipes.filter(r => this.matchesSwipeFilters(r));
        const source = this.state.swipeSource || 'all';
        if (source === 'viral') {
          filtered = filtered.filter(r => !!r.isInfluencer);
        }
        const key = source + ':' + JSON.stringify(this.state.swipeFilters) + ':' + filtered.length;
        if (!this.state.swipeOrder || this.state.swipeOrderKey !== key) {
          const ordered = source === 'viral' ? this.shuffle(filtered) : this.shuffle(filtered);
          // Baue ein Deck mit eingestreuten Werbe- und Influencer-Karten.
          // Nur im Standard-"all"-Modus einstreuen – im Viral-Tab bleiben es
          // ausschließlich Influencer-Rezepte.
          const rawIds = ordered.map(r => r.id);
          if (source === 'all') {
            const deck = [];
            let normalCount = 0;
            let influencerPool = allRecipes.filter(r => r.isInfluencer).map(r => r.id);
            let infIdx = 0;
            let adCounter = 0;
            let infCounter = 0;
            for (let i = 0; i < rawIds.length; i++) {
              deck.push(rawIds[i]);
              normalCount++;
              // Nach jeweils 10 normalen Rezepten → Ad-Karte
              if (normalCount % 10 === 0) {
                adCounter++;
                deck.push('__ad_' + adCounter);
              }
              // Nach jeweils 20 normalen Rezepten → Influencer-Karte (zusätzlich, nicht statt Ad)
              if (normalCount % 20 === 0 && influencerPool.length) {
                infCounter++;
                const infId = influencerPool[infIdx % influencerPool.length];
                infIdx++;
                deck.push('__inf_' + infCounter + '_' + infId);
              }
            }
            this.state.swipeOrder = deck;
          } else {
            this.state.swipeOrder = rawIds;
          }
          this.state.swipeOrderKey = key;
          this.state.currentIndex = 0;
        }
        const ids = this.state.swipeOrder;
        if (!ids.length) return { recipe: null, empty: true };
        const idx = ((this.state.currentIndex % ids.length) + ids.length) % ids.length;
        const id = ids[idx];
        if (typeof id === 'string' && id.indexOf('__ad_') === 0) {
          return { recipe: null, empty: false, ad: { id } };
        }
        if (typeof id === 'string' && id.indexOf('__inf_') === 0) {
          const realId = id.split('_').slice(3).join('_') || id.split('_').pop();
          const rec = allRecipes.find(r => r.id === realId);
          return { recipe: rec, empty: false, influencer: true };
        }
        const recipe = allRecipes.find(r => r.id === id);
        return { recipe, empty: false, influencer: !!(recipe && recipe.isInfluencer) };
      }
      setSwipeSource(src) {
        if (this.state.swipeSource === src) { return; }
        this.state.swipeSource = src;
        try { AppStorage.setItem('swipe_source', src); } catch (e) {}
        this.state.swipeOrder = null;
        this.render();
      }
      rankForYou(candidates) {
        const favs = this.state.favorites || [];
        const cooked = this.state.cookedLog || [];
        const swipeHist = this.state.swipeHistory || [];
        const favIds = new Set(favs.map(f => f.id));
        const cookCount = {};
        cooked.forEach(c => { const id = c && c.recipeId; if (id) cookCount[id] = (cookCount[id] || 0) + 1; });
        const cuisineW = {}, dietW = {}, spiceW = {}, timeW = {}, diffW = {};
        const bump = (map, key, w) => { if (key === undefined || key === null || key === '') return; map[key] = (map[key] || 0) + w; };
        const timeBucket = (r) => { const m = this.getTimeValue(r.time); if (m < 20) return 'short'; if (m < 40) return 'medium'; return 'long'; };
        favs.forEach(r => { bump(cuisineW, this.getRecipeCuisine(r), 3); bump(dietW, r.diet, 2); bump(spiceW, r.spice || 'mild', 1.5); bump(timeW, timeBucket(r), 1); bump(diffW, String(r.difficulty||'').toLowerCase(), 1); });
        Object.keys(cookCount).forEach(id => {
          const r = allRecipes.find(x => x.id === id); if (!r) return;
          const n = cookCount[id];
          bump(cuisineW, this.getRecipeCuisine(r), 2 * n);
          bump(dietW, r.diet, n);
          bump(spiceW, r.spice || 'mild', n);
          bump(timeW, timeBucket(r), n);
          bump(diffW, String(r.difficulty||'').toLowerCase(), n);
        });
        let ratings = {};
        try { ratings = JSON.parse(AppStorage.getItem('recipe_ratings_v1') || '{}'); } catch (e) {}
        Object.keys(ratings).forEach(id => {
          const stats = ratings[id]; if (!stats || !stats.avg) return;
          const r = allRecipes.find(x => x.id === id); if (!r) return;
          const w = (stats.avg - 3);
          if (Math.abs(w) < 0.1) return;
          bump(cuisineW, this.getRecipeCuisine(r), w);
          bump(dietW, r.diet, w * 0.5);
        });
        const seen = new Set(swipeHist);
        const scored = candidates.map(r => {
          let score = 0;
          score += (cuisineW[this.getRecipeCuisine(r)] || 0) * 1.4;
          score += (dietW[r.diet] || 0) * 1.2;
          score += (spiceW[r.spice || 'mild'] || 0);
          score += (timeW[timeBucket(r)] || 0) * 0.8;
          score += (diffW[String(r.difficulty||'').toLowerCase()] || 0) * 0.5;
          score += (cookCount[r.id] || 0) * 2;
          if (favIds.has(r.id)) score -= 1.5;
          if (seen.has(r.id)) score -= 0.5;
          score += Math.random() * 0.9;

        for (let i = 0; i < N; i++) {
          if ((i + 1) % 5 === 0 && ri < rest.length) merged.push(rest[ri++]);

        return merged;
      }
      findSimilarRecipes(recipe, count) {
        count = count || 4;
